# Datas incompletas/inferidas são provisórias e estão marcadas A CONFIRMAR; não são certificação de vigência.
# Tipos e ramos seguem o contrato existente: atas, políticas, regulamentos, relatórios e ofícios usam manual;
# instruções normativas usam resolucao. Filhotes e documentos de vários ramos ficam sem branch.
# Versão "1" sem edição explícita é identificador catalográfico, não afirmação de primeira edição.
# Arquivos idênticos entram uma vez. PDFs sem texto usam cópia OCR em ocr/, preservando o original.
# Proveniência completa (URLs, listagens, hashes, duplicatas e OCR): fontes.yaml. Critérios: README.md.
