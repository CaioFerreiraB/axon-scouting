# Taxonomia do acervo: o mapeamento semântico do mantenedor ("Mapeamento de documentos.csv", 2026-10-27) e as linhas
# inferidas pelo mesmo padrão para os documentos do corpus que ele não cobre (`origem: inferido`).
#
# Cada entrada é uma pasta de corpus/ — `<categoria>/<subcategoria>/<nível>` —, e todo arquivo do corpus mora numa
# delas. A subcategoria vazia vira o plural do tipo ("Regulamento" → `regulamentos`); o nível vazio ou "-" não vira
# pasta. Documento de uma região fica numa subpasta da entrada com o nome dela (`conselho-consultivo/atas/regional/
# sao-paulo/`, `diretoria-regional/resolucoes/sao-paulo/`), e o de uma unidade local, numa com o nome da unidade
# (`…/local/<uel>/`). As cópias OCR repetem o caminho do original sob `ocr/`.
#
# O `tipo` é o tipo semântico do documento — mais fino que o `type` do `corpus.yaml`, que o contrato da 102 limita a
# seis valores — e dá o perfil de estrutura padrão do documento (`estrutura.yaml`, `profile_by_type`).
version: 1

