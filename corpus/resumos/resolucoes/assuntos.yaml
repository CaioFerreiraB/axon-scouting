# Assuntos das resoluções vigentes que a ementa não resolve por regra (spec 106 G5, FR-020; research R22).
#
# Proposta de modelo offline — Claude (claude-opus-5-5), lendo a ementa e a 1ª página na sessão do G5, em 2026-11-11,
# no lugar da rodada paga pelo OpenRouter (decisão do mantenedor). O build confere cada proposta: a entidade tem de
# estar no catálogo curado e o trecho, num trecho da própria resolução; só então entra o SOBRE `modelo_conferido`.
#
# Critério: a resolução disciplina a entidade (não só a menciona). Ato individual (comissão de medalha para uma
# pessoa, intervenção num grupo), orçamento, registro, governança e órgãos ficam sem assunto: o catálogo curado não
# tem entidade para eles, e órgão e instituição já vêm de EMITIDO_POR e APLICA_SE_A. Medalha não é
# conceito:reconhecimento, que no catálogo é o Reconhecimento de Ramo.
