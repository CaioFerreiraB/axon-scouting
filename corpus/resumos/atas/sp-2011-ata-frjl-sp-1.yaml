reuniao:
  tipo: ordinaria
  data: '2011-03-26'
  local: sede do 013º/SP – Grupo Escoteiro do Mar Almirante Barroso, Rua São Paulo, 40, Vila Mathias, Santos, São Paulo
deliberacoes:
- tema: Composição da Mesa Diretora dos Trabalhos
  decisao: 'foi eleita, por aclamação, a Mesa Diretora dos trabalhos, conforme segue: Presidente – Guilherme Novaes (254/SP);
    Vice-Presidente – Thiago Bueno (16/SP); Primeiro Secretário – Olin Brambilla (274/SP); Segunda Secretária – Lívia Gargaro
    (199/SP).'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: Relatório de Gestão 2008/2010 do Núcleo Paulista de Jovens Líderes
  decisao: Relatório aprovado por unanimidade.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Coordenadores dos Grupos de Trabalho
  decisao: 'foram eleitos, por aclamação, os seguintes coordenadores de Grupos de Trabalho (GT’s): Lívia Gargaro (199/SP)
    – Coordenadora do GT organizador da 2ª Oficina de Novas Idéias, a realizar-se em 31 de julho de 2011; Rodrigo Moreira
    (83/SP) – Coordenador do GT organizador do X Fórum Paulista de Jovens Líderes, a realizar-se em março de 2012.'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: Eleição dos cargos eletivos do Núcleo Regional (Coordenador e Comunicador)
  decisao: Guilherme Novaes (254/SP) apresentado candidatura única e foi eleito por aclamação como Coordenador do NPJL para
    a gestão 2011/2012; Andréa Ianoni (110/SP) apresentada candidatura única e foi eleita por aclamação como Comunicadora
    do NPJL para a gestão 2011/2012; Olin Brambilla (274/SP) apresentado candidatura única e foi eleito por aclamação como
    Coordenador do NPJL para a gestão 2011; Rodrigo Moreira (83/SP) apresentado candidatura única e foi eleito por aclamação
    como Comunicador do NPJL para a gestão 2011.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Eleição dos delegados da Rede Paulista de Jovens Líderes ao Fórum Nacional de Jovens Líderes
  decisao: foram eleitos por aclamação como delegados da Rede Paulista de Jovens Líderes ao XVI Fórum Nacional de Jovens Líderes
    Rodrigo Moreira (83/SP) e André Luiz da Silva Julio (72/SP); por decisão unânime da plenária, todos os demais presentes,
    desde que atendidas as exigências do art.25 dos Parâmetros Regulamentares da RPJL, foram eleitos delegados suplentes.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Proposta de revisão dos Parâmetros Regulamentares da RPJL
  decisao: Proposta aprovada por unanimidade para que as alterações sejam aprovadas por meio da lista virtual de discussão
    da RPJL em até trinta dias da data de realizando deste Fórum, ficando o jovem líder Thiago Bueno responsável por enviar
    à lista virtual as propostas de alteração textual, sendo as mesmas aprovadas por quinze votos favoráveis de jovens líderes
    na lista virtual da RPJL.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Posse dos membros eleitos do Núcleo Regional e dos delegados ao Fórum Nacional de Jovens Líderes
  decisao: por meio da renovação da Promessa Escoteira, deu posse aos membros eleitos do Núcleo Paulista de Jovens Líderes
    e aos delegados da RPJL ao Fórum Nacional de Jovens Líderes.
  votacao: ''
  pagina: 2
  conferido: true
