- tema: Escolha do Vice-presidente do CAN
  decisao: Colocada a escolha do Vice-Presidente em votação os Conselheiros decidiram pela escolha de Paulo Henrique com 8
    (oito) votos e 5 (cinco) pessoas votaram em Cristine.
  votacao: 8 votos a 5
  pagina: 2
  conferido: true
- tema: Comissão de Condecorações e Recompensas
  decisao: 'Aprovada a Comissão com a seguinte composição: Paulo Henrique, Senna, Marcelo, Luiz Salgado Klaes e Rafael Will;'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Impressão e envio do Manual de Reconhecimento aos Grupos Escoteiros
  decisao: O CAN decidiu que a Resolução e o Manual devem ser disponibilizados no site e a Resolução terá sua vigência a partir
    de 02 de maio;
  votacao: ''
  pagina: 2
  conferido: true
- tema: Concessão de Condecorações
  decisao: 'foram ratificadas as aprovações das seguintes condecorações: Tiradentes: José Arteiro da Silva e Júlio Augusto
    Mendes Ericeira e Tapir de Prata: Antonio Boulanger Uchoa Ribeiro.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Fórum Nacional de Jovens Líderes
  decisao: Winder informou sobre a saída da Fernanda e o ingresso, nesse Conselho de Lucas Machado Moreira (MG).
  votacao: ''
  pagina: 2
  conferido: true
- tema: Áreas Geográficas Sudeste
  decisao: formalizada a substituição de Ricardo Coelho por Patrícia Diniz.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Comissão de Posicionamento Institucional
  decisao: Definido que será criada a Comissão que trará os posicionamentos ao CAN para que esse emita ao CAN pareceres sobre
    assuntos de relevância em discussão no cenário nacional inerentes a nossa área de atuação – Comissão composta por Altamiro,
    Rogério, Winder, Cristine e Xaud que deverão envolver a CNIC, CNRInst e a CNRI. A DEN fará a inserção da nota com o posicionamento
    dos Escoteiros do Brasil a favor do Estatuto da Juventude conforme a vontade do CAN.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Grupo de Trabalho de Gestão Integrada
  decisao: Proposto que seja encaminhado a DEN, por parte dos coordenadores do GT, alguns orçamentos para suporte externo
    ao trabalho do GT e de acordo com os orçamentos apresentados de empresas terceirizadas o CAN deliberaria acerca. O encaminhamento
    foi aceito pelo CAN.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Voto de Louvor à DEN e à Diretoria de Métodos Educativos
  decisao: Ivan pede constar em ata um Voto de Louvor a DEN e à Diretoria de Métodos Educativos pelo compromisso cumprido.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Plano de Mobilização de Recursos e Sustentabilidade
  decisao: Solicitaram que seja aprovada a realização de um estudo de posicionamento e mensuração da nossa Marca por empresa
    especializada, preferencialmente sem custos para a nossa associação. Ivan encaminha que o plano seja distribuído às Diretorias
    Regionais, Diretoria Executiva Nacional e CAN, para, depois, ter seu fechamento.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Plano de Trabalho da área de Relações Institucionais
  decisao: Solicitou ao CAN uma orientação no sentido de estabelecer como deve ser apresentado o resultado final, ao que se
    solicitou o estabelecimento de um cronograma e que o conjunto fosse enviado aos Conselheiros.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Minuta do Plano de Crescimento
  decisao: Consideram que Crescimento é interno e Expansão e aumento do número de UEL’s. Paulo Henrique parabenizou pela apresentação
    e comentou que algumas ações já estão sendo implantadas.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Criação de Comissão para analisar recurso de processo disciplinar
  decisao: Aprovada a criação de comissão composta por Aleksandro, Castrianni e Senna para que analisem o recurso apresentado
    e apresentem informações ao CAN na próxima reunião.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Divulgação dos membros da Comissão do processo de escolha do representante no CONJUVE
  decisao: A DEN fará a divulgação dos membros que participaram da Comissão do processo de escolha do nosso representante
    no CONJUVE, corrigindo o comunicado já divulgado.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Lista do CAN
  decisao: Aprovado que a lista seja composta somente por pessoas que tenham direito a participação em reunião fechada – Rogério
    e Márcio ficam responsáveis pela administração da mesma.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Compromisso para agilizar adesão das Regiões à Consolidação de Balanços
  decisao: Proposto e aprovado que os Conselheiros e representantes de Áreas Geográficas assumam o compromisso de, até junho,
    agilizarem as Regiões de AM, RN, RJ, MG e DF, para que ingressem na Consolidação de Balanços e, em agosto, o assunto volte
    a ser tratado.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Contratação do Secretário Geral
  decisao: Escolhido David Marcial Ortolan que começará a trabalhar em 03/maio. O contrato será por 90 (noventa) dias.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Regulamento sobre Grupo Escoteiro Padrinho
  decisao: Dentro do Grupo Padrão deve haver uma normatização de qual é o papel de Grupo Padrinho para que não haja prejuízo
    para Grupos. A pontuação no Projeto Grupo Padrão só acontece mediante atestado de efetiva ação emitido pela Região Escoteira.
  votacao: ''
  pagina: 8
  conferido: true
- tema: II MOOT Interamericano e Área Internacional
  decisao: Orçamento aprovado pela DEN e pelo Comitê Interamericano para 1000 pessoas, expectativa de participação de 2.000
    pessoas. CNRI fará revisão das Resoluções do CAN que tratam de atividades da área internacional e preparará uma Resolução
    que atenda as diferentes necessidades.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Concessão de medalha VELHO LOBO
  decisao: A Comissão recebeu proposta de concessão de medalha VELHO LOBO para Carlos Borba (RJ) e a aprovou por unanimidade.
  votacao: unanimidade
  pagina: 10
  conferido: true
- tema: Valor de comercialização de medalhas
  decisao: O CAN aprovou que as medalhas sejam comercializadas com e sem embalagem dentro dos valores apresentados por Romeu.
  votacao: ''
  pagina: 11
  conferido: true
