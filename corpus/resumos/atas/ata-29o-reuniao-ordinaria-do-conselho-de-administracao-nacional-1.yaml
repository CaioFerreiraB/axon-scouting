- tema: Composição da Diretoria Executiva para 2001
  decisao: 'Composição da Diretoria Executiva para o período de 01 de janeiro de 2001 a 31 de dezembro de 2001: Cordeiro Perlingeiro,
    portador do CPF no 612.446. e Registro de Identidade no 73460 — OAB/RJ, residente e domiciliado na cidade do Rio de Janeiro/RJ,
    como Diretor Presidente da Diretoria Executiva Nacional da União dos Escoteiros do Brasil; Marcel Hugo, portador do CPF
    no 719.011.249-91 e Registro de Identidade no 1.723.388-7, residente e domiciliado na cidade de Blumenau/SC, como Diretor
    1o Vice-presidente e Marcos Venício Mattos Chaves, portador do CPF no 572.620.128-00 e registro de Identidade no 78770
    — OAB/SP, residente e domiciliado na cidade de Santo André/SP, como Diretor 2o Vice-presidente.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Assinaturas de cheques e documentos onerosos
  decisao: O Diretor Presidente e os Diretores Vice-Presidentes eleitos para o exercício de 2001 foram designados pelo Conselho
    de Administração Nacional para, nos termos do artigo 51 do Estatuto da UEB, assinar cheques e documentos onerosos à UEB,
    podendo fazê-lo diretamente ou por meio de instrumento particular de procuração outorgada à procuradores por eles designados.
    Quer o façam pessoalmente, quer o façam por meio de procuradores, os cheques e documentos onerosos deverão contar sempre
    com duas assinaturas.
  votacao: ''
  pagina: 1
  conferido: true
