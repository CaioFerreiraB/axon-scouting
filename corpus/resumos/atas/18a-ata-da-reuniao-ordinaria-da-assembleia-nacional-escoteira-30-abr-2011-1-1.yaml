    Diego Luiz (MG) Regis Moreira e Thiago carvalho (SC); COMISSÃO ELEITORAL: Luiz Carlos Vasconcelos (MG), Roberto Basso
    (SC), Antonino Pio de Carvalho (MA) e ASSUNTOS GERAIS: Renato Silva (SP), Patrícia Diniz (SP) e Antonio Boulanger Uchoa
    Ribeiro (RJ)'
