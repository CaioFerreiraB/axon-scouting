- tema: 'Alteração na Carta de Posicionamento: substituir “opção sexual” por “orientação sexual”'
  decisao: 'Sugestão de alteração por Raissa Ribeiro - Ebenezer 44/SP: ao invés de “opção sexual”, colocar “orientação sexual”.
    Aprovada por aclamação.'
  votacao: aclamação
  pagina: 9
  conferido: true
- tema: Criação de programa de tutores para a RNJL SP
  decisao: sugiro a criação de um programa de tutores para a RNJL SP – aprovado por aclamação.
