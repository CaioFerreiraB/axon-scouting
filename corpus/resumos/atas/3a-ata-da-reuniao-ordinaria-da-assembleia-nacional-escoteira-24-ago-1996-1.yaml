doc_key: 3a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-24-ago-1996-1
reuniao:
  tipo: ordinaria
  data: '1996-10-31'
  local: Centro de Convenções do Hotel Laje de Pedra, em Canela, RS
deliberacoes:
- tema: eleição da mesa diretora dos trabalhos
  decisao: 'Acatada a proposta da Diretoria Nacional, foram eleitos, por aclamação, os seguintes Companheiros: Presidente
    da III Assembléia Nacional - Paulo Salamuni; 1o Vice-Presidente - José Ferreira Machado; 2o Vice-Presidente - Flávio André
    Teixeira; Primeiro Secretário - Alessandro Garcia Vieira; e Segundo Secretário - Carmen Barreira.'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: eleição das comissões de trabalho
  decisao: 'Acatada a proposta da Diretoria Nacional, foram eleitos, por aclamação, os seguintes Companheiros: Comissão de
    Escrutínio - Gilberto (SP), Ângela (ES) e Ortiz (RN); Comissão Eleitoral - Mirna (PR), Alvacir (CE) e Romero (MG); Comissão
    de Credenciamento - Marcel (SC), Marcos (PA) e Francisco.'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: aprovação da ata da reunião anterior
  decisao: Com as referidas ressalvas, foi aprovada, por unanimidade, a ata da II Reunião Ordinária da Assembléia Nacional.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: aprovação do Relatório Anual e prestação de contas da Diretoria Nacional
  decisao: Procedida a votação, os relatórios alcançaram a aprovação unânime.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: eleição dos Diretores Nacionais e membro suplente da Comissão Fiscal Nacional
  decisao: 'Para a Diretoria Nacional, foram eleitos os seguintes Companheiros, para as 05 vagas existentes: Edson Caetano
    dos Santos (18 votos); Ivan Barreto Rodrigues (14 votos); Marcos Carvalho (12 votos); Mario Henrique Peters Farinon (17
    votos); e Oscar Victor Palmquist Arias (26 votos). Para membro suplente da Comissão Fiscal Nacional, foi eleito o Companheiro
    Mauro G. Cardoso (63 votos).'
  votacao: votação nominal, total de 91 votantes
  pagina: 2
  conferido: true
- tema: propostas de reforma do Estatuto da UEB
  decisao: Foi aprovada pela unanimidade dos presentes (87 votantes) a alteração do Estatuto da UEB, incluindo um artigo determinando
    que os recursos da entidade sejam aplicados no Brasil. Foi rejeitada, com 54 votos contra e 36 a favor, a proposta de
    alteração do § 1o do artigo 15 do Estatuto, que reduziria de 03 para 02 o número máximo de Diretores Nacionais residentes
    em uma mesma Região.
  votacao: unanimidade para aprovação; 54 contra e 36 a favor para rejeição
  pagina: 2
  conferido: true
- tema: eleição da Região Escoteira para sediar a V Reunião Ordinária da Assembléia Nacional / 4o Congresso Escoteiro Nacional
  decisao: Procedida a votação, foi eleita a Região do Ceará, com 33 votos, contra 26 votos para a Região da Bahia.
  votacao: 33 votos Ceará, 26 votos Bahia
  pagina: 4
  conferido: true
