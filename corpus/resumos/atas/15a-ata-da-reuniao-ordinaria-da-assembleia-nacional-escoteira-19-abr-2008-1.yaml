doc_key: 15a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-19-abr-2008-1
reuniao:
  tipo: ordinaria
  data: '2008-04-19'
  local: SESC - Centro de Turismo de Praia Formosa, Rodovia do Sol ES-010 – Norte, Km 35 Praia Formosa - Santa Cruz/Aracruz
    - Espírito Santo
deliberacoes:
- tema: Composição da Mesa
  decisao: 'foi eleita e empossada a Mesa, conforme segue: Presidente: Renato Bini; Vice-presidentes: Carla Barbosa de Oliveira
    Neves e Luciano Antonio Rodrigues; Secretárias: Maria Cristina Rutz Debiazio e Cleide Pires de Jesus.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Homologação das Comissões Assessoras
  decisao: 'As comissões assessoras restaram constituídas da seguinte forma: COMISSÃO DE CREDENCIAMENTO – Mariovani Carsten
    Cervi, Luiz Salgado Klaes e auxiliados pelo Executivo Celso Ferreira Filho; COMISSÃO ELEITORAL – Guilherme Reichwald,
    Rafael Froes, Frederico Augusto Siqueira Neves e Ronilde Carsten Cervi auxiliados pelo Executivo Nacional Luiz César de
    Simas Horn; COMISSÃO DE ESCRUTÍNIO – Francis Souza Carrer, Márcio Andrade Cavalcanti de Albuquerque, Daniel Conceição
    dos Santos e Nelson Zepka Senna e COMISSÃO DE ASSUNTOS GERAIS – Marco Aurélio de Mello Castrianni, Paulo Henrique Maciel
    Barbosa, Marlene Sueli Matos Guimarães e Edson Huebes.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Encaminhamento de recurso disciplinar
  decisao: A Assembléia decide pelo encaminhamento do recurso ao CAN.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Deliberação sobre a Ata da 14ª Reunião Ordinária
  decisao: A Ata com as alterações sugeridas, colocada para apreciação, foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Deliberação sobre o Relatório Anual de 2007 e Balanço Anual de 2007 da UEB
  decisao: Colocado para votação o Relatório Anual de 2007 da União dos Escoteiros do Brasil e Deliberação sobre o Balanço
    Anual de 2007 da UEB, mediante parecer da Comissão Fiscal Nacional – CFN os mesmos foram aprovados por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Impugnação de candidaturas
  decisao: colocado para votação, a Assembléia decidiu por 64 (sessenta e quatro) votos pela manutenção das candidaturas tendo
    havido 3 (três) votos contrários a manutenção e 5 (cinco) abstenções.
  votacao: 64 votos a favor, 3 contra, 5 abstenções
  pagina: 3
  conferido: true
- tema: Eleição de 1/3 dos membros do CAN, CFN e CEDN
  decisao: Foram eleitos Titulares e Suplentes para os períodos indicados conforme resultado da apuração dos votos lida pela
    Presidência da Assembléia.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Aprovação de apoio financeiro para viagens de Jovens Líderes
  decisao: A Assembléia, com abstenção da Presidência, acolheu por aclamação a sugestão proposta de se conceder apoio financeiro
    às viagens e que a mesma seja encaminhado à DEN para análise de viabilidade.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Escolha da Região-Sede para 2010
  decisao: A postulação da UEB/RJ foi aprovada por Aclamação e foi delegada à DEN a indicação de uma eventual sede alternativa.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Encaminhamento de propostas da Comissão de Assuntos Gerais
  decisao: A Comissão propõe o encaminhamento dos assuntos ao CAN ou à DEN conforme competência estatutária, e alguns assuntos
    foram retirados da pauta e encaminhados para apreciação pelo Conselho de Administração Nacional.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Encaminhamento do recurso à penalidade de exclusão
  decisao: Colocada para apreciação tal decisão foi apresentada à Assembléia que concordou com tal encaminhamento ao CAN.
  votacao: ''
  pagina: 5
  conferido: true
