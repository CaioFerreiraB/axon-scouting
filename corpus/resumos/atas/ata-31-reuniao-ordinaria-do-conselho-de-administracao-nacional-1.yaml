  conferido: true
- tema: Proposta de Resolução 011/2001 (Seções Externas)
  decisao: o CAN decide encaminhar a proposta para Comissão de Crescimento para uma análise mais profunda e formulação de
    texto mais claro e cuidadoso e desde já aprova a idéia
  votacao: ''
  pagina: 3
  conferido: true
- tema: Jamboree Mundial 2011
  decisao: o CAN definiu que os companheiros Chaves e Galera ficam indicados como representantes do Conselho nas próximas
    reuniões da Comissão e para montagem do documento final para apresentação ao CAN e o Executivo Eduardo Bello dará apoio
    aos trabalhos representando o Escritório Nacional como profissional da área. Este documento deverá ser enviado do CAN
    até 08 de agosto para que seja discutido durante a reunião ordinária do Conselho naquele mês
  votacao: ''
  pagina: 3
  conferido: true
- tema: Plano Nacional de Crescimento
  decisao: O CAN por fim, aprova a criação do cargo de Executivo Nacional de Marketing sugerido no Projeto. Aprova ainda o
    Plano por unanimidade com a revisão dos prazos e adequação dos profissionais contemplados no projeto
  votacao: unanimidade
