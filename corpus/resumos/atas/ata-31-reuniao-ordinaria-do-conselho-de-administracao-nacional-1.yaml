- tema: Resolução 009/2001
  decisao: É aprovada a proposta por unanimidade, com a inserção de um parágrafo no artigo 3o.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Intervenção na Região de PE
  decisao: o CAN decide por unanimidade determinar a Intervenção imediata na Região. O presidente determina ao Escritório
    Nacional que tome as medidas necessárias à Intervenção o mais rapidamente possível, nomeando como Interventores o Cap.
    Carlos Alberto Lino da Silva e o Sgto. Zalmon Careiro de Almeida
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Projeto Educativo
  decisao: Marcel informa que o documento que está sendo apresentado é o documento discutido na Comissão Nacional de Programa
    de Jovens com a participação da própria Carmen. Marcos sugere que as propostas da Carmen sejam encaminhadas via correio
    eletrônico para todo o CAN e CNPJ e que se promovam discussões virtuais sobre o tema, para fechá-lo definitivamente no
    evento Programa de Qualificação em Áreas Estratégicas em Junho em Curitiba/PR
  votacao: ''
  pagina: 1
  conferido: true
- tema: Proposta de que o orçamento da UEB seja aprovado pela Assembléia Nacional
  decisao: os membros do CAN que decidem por unanimidade continuar a cumprir o que estabelece o Estatuto da UEB neste sentido,
    mantendo esta aprovação no âmbito do Conselho
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Propostas de concessão de Medalhas Tiradentes
  decisao: o CAN decide por unanimidade aprovar as duas concessões com base na vida escoteira de ambos os agraciados
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Solicitação de informativo detalhado da situação financeira da UEB e da LEN
  decisao: o CAN solicita à DEN que passe a apresentar um informativo detalhado da situação financeira da UEB e da LEN, detalhando
    principalmente as linhas com disparidades à menor
  votacao: ''
  pagina: 2
  conferido: true
- tema: Recebimento dos Balancetes mensais
  decisao: Fica estabelecido que os Conselheiros que tiverem interesse em receber os Balancetes mensais informem ao Escritório
    para evitar que aqueles que não tenham interesse em receber estes documentos, façam multiplicar os mesmos sem necessidade
  votacao: ''
  pagina: 2
  conferido: true
- tema: Custeio da passagem para a Assembléia Nacional em Natal
  decisao: o custeio da 4a. passagem (Natal) dependerá da localização de orçamento que a preveja. na sua falta, a passagem
    não será custeada pela UEB
  votacao: ''
  pagina: 2
  conferido: true
- tema: Tema para o Congresso Escoteiro e para o ano de 2002
  decisao: Fica definido como tema do Congresso Escoteiro em Natal e como tema para o ano de 2002 — “ESCOTISMO PARA TODOS”
  votacao: ''
  pagina: 3
  conferido: true
- tema: Proposta de Resolução 010/2001 (calça comprida no uniforme)
  decisao: a Resolução restou aprovada com 08 votos favoráveis, 06 contra e 01 abstenção do Presidente
  votacao: 8 votos favoráveis, 6 contra, 1 abstenção
