doc_key: 14a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-28-abr-e-1o-mai-2007-1
reuniao:
  tipo: ordinaria
  data: '2007-04-28'
  local: Araguaia Convention Center, do Castro's Park Hotel, Av. República do Líbano 1520 — Setor Oeste, Goiânia/GO
deliberacoes:
- tema: Eleição da mesa diretora
  decisao: 'foi eleita e empossada a Mesa, conforme segue: Presidente: Rubem Tadeu Cordeiro Perlingeiro; Vice-Presidentes:
    Antonio César Oliveira e Raphael Tostes Salin e Souza; Secretárias: Maria Cristina Rutz Debiazio e Amélia Meireles Pagano
    de Mello.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Eleição das Comissões Assessoras da Assembléia
  decisao: 'As comissões assessoras restaram constituídas da seguinte forma: COMISSÃO DE CREDENCIAMENTO — Mariovani Carsten
    Cervi, Luiz Salgado Klaes e Iracema Bezerra Oliveira, auxiliados pelo Executivo Celso Ferreira Filho; COMISSAO ELEITORAL
    — Mário Henrique Peters Farinon, Solano Gunther e Gustavo Mendes Rezende, auxiliados pelo Executivo Celso Ferreira Filho;
    COMISSÃO DE ESCRUTÍNIO — Altair João Mossi, Francis Souza Carrer, Marcelo Xaud e Franklin de Almeida Lima; e COMISSÃO
    DE ASSUNTOS GERAIS — Siágrio Felipe Pinheiro, Geraldino Ferreira Moreira e Rubem Súffert.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Aprovação da ata da 13.o Reunião Ordinária
  decisao: 'a ata foi aprovada por unanimidade, com alteração no item 11 — 6: incluindo o nome de Carolina Menezes/DF como
    Comunicadora da Rede Nacional de Jovens Líderes, e não como Coordenadora, e incluindo o nome de Rafael de Oliveira Froes/GO
    como Coordenador.'
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação do Relatório Anual de 2006 da UEB
  decisao: Colocado para apreciação, o Relatório foi aprovado por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação do Balanço Anual da UEB
  decisao: O Balanço Anual da UEB foi colocado em discussão, tendo sido aprovado por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação da candidatura da Região do Rio Grande do Sul para sede da 16.o Assembléia Nacional Escoteira, 15.o Congresso
    Escoteiro Nacional e 14.o Fórum Nacional de Jovens Líderes em 2009
  decisao: A postulação foi aprovada por aclamação. A Assembléia delega competência à DEN para indicar outra Região na impossibilidade
    de os referidos serem realizados pela Região do Rio Grande do Sul.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Encaminhamento de assuntos gerais
  decisao: '1) Disponibilização de documentos na Internet - Acessibilidade para portadores de necessidades especiais: encaminhado
    à DEN; 2) Inclusão de crianças de 6 anos completos nas Alcatéias: decidido encaminhar ao CAN para estudos e apreciação
    em sua próxima reunião; 3) Proposta de alteração no método de avaliação dos jovens: encaminhado ao CAN para subsidiar
    as próximas discussões e deliberações sobre Programa de Jovens.'
  votacao: ''
  pagina: 4
  conferido: true
- tema: Aprovação da suspensão da penalidade e conversão do Processo Disciplinar em Diligência
  decisao: O Presidente da Assembléia propõe a suspensão da penalidade imposta, a conversão do “Processo Disciplinar” em “Diligência”
    e o encaminhamento a DEN para o saneamento do processo.
  votacao: 47 votos favoráveis, 25 votos contrários e 2 abstenções
  pagina: 5
  conferido: true
