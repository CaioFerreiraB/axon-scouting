doc_key: 13a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-21-e-23-abr-2006-1
reuniao:
  tipo: ordinaria
  data: '2006-04-21'
  local: Hotel PontaMar, Avenida Beira Mar 2200 — Meireles — Fortaleza/CE
deliberacoes:
- tema: Composição da mesa diretora
  decisao: 'foi eleita e empossada a Mesa, conforme segue: Presidente: Donald Malschitzky; Vice-presidentes: Rubem Tadeu Cordeiro
    Perlingeiro e Sandra Valda N. dos Santos, Secretárias: Maria Cristina Rutz Debiazio e Maria Beatriz da Rocha Rodrigues.'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Homologação das comissões assessorais
  decisao: 'As comissões assessoras restaram constituídas da seguinte forma: COMISSÃO DE CREDENCIAMENTO — Mariovani Carsten
    Cervi, João Sati Fiorini Thomé e auxiliado pelo Executivo Celso Ferreira Filho; COMISSÃO ELEITORAL — João Mossi, Leandro
    Luchiari Verrone, João Batista Fiorini Thomé; COMISSÃO DE ESCRUTÍNIO — Luiz Salgado Klaes, Estevão Nemer Salles e Raphael
    Tostes; e COMISSÃO DE ASSUNTOS GERAIS — Toshio Kawakami, Antonio César Oliveira e Siágrio Felipe Pinheiro.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Deliberação sobre a ata da 12ª Reunião Ordinária
  decisao: A ata da 12o Reunião Ordinária da Assembléia Nacional da União dos Escoteiros do Brasil - UEB, constou no Documento
    Base distribuído aos presentes e, em decorrência disso, foi proposta pelo Presidente da mesa a dispensa de sua leitura.
    A proposta foi aprovada por 43 votos e não recebeu manifestações contrárias. Aberto espaço para discussão e ponderações
    quanto ao seu teor não houve manifestações sendo a mesma aprovada por unanimidade.
  votacao: 43 votos a favor, unanimidade
  pagina: 2
  conferido: true
- tema: Deliberação sobre a ata da Reunião Extraordinária de 23/04/2005
  decisao: A ata da Reunião Extraordinária da Assembléia Nacional da União dos Escoteiros do Brasil - UEB, constou no Documento
    Base distribuído aos presentes e, em decorrência disso, foi proposta pelo Presidente da mesa a dispensa de sua leitura.
    A proposta foi aprovada por unanimidade. Aberto espaço para discussão e ponderações quanto ao seu teor, não houve manifestações
    sendo a mesma aprovada por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação do Balanço Anual da UEB
  decisao: O Balanço Anual da UEB foi colocado em discussão, tendo recebido 61 (sessenta e um) votos favoráveis, nenhum voto
    contrário e uma abstenção sendo, portanto, aprovado.
  votacao: 61 votos a favor, 0 contra, 1 abstenção
  pagina: 2
  conferido: true
- tema: Aprovação do Balanço Anual da Loja Escoteira Nacional
  decisao: O Balanço Anual da Loja Escoteira Nacional foi aprovado por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação do Relatório Executivo Nacional
  decisao: Colocado para apreciação, o Relatório recebeu 69 (sessenta e nove) votos favoráveis, nenhum voto contrário e nenhuma
    abstenção sendo portanto aprovado.
  votacao: 69 votos a favor, 0 contra, 0 abstenção
  pagina: 3
  conferido: true
- tema: Alteração do Calendário Anual para coincidir Mutirão de Ação Comunitária com 'Dia de Fazer a Diferença'
  decisao: Carlos Frederico dos Santos(RJ) sugeriu e foi aceito que se altere o Calendário Anual de forma a permitir que a
    data do Mutirão de Ação Comunitária coincida com a data do “Dia de Fazer a Diferença”.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição de 1/3 dos membros do Conselho de Administração Nacional (CAN) para o período abril/2006 a abril/2009, uma
    vaga até abril/2007 e suplentes
  decisao: 'Foram eleitos na condição de Titulares para o período Abril/2006 — Abril/2009: Rubem Tadeu C. Perlingeiro, Marco
    A. de Mello Castrianni, Mário H. P. Farinon, Rafael Rocha de Macedo, Alessandro Garcia Vieira. Para completar o mandato
    de Sérgio Luiz Franzner (Abril/2006 — Abril/2007): Guilherme A. Klingelfuss. Suplentes (Abril/2006 — Abril/2007): Francisco
    J. S. de Souza, Marcos M. Gomide Vieira e Hélio Borba Moratelli.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição de três membros titulares da Comissão Fiscal Nacional (CFN) e suplentes
  decisao: 'Foram eleitos: Toshio Kawakami, André Carreira, Mariovani Carsten Cervi e suplentes Leandro Luchiari Verrone.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição de três membros titulares da Comissão de Ética e Disciplina Nacional (CEDN) e suplentes
  decisao: 'Foram eleitos: Raphael Tostes, Geraldino Ferreira Moreira e Tânia Ayres Farinon.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Decisão sobre suplentes para cargos vagos na Comissão de Ética e Disciplina Nacional (CEDN)
  decisao: Considerando a inexistência de candidatos para as vagas de “Suplente” aos cargos vagos com mandato até o final
    da Assembléia Nacional Ordinária de 2007 ficou decidido que havendo necessidade do chamamento de algum suplente para prestar
    serviços à CEDN serão convocados os eleitos na presente sessão conforme resultado apresentado no DECIMO ITEM.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Escolha da Região Sede e Região Sede Alternativa para a 15ª Reunião Ordinária da Assembléia Nacional Escoteira, 14º
    Congresso Escoteiro Nacional e 13º Fórum Nacional de Jovens Líderes em 2008
  decisao: Registrada somente a candidatura da Região do Espírito Santo. Colocada a candidatura para apreciação a mesma foi
    aprovada por aclamação. A Assembléia delega, por aclamação, competência à DEN para indicar outra Região na impossibilidade
    da mesma ser realizada pela Região do Espírito Santo.
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Encaminhamento de assuntos apresentados em Assuntos Gerais
  decisao: 'Os assuntos apresentados devem Ser encaminhados à Diretoria Executiva Nacional — DEN por serem de sua competência:
    1) Criação de um documento que demonstre os motivos das alterações no POR; 2) Proposta de alteração no Sistema de Registro
    Institucional. A Comissão concluiu que os seguintes assuntos devem ser encaminhados ao Conselho de Administração Nacional
    - CAN: 1) Proposta de acréscimo no sistema de pontuação do Premio Qualidade Grupo Padrão; 2) Proposta de alteração no
    artigo 26 do Estatuto da UEB. Para ser apreciada pela Assembléia Nacional, restou somente a proposta de incentivo a um
    aumento no número de associados ao Centro Cultural do Movimento Escoteiro - CCME.'
  votacao: ''
  pagina: 6
  conferido: true
