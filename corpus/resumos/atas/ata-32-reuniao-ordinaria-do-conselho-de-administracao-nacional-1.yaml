- tema: aprovação da proposta para acompanhamento do Jamboree Mundial 2011
  decisao: 'CAN aprova proposta que: a) Os Executivos de Eventos e Marketing façam o acompanhamento juntamente com a Comissão
    sobre os trabalhos para o Jamboree Mundial, b) A Comissão já formada para o Jamboree 2011 trabalhará para a apresentação
    da Candidatura da UEB para a Conferência Interamericana de 2007; c) na reunião do CAN, de maio de 2002, seja apresentado
    um projeto detalhado de viabilidade de realização do Jamboree, contemplando as observações feitas durante esta reunião;
    d) Que se inclua no orçamento da UEB para 2002, recursos para o desenvolvimento destes trabalhos'
  votacao: ''
  pagina: 2
  conferido: true
