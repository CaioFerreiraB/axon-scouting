- tema: Planejamento Estratégico
  decisao: Aprovada a realização de oficinas de Planejamento Estratégico nos Congressos e Assembleias Regionais, com a coordenação
    de Conselheiros Nacionais. Foi aprovada a elaboração de um documento de comprometimento dos níveis regionais com o PE
    dos Escoteiros do Brasil
  votacao: ''
  pagina: 1
  conferido: true
- tema: Planejamento Estratégico
  decisao: Decidido também que o documento será revisto e juntamente com outras informações será encaminhado para as Regiões
    envolverem as Unidades Escoteiras Locais - UELs mediante a realização de oficina específica
  votacao: ''
  pagina: 1
  conferido: true
- tema: Criação de lista de voluntários para apoio às oficinas de Planejamento Estratégico
  decisao: Uma lista de voluntários para apoiar a realização das oficinas será disponibilizada para as Regiões
  votacao: ''
  pagina: 2
  conferido: true
- tema: Aprovação do orçamento 2013
  decisao: O CAN aceita a proposta e aprova o orçamento por unanimidade, decidindo, também, que deverá destinar mais atenção
