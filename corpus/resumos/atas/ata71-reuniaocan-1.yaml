  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Criação de Grupo de Trabalho para sugestão de transmissão das reuniões do CAN
  decisao: Foi aprovado a criação de um Grupo de Trabalho (GT) coordenado por Altamiro e composto por Rogério, Winder e Lucas
