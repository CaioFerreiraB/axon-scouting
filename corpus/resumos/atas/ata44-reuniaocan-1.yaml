- tema: Proposta de Resolução Programa de Jovens
  decisao: deliberado a necessidade de que sejam realizadas pesquisas periódicas sobre a aplicação do Programa de Jovens no
    Ramo Escoteiro, buscando identificar junto, aos Escotistas, as dificuldades para sua correta implantação. Deliberou-se
    que a CNPJ efetue de imediato uma primeira pesquisa.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Número de reuniões do CAN em 2005
  decisao: 'Serão mantidas quatro reuniões em 2005 nas seguintes datas: 12 e 13 de fevereiro (São Paulo), 21 a 24 de abril
    (Santa Catarina – durante o Congresso Escoteiro Nacional), 20 e 21 de agosto (Curitiba) e 12 a 15 de novembro (local a
    ser definido). Tais datas devem ser incluídas no calendário nacional para 2005.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Alteração do Regulamento do CAN
  decisao: 'alterados a partir de abril de 2005 os seguintes artigos, para o seguinte texto: Art. 1.º O Conselho de Administração
    Nacional – CAN é dirigido pelo seu Presidente e reúne-se, ordinariamente no mesmo período da reunião ordinária da Assembléia
    Nacional da UEB e nos meses de agosto e novembro do ano. Mantidos os parágrafos. Art. 8.º Será declarado vago pelo CAN
    o cargo de Conselheiro Nacional daquele membro que faltar a três reuniões no exercício de seu mandato.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Acompanhamento do Plano Estratégico
  decisao: Sugerido que propostas de Resolução sejam disponibilizadas às Regiões permitindo um enriquecimento pelas contribuições
    que venham a surgir. Geraldino informa que será preparada uma pauta para esta reunião, e só serão discutidos os assunto
    inscritos na mesma, informes sobre as Regiões e outros documentos devem ser enviados com antecedência. Os assuntos discutidos
    na seqüência, serão aprovados pelo CAN em conjunto com a DEN. Sugerido que qualquer literatura deve ter sua redação verificada
    antes de sua publicação.
  votacao: ''
  pagina: 4
  conferido: true
