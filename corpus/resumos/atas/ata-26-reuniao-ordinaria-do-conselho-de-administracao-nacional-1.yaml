doc_key: ata-26-reuniao-ordinaria-do-conselho-de-administracao-nacional-1
reuniao:
  tipo: ordinaria
  data: '2000-02-19'
  local: Hotel LIZON — Curitiba — PR
deliberacoes:
- tema: Roteiro de Implantação OPAS/UEB
  decisao: A Diretoria Nacional aprova o Roteiro de Implantação apresentado pela OPAS/UEB, este roteiro segue em anexo a presente
    Ata.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Incorporação de convite a ex-presidentes no regulamento da Diretoria Nacional
  decisao: Ficou aprovada a idéia que seja incorporado ao regulamento da Diretoria Nacional o convite aos ex-presidentes da
    mesma, e dos membros dos Conselhos Interamericano e Mundial do Escotismo as suas reuniões.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Alterações do estatuto da UEB
  decisao: A Diretoria acolhe o esclarecimento e reafirma seu conteúdo, ou seja, não existe atualmente em vigor qualquer alteração
    do estatuto da UEB com base na última reunião da Assembléia Nacional.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Criação da função de Executivo de Métodos Educativos
  decisao: Aprovada a criação da função de Executivo de Métodos Educativos, cabendo ao Escritório Nacional, decidir pela forma
    de divulgação e contratação do mesmo para apoiar a área de métodos educativos.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Proposta de reforma no regulamento do CNA
  decisao: A Diretoria Nacional decide por apreciar e deliberar a matéria na próxima Reunião.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Alteração da Resolução 006/99
  decisao: O Diretor Nacional retira a proposta de alteração da Resolução 006/99. Fica a recomendação ao EN para que emita
    os recibos referentes a contribuição anual discriminando o ano em que se refere e as credenciais de acordo com a disponibilidade.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Alteração da Resolução 007/99
  decisao: 'Resolveu-se mantê-la como consta, entretanto com as seguintes decisões para serem observadas pelo EN : a) não
    adotar qualquer procedimento contrário aos que se registrarem até 31 de março de 2000 tendo em vista o atraso na disponibilização
    do material para registro; b) desconsiderar o teor do artigo 12 da Resolução 007/99 e restabelecer o valor de repasse,
    correspondente a primeira Contribuição Anual dos sócios novos, em 30%(trinta por cento), abatendo, entretanto, deste valor
    unicamente o custo da publicação que lhes for remetida, pois a DN arcará com as despesas de remessa da mesma.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Autorização para negociação uso do Campo Escola de Brasília
  decisao: A Diretoria Nacional aprova, a pedido do Diretor Presidente, conceder-lhe autorização para negociar com a Direção
    da UEB/DF quanto ao interesse da mesma em utilizar as todas dependências da Direção Nacional no Campo Escola de Brasília.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Projeto Educativo da UEB
  decisao: A Comissão Nacional de Programa deverá analisar o texto proposto que corresponde a versão atualizado do Projeto
    Educativo da Região Interamericana. Fica o Escritório Nacional incumbido de solicitar junto a OSI exemplares da publicação
    referida para distribuir aos membros da Diretoria Nacional e membros da Comissão Nacional de Programa. Tão logo seja aprovado
    o texto deve ser publicado com as mesmas características e qualidade do exemplar da Região Interamericana.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Resolução 005/2000 sobre certificados e distintivos
  decisao: Foi aprovada uma nova resolução que altera a resolução anterior para restabelecer que o Escritório Nacional deverá
    emitir o certificado e os distintivos dos distintivos de Lis e Ouro, Escoteiro da Pátria e Insígnia de B.P.. Esta resolução
    levará o número 005/2000 e segue em anexo a esta ata.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Concessão de medalha de gratidão ouro a Paulo Grunewald
  decisao: Foi aprovada a concessão de medalha de gratidão ouro ao mesmo. A família deve ser contatada para ver da possibilidade
    de ser entregue a medalha na próxima reunião da Assembléia Nacional no Espírito Santo, ou, em havendo impossibilidade,
    deverá ser solicitado à UEB/RS que faça a entrega na próxima reunião de sua Assembléia Regional.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Manutenção da Resolução 013/99
  decisao: A Diretoria resolve manter a resolução nos termos em que foi aprovada.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Alteração da Resolução 015/98
  decisao: A Diretoria Nacional decidiu aprovar texto proposto pela Comissão Nacional de Adultos, porém separando suas considerações
    em duas Resoluções distintas, uma entrando em vigor na data da publicação e outra somente a partir de 01 de janeiro de
    2001 e que levam a identificação de Resolução 001/2000 e 002/2000 respectivamente e seguem anexo a esta ata.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Resolução 004/2000 sobre segurança nas atividades escoteiras
  decisao: A diretoria aprova a proposta com ajuste e fixa a Resolução 004/2000 por unanimidade e segue em anexo a esta ata.
    Fica firmado que será realizado trabalho secundário para confecção de um Manual de procedimentos.
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Resolução 003/2000 sobre gestão financeira responsável e ética
  decisao: A diretoria aprova a proposta com ajuste e fixa a Resolução 003/2000 por unanimidade e segue em anexo a esta ata.
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Encaminhamento de recurso de processo disciplinar de Josemar Berçot
  decisao: A Diretoria Nacional reapreciando a matéria resolve determinar o encaminhamento do recurso apresentado pela interessado
    a próxima Assembléia Nacional. Resolve ainda que o Escritório Nacional dê ciência ao Sr. Josemar Berçot desta decisão.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Julgamento do processo disciplinar Carlos Alberto do Nascimento
  decisao: A Diretoria Nacional resolve acolher o parecer da Comissão no sentido de julgar improcedente o processo interposto
    pelo Sr. Carlos Alberto do Nascimento, e que as recomendações que do mesmo constam sejam encaminhadas à “Estatuinte”.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Engajamento da UEB no Comitê Nacional Organizador do Ano Internacional do Voluntariado
  decisao: A Diretoria Nacional aprova que devem ser tomados os procedimentos necessários para o engajamento da UEB no Comitê
    Nacional Organizador, designando a mesma para tomar as medidas necessárias e indicando a Senhora Vânia Dohme para participar
    da Organização.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Uso do Fundo do Jamboree para compra de imóvel em Curitiba
  decisao: Após amplo debate foi posto em votação e aprovado o uso do Fundo do Jamboree para fins de compra de imóvel para
    a Instituição e para Loja Escoteira Nacional em Curitiba.
  votacao: ''
  pagina: 6
  conferido: true
