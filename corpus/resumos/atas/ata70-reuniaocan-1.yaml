    apreciação do CAN, aprovação da inserção do vestuário escoteiro no objetivo 5, manutenção do Projeto Nordeste no objetivo
    6, aprovação da inclusão do item de atualização permanente do material de Programa no objetivo 9, aprovação do item 13.5
    como atendido, e observações sobre a política comercial no objetivo 14
