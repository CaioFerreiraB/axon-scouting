- tema: Decisão sobre consolidação de balanços das Regiões
  decisao: Proposta aprovada para que as Regiões se adéqüem a uma das 3 primeiras opções apresentadas para consolidação de
    balanços, com alternativas imediatas para quem não aceitar, incluindo suspensão de repasse, cancelamento de CNPJ e intervenção;
    e que as Regiões que estão consolidando atualizem seus lançamentos até 30 de setembro sob pena de retenção do repasse
  votacao: ''
  pagina: 6
  conferido: true
- tema: Decisão sobre divulgação de documentos contábeis
  decisao: Decidido que devem permanecer no texto somente a divulgação do Balanço, Demonstração de Resultados e Parecer da
