  decisao: Foram aprovadas diversas alterações e manutenções nos objetivos estratégicos conforme detalhado na ata, incluindo
    exclusão do item 1.4, manutenção do item 14.2 no objetivo 14, desenvolvimento do item 2.8 pelo Grupo de Trabalho de Posicionamento
    Institucional, aprovação de que o item 2.16 está atendido, aceitação parcial do item 2.12, definição do modelo de gestão
