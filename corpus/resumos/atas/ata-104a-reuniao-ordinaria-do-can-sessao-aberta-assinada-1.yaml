doc_key: ata-104a-reuniao-ordinaria-do-can-sessao-aberta-assinada-1
reuniao:
  tipo: ordinaria
  data: '2021-11-06'
  local: videochamada pelo Zoom, com transmissão pelo canal dos Escoteiros do Brasil no Youtube
deliberacoes:
- tema: inserção de nomes dos associados que contribuíram
  decisao: A proposta do ROBSON, com a observação do MANIQUE, é aprovada por unanimidade dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: proposta orçamentária 2022 da LEN
  decisao: MANIQUE encaminha para votação a proposta orçamentária 2022 da LEN, com parecer favorável da CPO sobre a forma
    como foi apresentada, a qual é aprovada por unanimidade dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 8
  conferido: true
- tema: divisão dos resultados da LEN em 2022
  decisao: MANIQUE encaminha para votação a proposta de divisão dos resultados da LEN em 2022, sendo 50% para o nível Nacional,
    25% para as Regiões Escoteiras, 20% para o fundo de desenvolvimento e 5% para o fundo de risco, a qual é aprovada por
    unanimidade dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 8
  conferido: true
- tema: ajuste da distribuição dos investimentos do fundo de desenvolvimento da LEN em 2022
  decisao: MANIQUE encaminha para votação o ajuste da proposta de distribuição dos investimentos do fundo de desenvolvimento
    da LEN em 2022, sendo R$ 15 mil para o check-presente, R$ 75 mil para o marketplace, R$ 25 mil para os honorários iniciais
    dos processos de isenção ICMS e R$ 125 mil para o desenvolvimento de novos produtos, o qual é aprovado por unanimidade
    dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 8
  conferido: true
- tema: proposta orçamentária 2022 do EN
  decisao: MANIQUE encaminha para votação a proposta orçamentária 2022 apresentada pela DEN, considerando as recomendações
    da CPO, a qual é aprovada por unanimidade dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 10
  conferido: true
- tema: recomposição do fundo de doações
  decisao: MANIQUE encaminha para votação a recomposição do fundo de doações, sendo R$ 25 mil para regularização da escritura
    dos terrenos detrás da sede nacional, R$ 9.701,22 para regularização do IPTU dos terrenos detrás da sede nacional, e destinação
    do saldo restante de R$ 163.488,68 para criação do fundo de regularização patrimonial. A proposta é aprovada por unanimidade
    dos conselheiros titulares presentes.
  votacao: unanimidade
  pagina: 10
  conferido: true
- tema: resolução sobre a contribuição associativa de 2022
  decisao: Fica encaminhado, por decisão unânime dos conselheiros titulares presentes, que o GT sobre a Contribuição Associativa
    faça o referido estudo e retorne ao Conselho para, se necessário, ser reeditada a resolução sobre a contribuição associativa
    de 2022. A proposta de aumento do desconto para 35% para associados da mesma família a partir do terceiro associado registrado
    é aprovada por unanimidade. A resolução proposta, considerando ajustes textuais, é aprovada por unanimidade dos conselheiros
    titulares presentes, passando a ser Resolução CAN 12/2021 assim que oficialmente publicada.
  votacao: unanimidade
  pagina: 11
  conferido: true
- tema: relatório parcial do GT de Estudos sobre Castorismo
  decisao: MANIQUE agradece a apresentação, parabeniza todos os envolvidos e a coordenação dos trabalhos pelo ROBSON.
  votacao: ''
  pagina: 11
  conferido: true
- tema: calendário de reuniões ordinárias de 2022 do CAN
  decisao: O calendário, com as sugestões de alteração feitas por MANIQUE, SARAH e ROBSON, é aprovado por unanimidade dos
    conselheiros titulares presentes, as quais deverão ser incluídas na próxima atualização do Calendário Nacional 2022.
  votacao: unanimidade
  pagina: 12
  conferido: true
- tema: resolução de alteração do Regulamento Interno do CAN
  decisao: Ficam aprovadas por unanimidade dos conselheiros titulares presentes as alterações no artigo 14 para gravação e
    disponibilização das reuniões, no prazo para posse da DEN para até 6 meses após a reunião do CAN que os nomeou, e a retirada
    do critério de 'gestão temerária' para destituição da DEN. A resolução proposta, com as emendas feitas, é aprovada por
    unanimidade, passando a ser Resolução CAN 13/2021 quando oficialmente publicada.
  votacao: unanimidade
  pagina: 13
  conferido: true
- tema: resolução sobre procedimento para nomeação da nova DEN
  decisao: 'Ficam aprovadas por unanimidade dos conselheiros titulares presentes as seguintes decisões: mandato da DEN de
    três anos; candidatura via chapa; observação da equidade de gênero e equilíbrio geracional na composição da DEN ampliada;
    busca para assegurar equidade de gênero na composição da DEN nomeada pelo CAN, com aprovação por 12 votos a 1 e 1 abstenção
    do termo ''preferencialmente''; escolha da nova DEN em reunião extraordinária do CAN em dezembro/2021; alteração da composição
    da DEN para Diretor(a)-Presidente e dois Vice-Presidentes; retirada da citação do documento ''Perfis, Cargos e Funções
    – Nível Nacional'' do art. 6º; inclusão da apresentação de plano de ação emergencial para candidatura, com decisão de
    que a DEN apresente plano de ação após aprovação do planejamento estratégico; e aprovação integral da resolução, que passa
    a ser Resolução CAN 14/2021 quando oficialmente publicada.'
  votacao: unanimidade, exceto votação sobre equidade de gênero com 12 a favor, 1 contra e 1 abstenção; e votação sobre data
    da escolha da DEN com 11 a favor da reunião extraordinária e 2 a favor da reunião ordinária
  pagina: 19
  conferido: true
- tema: aprovação da delegação à Conferência Internacional Católica Escoteira
  decisao: Ficam aprovados por aclamação os nomes de Marco Aurelio de M. Castrianni como delegado e candidato ao Comitê Mundial
    da CICE, e os observadores André Torricelli Fernandes da Rosa e Bráulio André Dantas da Silva. Fica reprovada a participação
    como delegado do associado Hugo Marcel Marcelino Galvão por 13 votos contra e 1 abstenção. Fica designado ao Comissariado
    Internacional fazer a substituição de qual dos observadores aprovados se tornará delegado, considerando a reprovação do
    nome do associado Hugo Galvão.
  votacao: 13 votos contra, 1 abstenção para Hugo Galvão; aclamação para os demais
  pagina: 26
  conferido: true
