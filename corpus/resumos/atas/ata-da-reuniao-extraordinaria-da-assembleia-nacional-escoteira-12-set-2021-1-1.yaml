doc_key: ata-da-reuniao-extraordinaria-da-assembleia-nacional-escoteira-12-set-2021-1-1
reuniao:
  tipo: extraordinaria
  data: '2021-09-12'
  local: por meio eletrônico (telepresencial)
deliberacoes:
- tema: eleição da mesa diretora da Assembleia
  decisao: 'Passou-se à votação de composição da mesa diretora, pelo prazo de 07 (sete) minutos, permanecendo aberta a votação
    das 9h30min às 9h37min. Resultado: 99 votos a favor, 3 contrários e 17 abstenções.'
  votacao: 99 votos a favor, 3 contrários, 17 abstenções
  pagina: 3
  conferido: true
- tema: credenciamento do delegado da região escoteira do Piauí
  decisao: 'Passou-se a votação da aceitação da substituição do delegado para participação no presente ato, na forma como
    requerida pela região escoteira do Piauí. Resultado: 71 votos a favor, 35 contrários e 13 abstenções.'
  votacao: 71 votos a favor, 35 contrários, 13 abstenções
  pagina: 5
  conferido: true
- tema: composição das comissões assessoras da assembleia
  decisao: 'Foi aclamada pela Assembleia Nacional a indicação da composição das comissões: Comissão de Credenciamento, Comissão
    de Escrutínio, Comissão Eleitoral e Comissão de Redação e Estilo, conforme nominata apresentada.'
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: aprovação da ata da 27ª Reunião Ordinária da Assembleia Nacional da UEB de 30 de maio de 2021
  decisao: Aprovação da ata com inclusão das ressalvas apresentadas nesta assembleia, que corrigem informações equivocadas
    sobre a convocação da assembleia geral extraordinária para tratar dos princípios.
  votacao: 48 votos pela aprovação sem ressalvas, 54 votos pela aprovação com ressalvas, 0 contra, 18 abstenções
  pagina: 7
  conferido: true
- tema: proposta de alteração dos princípios do Movimento Escoteiro (texto do CAN)
  decisao: Rejeitada a proposta de alteração dos princípios do Movimento Escoteiro conforme texto apresentado pelo Conselho
    de Administração Nacional (CAN).
  votacao: 68 votos contra, 41 a favor, 11 abstenções
  pagina: 21
  conferido: true
- tema: votação sobre a análise da proposta da delegação de São Paulo nesta assembleia
  decisao: 'Decidiu-se votar a proposta da delegação de São Paulo nesta assembleia. Resultado: 61 votos sim, 44 votos não,
    15 abstenções.'
  votacao: 61 votos sim, 44 votos não, 15 abstenções
  pagina: 21
  conferido: true
- tema: aprovação da proposta da delegação da região escoteira de São Paulo para os princípios do Movimento Escoteiro
  decisao: Aprovada a proposta da delegação da região escoteira de São Paulo para modificação do texto dos princípios do Movimento
    Escoteiro.
  votacao: 73 votos a favor, 35 contra, 12 abstenções
  pagina: 22
  conferido: true
