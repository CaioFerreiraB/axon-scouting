- tema: Aprovação da sugestão para elaboração de Planejamento Estratégico plurianual
  decisao: 'Encaminha e é aprovada a seguinte sugestão: 1) A DEN providenciará a obtenção da tradução do material de Planejamento
    Estratégico da WOSM e OSI. Distribuição imediata aos Conselheiros e Comissões; 2) Elaboração de material para dar início
    ao processo de construção do Planejamento estratégico, com ampla discussão aos diversos órgãos e níveis da UEB; 3) Discussão
    do tema durante a reunião do CAN em novembro/05; 4) Realização de Seminário durante o Congresso em Fortaleza; 5) Definição
    de um coordenador de todo processo.'
  votacao: ''
  pagina: 4
  conferido: true
