  pagina: 4
  conferido: true
- tema: Recebimento das candidaturas para o Conselho de Administração Nacional
  decisao: 'Votos favoráveis: 61 pelo recebimento das candidaturas; Votos Contra: 64 pelo não acolhimento das candidaturas;
    Não votantes: 1.'
  votacao: 61 a favor, 64 contra, 1 não votante
  pagina: 4
  conferido: true
- tema: Instituição de grupo de trabalho para orientar assembleias regionais e nacional
  decisao: A proposta foi acatada por aclamação pela assembleia e será implementada pela Diretoria Executiva Nacional em 2024.
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Atualização do Regulamento da Assembleia Nacional
  decisao: Alessandro então sugere que o CAN considere incluir a atualização do Regulamento da Assembleia na convocação da
    próxima reunião extraordinária da Assembleia Nacional, sem prejuízo de que a Comissão do CAN, encarregada do assunto,
    possa avançar na elaboração da proposta.
  votacao: ''
  pagina: 6
  conferido: true
