deliberacoes:
- tema: eleição da mesa diretora
  decisao: 'mesa diretora – que foi eleita por aclamação com a seguinte composição: presidente, Rafael Melis Rogéro (GE São
    Carlos 251/SP), 1º Vice-Presidente: Ygor Rezende Monrinishi (GE Tiradentes 107/SP), 2º Vice-Presidente, Lucas Mendelson
    Bertholdo da Silva Botelho (GE Orzel Bialy 368/SP), 1º Secretário, Sabrina Mirabal Czarnotta (GE Tapajós 32/SP), 2º Secretário,
    Ana Clara Lucio Panese (GE Irapuã 189/SP) e 3º Secretário, Diogo Spinellida da Silva (GE Falcão Peregrino 20/SP).'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: aprovação da ata da Assembleia anterior
  decisao: por entendimento da mesa e votação por aclamação da plenária não houve necessidade de leitura, assim aprovando
    a ata por aclamação.
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: prestação de contas da Equipe Regional Pioneira 2022
  decisao: o então Presidente da CP, Robert Santos, informa à plenária que não houve gastos.
  votacao: ''
  pagina: 1
  conferido: true
- tema: eleição da cidade-sede do Fórum Regional Pioneiro 2024
  decisao: foi eleita a cidade de Jundiaí para sediar o evento, com 17 votos. Guarulhos e São Carlos receberam respectivamente
    14 e 4 votos, e não houve abstenções.
  votacao: 17 votos a favor
  pagina: 2
  conferido: true
- tema: eleição da cidade-sede do Interclãs 2024
  decisao: cidade de Santos (Grupo Escoteiro Morvan 55/SP), que foi aprovada com unanimidade, não havendo abstenções.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: eleição da cidade-sede do Mutirão Regional Pioneiro 2024
  decisao: Ituverava (Grupo Escoteiro José Amauri de Souza 225/SP) que também foi aprovada com unanimidade, não havendo abstenções.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: eleição da cidade-sede do Congresso Regional Pioneiro 2024
  decisao: cidade de São Paulo (Grupo Escoteiro Tiradentes 107/SP), que foi aprovada com unanimidade e sem abstenções.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: aprovação da criação de Equipe de Interesse aberta para todos os pioneiros da região de São Paulo
  decisao: proposta foi levada para votação e resultou em 22 votos a favor e 1 voto contra, sendo então aprovada a solicitação
    de uma Equipe de Interesse aberta para todos os pioneiros da região de São Paulo.
  votacao: 22 votos a favor e 1 voto contra
  pagina: 2
  conferido: true
