deliberacoes:
- tema: eleição da mesa diretora
  decisao: Para vice-presidente foi eleito André Neves (RJ), com a maioria de onze votos, sendo que Adriano Zanetti (SP),
    também candidato, obteve sete votos. Para secretaria foram eleitos por aclamação, respectivamente nesta ordem, Mateus
    Fernandes (DF) e João Marcelo (CE).
  votacao: maioria
  pagina: 3
  conferido: true
- tema: substituição do termo 'líder' por 'coordenador'
  decisao: A proposta foi aceita por aclamação, com quinze votos favoráveis ao total.
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: proposta de criação do Núcleo Nacional de Jovens Líderes e Plano Bienal de Trabalho
  decisao: Esta proposta foi aceita por aclamação, sem votos contrários, nem abstenções.
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: proposta do Distrito Federal sobre o Núcleo Nacional e representação dos jovens líderes
  decisao: Defini-se, portanto, a este conjunto de propostas, a aceitação dos termos “A”, “B” e “E”.
  votacao: 'votos variados (A: 15 favoráveis 1 contrário; B: 11 favoráveis 2 contrários 3 abstenções; C e D recusados; E:
    10 favoráveis 6 abstenções)'
  pagina: 7
  conferido: true
- tema: alteração do dia do Fórum Nacional de Jovens Líderes e indicação para Fórum Mundial
  decisao: O termo “A” foi aprovado com nove votos favoráveis, um contrário e seis abstenções; o termo “B” foi aprovado por
    aclamação, sem votos contrários ou abstenções.
  votacao: votos variados e aclamação
  pagina: 7
  conferido: true
- tema: eleição do Núcleo Nacional de Jovens Líderes
  decisao: 'Por aclamação, sem qualquer manifesto contrário, foram eleitos os seguintes: Luiz Gustavo (SP) e Rafael Macedo
    (GO) - coordenadores; e Mateus Fernandes (DF) e Murillo Martins (SP) - comunicadores.'
  votacao: aclamação
  pagina: 7
  conferido: true
