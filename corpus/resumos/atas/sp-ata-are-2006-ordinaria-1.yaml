- tema: Orçamento 2007
  decisao: A previsão orçamentária com aumento de valores foi aprovada com 447 votos a favor, 41 votos contra e 3 abstenções.
    A contribuição regional no valor de R$18,00 recebeu 77 votos; a de R$15,00 recebeu 118 votos e, neste processo eleitoral,
    tiveram 11 abstenções, sendo aprovada a taxa de contribuição de R$15,00.
