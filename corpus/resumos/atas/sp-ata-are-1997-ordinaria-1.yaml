doc_key: sp-ata-are-1997-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '1997-09-13'
  local: Universidade Brás Cubas, Mogi das Cruzes
deliberacoes:
- tema: aprovação da ata da reunião anterior
  decisao: após discussões, ocasião em que o Sr. Presidente solicitou que na ata desta reunião fosse registrado posicionamento
    do Chefe Antonio Simões de que a ele não ficou claro que seja possível à Diretoria Regional extinguir os Distritos Escoteiros,
    mas somente exonerar os Coordenadores Distritais, a mesma foi aprovada.
  votacao: ''
  pagina: 2
  conferido: true
- tema: manutenção da candidatura de chefe ausente
  decisao: foi aprovado por maioria de votos que se mantivesse a candidatura da Chefe Vânia
  votacao: maioria
  pagina: 3
  conferido: true
- tema: exclusão de candidatura de chefe ausente
  decisao: candidatura do Chefe Fernando Monte Serrat excluída por maioria de votos
  votacao: maioria
  pagina: 3
  conferido: true
- tema: eleição por aclamação da Diretoria Regional e Diretor Nacional
  decisao: 'eleitos, o candidato a Diretor Nacional Chefe Marcos Venicio Mattos Chaves, e a chapa liderada pelo chefe Renato
    para a Direção Regional, triênio 1.998/2000, assim composta: Diretor Presidente Renato Araujo Silva, Diretor-Vice Presidente
    Almir Cruz, Diretor Financeiro Toshio Kawakami, Diretor Administrativo Koshiro Otani, Diretora Comercial Sonia Regina
    Silva Carceroni'
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: mudança do nome do Troféu Avançar
  decisao: o Troféu passa a se chamar “Troféu Avançar Herry Maurício Fuldauer”; outorgaram-no in memorian & Herry M. Fuldauer
    relativo ao ano de 1.996, o qual foi entregue ao Sr. Siegfried Herry Fuldauer e Sra. Yolanda Victória Fuldauver, respectivamente
    pai e irmã do Chefe Herry, e que para o ano de 1.997 outorgam a Chefe Dalva Antonia Mattoso Argoud
  votacao: ''
  pagina: 3
  conferido: true
- tema: eleição da Comissão Fiscal Regional
  decisao: Titulares- 1º Satoshi Shimohirao (40 votos), 2º Maria das Graças D. A Silva (38 votos); 3º Alvaro Tavares Gomes
    de Souza (26 votos); Suplentes- 1º Cássio Cambahuva Rufino (21 votos); 2º Roberto Lucas de Souza (12 votos) 3º Julio César
    dos Santos (3 votos)
  votacao: ''
  pagina: 4
  conferido: true
- tema: eleição dos Delegados Regionais à Assembleia Nacional 1998
  decisao: 1º Gilberto Santana dos Santos (17 votos); 2º Enio Y Cojho (16 votos); 3º João Roberto A Cunha (13 votos); 4º Geraldino
    F. Moreira (12 votos); 5º Duxtei Vinhas Itavo (11 votos); 6º Paulo C. A Cabello (09 votos); 7º Gerson Donizetti Paes (08
    votos); 8º Satshi Shimohiao (08 votos); 9º Lenita A Pessoa (07 votos); 10º Luis Carlos Torquato (07 votos); 11º Felix
    V. Varejão Filho (07 votos); 12º Elmer de Souza Pessoa (06 votos); 13º Alvaro tavares Gomes de Souza (05 votos); 14º Walter
    Dohme (05 votos); 15º Vania D'Angelo Dohme (05 votos); 16º Marco Aurelio M. Castriani (05 votos); 17º Luiz Roberto de
    Moraes (03 votos); 18º Marcelo Lamas (03 votos) 19º Walington dos Santos (03 votos) 20º Maria das Graças de Souza ( 02
    votos)
  votacao: ''
  pagina: 4
  conferido: true
- tema: aprovação da prestação de contas (balanço e orçamento)
  decisao: foi aprovada com 93 (noventa e três) votos a favor e 12 (doze) abstenções
  votacao: 93 votos a favor e 12 abstenções
  pagina: 4
  conferido: true
- tema: retirada da proposta de alteração do Regulamento Regional
  decisao: a Assembléia, após ampla discussão, aprova com 77 (setenta e sete) votos a retirada da proposta
  votacao: 77 votos a favor
  pagina: 4
  conferido: true
- tema: criação de Comissão de Trabalho para alterações no Regulamento Regional
  decisao: foi indicado o nome do Chefe Francisco, do GE Almirante Tamandaré, para presidir esta Comissão e aberto a todo
    interessado que o procure para se incorporar ao trabalho
  votacao: ''
  pagina: 4
  conferido: true
- tema: realização de enquete sobre alteração da Bandeira da Região São Paulo
  decisao: foi aprovada por unanimidade a proposta que a Direção Regional proceda a uma enquete entre os Grupos Escoteiros,
    buscando conhecer a opinião geral sobre a alteração de nossa Bandeira
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: representação do Ramo Pioneiro no Fórum Nacional de Liderança Jovem
  decisao: foi aprovado por unanimidade que os delegados do Ramo Pioneiro à Assembléia Regional representem a Região de São
    Paulo no Fórum Nacional de Liderança Jovem e que no próximo ano seja criado um Fórum Regional de Liderança Jovem que eleja
    seus representantes
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: apoio logístico do Primeiro Grupo de Gilwell ao projeto de reforma do Campo Escola
  decisao: a Assembléia referendou a proposta do Chefe Elmer de que o Primeiro Grupo de Gilwell assuma o apoio logístico do
    projeto de reforma do Campo Escola; assim fica o Chefe Elmer encarregado de buscar apoio do Grupo para esta tarefa
  votacao: ''
  pagina: 5
  conferido: true
- tema: encaminhamento de pendências à Assembleia Nacional
  decisao: ficou acertado que a Direção Regional reveja a ata da Assembléia de Botucatu, selecione as pendências e as encaminhe
    à Assembléia Nacional deste ano
  votacao: ''
  pagina: 5
  conferido: true
- tema: consulta à Direção Nacional sobre votação para delegados regionais
  decisao: a Presidência encaminhou a solicitação do chefe Simões à Direção Regional para providencia
  votacao: ''
  pagina: 5
  conferido: true
- tema: proposta para regularização da participação dos Pioneiros nas Assembleias Regionais
  decisao: a proposta será levada à Assembléia Nacional
  votacao: ''
  pagina: 5
  conferido: true
- tema: cobrança de Taxa Regional por membro registrado
  decisao: foi a proposta aprovada com 67 (sessenta e sete) votos a favor, 4 (quatro) votos contrários e 8 (oito) abstenções
  votacao: 67 votos a favor, 4 contrários e 8 abstenções
  pagina: 5
  conferido: true
