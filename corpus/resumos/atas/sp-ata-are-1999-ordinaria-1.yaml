doc_key: sp-ata-are-1999-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '1999-09-18'
  local: Câmara Municipal, Rua Seis 2241, Centro, Jales, Estado de São Paulo
deliberacoes:
- tema: Comissões de trabalho
  decisao: Não havendo objeções à composição das comissões, o Sr. Presidente colocou em votação, sendo aprovadas por aclamação
    pela Assembléia.
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: Leitura da Ata da Reunião Ordinária da Assembléia Regional de 1998
  decisao: foi aprovado não ler a ata em plenário
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Aprovação da Ata da Reunião Ordinária da Assembléia Regional de 1998
  decisao: O Sr. Presidente colocou a Ata da Reunião Ordinária da Assembléia Regional de 1998 em votação tendo sido aprovada
    pelo plenário.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Aprovação do balanço de 1998
  decisao: O Sr. Presidente colocou em votação a aprovação do balanço de 1998, obtendo unanimidade na aprovação do balanço
    de 1998.
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Orçamento para o ano 2000 e taxa de contribuição associativa regional
  decisao: O Sr. Presidente colocou em votação na forma que foi apresentado o orçamento para o ano 2000, incluindo a taxa
    de contribuição associativa regional, obtendo 81 votos a favor e 51 votos contra, sem abstenções.
  votacao: 81 votos a favor e 51 votos contra
  pagina: 4
  conferido: true
- tema: Discussão sobre proposta de alteração do Estatuto da UEB, Artigo 23
  decisao: O Sr. Presidente colocou em votação se o plenário prefere discutir a proposta referente a mudança do Estatuto da
    UEB em outro momento e esse foi aprovado com 76 votos a favor e 44 votos contra.
  votacao: 76 votos a favor e 44 votos contra
  pagina: 4
  conferido: true
- tema: Encaminhamento da proposta de manutenção do texto atual da Promessa e Leis do Lobinho à Diretoria Nacional
  decisao: O Sr. Presidente consulta ao plenário se concorda com o encaminhamento da proposta de manutenção do texto atual
    ao nível Nacional, sendo aprovada pelo plenário.
  votacao: aprovada pelo plenário
  pagina: 5
  conferido: true
- tema: Manutenção das Leis Escoteiras
  decisao: Colocada em votação em manter as Leis Escoteiras, houve 74 votos a favor e 44 votos contra, sendo que o plenário
    manifestou-se para que na próxima reunião ordinária da Assembléia Nacional, os Delegados Regionais insistam na manutenção
    dos textos das Leis e da Promessa.
  votacao: 74 votos a favor e 44 votos contra
  pagina: 5
  conferido: true
- tema: Encaminhamento da proposta para trazer ao Brasil o Jamboree Mundial em 2011
  decisao: O Sr. Presidente pôs em votação o encaminhamento da proposta à Assembléia Nacional, proposta aprovada por aclamação.
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Eleição da cidade sede da 7º Assembléia Regional de 2000
  decisao: sendo eleita a cidade de São Paulo.
  votacao: ''
  pagina: 5
  conferido: true
