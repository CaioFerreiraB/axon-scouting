deliberacoes:
- tema: Eleição da Mesa Diretora do Fórum
  decisao: Carolina Ikuta obteve 44 votos e Ivan Benigno obteve 28 votos, sendo eleita por maioria de votos, portanto, Carolina
    Ikuta como a presidente da Mesa do XVII Fórum de Jovens Líderes de 2019. Pietá Rivas como vice-presidente da mesa do XVII
    Fórum de Jovens Líderes de 2019. Bianca Krauze eleita por aclamação como primeira secretária. Victoria Ennser eleita por
    maioria de votos como a segunda secretária da mesa do XVII Fórum de Jovens Líderes de 2019.
  votacao: maioria e aclamação
  pagina: 1
  conferido: true
- tema: Leitura e aprovação da ata do XVI Fórum Regional de Jovens Líderes
  decisao: O Fórum aprova a medida de leitura da ata de 2018. A Comissão de Revisão e Estilo será criada para entregar a ata
    reescrita no mesmo dia para ser aprovada no próximo fórum. A medida é aprovada por aclamação. Na segunda sessão, a ata
    é aprovada por aclamação sob o acordo comum de que as alterações requisitadas durante a sessão serão feitas posteriormente.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Relatório da Gestão 2018 e Prestação de Contas
  decisao: Foram apresentados os gastos com transporte aéreo para eventos diversos, detalhados em valores específicos para
    cada evento.
  votacao: ''
  pagina: 3
  conferido: false
- tema: Projeto Cartilha Diversidades
  decisao: Comentam sobre a proposta e o surgimento do GT Diversidades, a criação da cartilha pela Nacional e a expectativa
    de lançamento em breve.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Projeto Conversa temática
  decisao: Proposta de mini debate em julho e aguardar apresentação na Assembleia sobre pesquisa de satisfação.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Apresentação das chapas candidatas à Diretoria Regional
  decisao: Apresentação das chapas Caminhando Juntos e Espírito Escoteiro para Diretoria Regional.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição dos Delegados Regionais ao Fórum Nacional de Jovens Líderes
  decisao: David Beraha, Hareline Belotti e Heloisa Justo eleitos por aclamação como Delegados Titulares e Suplentes.
  votacao: aclamação
  pagina: 7
  conferido: true
- tema: Eleição dos novos membros do Núcleo Regional de Jovens Líderes
  decisao: Nicholas Casagrande eleito Coordenador 1 ano com 50 votos. Mariana Reali eleita Coordenadora 2 anos com 59 votos.
    Julia Pacheco eleita Comunicadora 2 anos com 39 votos.
  votacao: votos expressos
  pagina: 7
  conferido: true
- tema: Eleição da cidade-sede do Encontro Regional de Jovens Líderes 2019
  decisao: São João da Boa Vista eleita cidade-sede com 44 votos, Santos 39 votos e 7 abstenções.
  votacao: 44 votos a 39 votos
  pagina: 8
  conferido: true
- tema: Proposta de elaboração de documento formal sobre membros dos GTs regionais e nacionais
  decisao: Proposta aprovada por aclamação para responsabilização do Núcleo pela elaboração do documento e apresentação à
    Diretoria Regional.
