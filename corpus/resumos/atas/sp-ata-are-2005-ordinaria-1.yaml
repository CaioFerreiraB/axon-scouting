reuniao:
  tipo: ordinaria
  data: '2005-09-24'
  local: Avenida Hélio Vergueiro Leite, s/nº - Jardim Universitário — Municipio de Espirito Santo do Pinhal, São Paulo
deliberacoes:
- tema: Aprovação da ata da Assembleia Regional anterior
  decisao: O Presidente da Assembléia coloca em votação a ata da Assembléia Regional de 2004, sendo a mesma aprovada pela
    maioria absoluta.
  votacao: maioria absoluta
  pagina: 2
  conferido: true
- tema: Deliberação das contas do exercício de 2004
  decisao: Após toda a discussão o Presidente da Assembléia colocou em votação as contas do exercicio de 2004, sendo aprovada
    por 89 votos, contra 60 votos e abstenções.
  votacao: 89 votos a favor, 60 contra
  pagina: 2
  conferido: true
- tema: Deliberação do orçamento para 2006
  decisao: O Presidente da Assembléia coloca em votação a proposta para o Orçamento da Região para o ano de 2006 em 17.334
    registros, o que foi aprovado por maioria absoluta.
  votacao: maioria absoluta
  pagina: 3
  conferido: true
- tema: Permissão para novas inscrições de candidatos a delegados à Assembleia Nacional
  decisao: A Assembleia permitiu a novas inscrições de candidatos a delegados à Assembleia Nacional, o que foi aprovado por
    aclamação.
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: Proposta para sediar a Assembleia de 2006
  decisao: Proposta para sediar a Assembleia de 2006, do Pólo Grande Norte, na Cidade de Guarulhos, foi aprovada por aclamação.
  votacao: aclamação
  pagina: 5
  conferido: true
