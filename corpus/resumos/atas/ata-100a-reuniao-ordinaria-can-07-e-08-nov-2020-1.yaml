- tema: Existência do Comitê de Gestão de Riscos vinculado ao CAN
  decisao: 'votam por existir o Comitê de Gestão de Gestão de Riscos vinculado ao CAN, tal como proposto: ROMEU, MUSSIO, LEONARDO,
    DAYANNA, MAGU e ISABELLY. Votam pelo CAN assumir as responsabilidades que seriam do Comitê de Gestão de Riscos: MANIQUE,
    ADRIANO, SARAH, ROBSON, CHRISTIAN e THIAGO. Com abstenção de MARK e RENATO, por não estarem presentes no momento da votação.
    Empatada a votação, ISABELLY, apesar de ter a prerrogativa do desempate por ser a presidente, entende que devemos discutir
    melhor o assunto para quando for ser votada a política. ADRIANO muda o seu voto, votando agora pela criação do Comitê
    de Gestão de Riscos vinculado ao CAN. MARK adentra a reunião e vota pela criação do Comitê de Gestão de Riscos vinculado
    ao CAN.'
