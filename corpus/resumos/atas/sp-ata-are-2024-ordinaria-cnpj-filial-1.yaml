doc_key: sp-ata-are-2024-ordinaria-cnpj-filial-1
reuniao:
  tipo: ordinaria
  data: '2024-03-23'
  local: Teatro TUPEC, Avenida dos Trabalhadores, 2555, Mogi Guaçu, São Paulo
deliberacoes:
- tema: 'Eleição e posse da Comissão Assessora da Assembleia: Escrutínio'
  decisao: Patrick Alves da Silva Quiterio 66/SP e Hitoshi Nakayama 20/SP, aprovados por aclamação pela plenária e ficaram
    encarregados de monitorar o sistema de votação da empresa EasyVote Soluções Interativas
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Eleição e posse da Mesa Diretora
  decisao: Rafael Melis Rogéro foi eleito Presidente da Trigésima Primeira Reunião Ordinária da Assembleia Escoteira Regional
    de São Paulo por aclamação; Renato Wanderley Breneizer e Fernando Nastri Palmieri foram aprovados por aclamação como primeiro
    e segundo Vice-Presidentes; Rosemary Peres Motta e Larissa Lemes Avari Lauterjung foram aprovadas por aclamação como primeiras
    e segundas secretárias
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Acolhimento dos membros das Comissões Assessoras da Assembleia
  decisao: Acolhimento na íntegra dos voluntários para as Comissões de Credenciamento, Eleitoral e Assuntos Gerais, aprovado
    por aclamação pela plenária
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Dispensa da leitura da ata da reunião anterior
  decisao: Dispensada a leitura da ata da reunião anterior, aprovada por aclamação pela Assembleia
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Correção da ata da reunião anterior
  decisao: Lucas e Caio farão acerto na Ata com base no vídeo do YouTube, aprovado por aclamação pela plenária
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Aprovação do Relatório da Diretoria Regional na Gestão do ano de 2023
  decisao: Relatório aprovado por aclamação
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Aprovação das contas e balanço do exercício fiscal anterior
  decisao: Contas aprovadas por 192 votos a favor, 74 contra e 35 abstenções
  votacao: 192 votos a favor, 74 contra e 35 abstenções
  pagina: 8
  conferido: true
- tema: Aprovação da Previsão Orçamentária para o próximo exercício fiscal
  decisao: Previsão orçamentária aprovada com 158 votos a favor, 60 contra e 83 abstenções
  votacao: 158 votos a favor, 60 contra e 83 abstenções
  pagina: 8
  conferido: true
- tema: Aprovação da ata da reunião anterior com complementação
  decisao: Complementação da ata aprovada por aclamação
  votacao: aclamação
  pagina: 12
  conferido: true
- tema: Escolha da cidade sede para a realização da XXXII Reunião Ordinária da Assembleia Escoteira Regional e XXIII Fórum
    Regional de Jovens Líderes em 2025
  decisao: A Assembleia Regional 2025 será responsabilidade da Região Escoteira de São Paulo, realizada na Grande São Paulo,
    aprovado por aclamação
  votacao: aclamação
  pagina: 12
  conferido: true
- tema: Eleição dos Delegados Regionais à Assembleia Escoteira Nacional
  decisao: Foram eleitos 24 delegados e dois suplentes por aclamação, dispensada votação
  votacao: aclamação
  pagina: 12
  conferido: true
- tema: Proposta de alteração estatutária para realização de assembleias híbridas
  decisao: Aprovado por aclamação submeter aos assuntos gerais a proposta de alteração estatutária para possibilitar a realização
    de assembleias em formato híbrido
  votacao: aclamação
  pagina: 9
  conferido: true
- tema: Proposta do Fórum de Jovens Líderes para composição da delegação paulista com ao menos 1/3 de jovens líderes
  decisao: Proposta do chefe Renato Breneizer para formação de comissão mista para construir solução foi aprovada por 153
    votos a favor, contra 87 votos da proposta original do Fórum e 51 contra ambas; votação revogada e refeita com mesmo resultado
  votacao: 153 votos a favor da proposta do chefe Renato, 87 votos a favor da proposta do Núcleo de Jovens Líderes e 51 contra
    as duas propostas
  pagina: 11
  conferido: true
- tema: Estabilidade das instâncias juvenis na estrutura regional
  decisao: Proposta aprovada por aclamação para incluir no Regulamento Regional as instâncias juvenis Núcleo Regional de Jovens
    Líderes, Comissão Regional Pioneira, Diretoria Jovem e Conselho Regional Jovem
  votacao: aclamação
  pagina: 11
  conferido: true
- tema: Encaminhamento de propostas de assuntos gerais para criação de comissões de análise
  decisao: Encaminhamento aprovado para criação de comissões para política de valores para associados isentos em eventos regionais
    e transparência financeira em eventos regionais, para apresentação na próxima reunião ordinária de 2025
  votacao: aprovado
  pagina: 13
  conferido: true
