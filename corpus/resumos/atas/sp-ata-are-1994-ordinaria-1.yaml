  tipo: ordinaria
  data: '1994-03-12'
  local: Casa de Retiro São José localizada à Rua José Rochel Rodrigues, 22 - bairro Casa Grande - Santo Amaro - São Paulo
deliberacoes:
- tema: Ata da reunião anterior
  decisao: foi dispensa a leitura da ata da reunião, sendo aprovado sem emendas e ressalvas
  votacao: ''
  pagina: 2
  conferido: true
- tema: Contas e orçamento de 1993 e 1994
  decisao: foram rejeitados e o Presidente da Assembléia prorrogou o prazo para aprovação do orçamento, em uma reunião ordinária
    a ser realizada no dia 15 de maio de 1994 no Campo Escola Jaraguá, sendo a proposta aprovada por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Relatório de atividades de 1993
  decisao: o Presidente da Comissão Executiva fez uma explanação sobre o relatório anual, e comentou que por motivos alheios
    a vontade desta diretoria alguns objetivos do plano de metas não foram atingidos, no entanto informou que os objetivos
    de informatização do escritório regional, comodato e a ampliação do Campo Escola Jaraguá foram atingídos satisfatoriamente
  votacao: ''
  pagina: 2
  conferido: true
