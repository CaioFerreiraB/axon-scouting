reuniao:
  tipo: ordinaria
  data: '1996-09-14'
  local: Escola de Primeiro e Segundo Grau “Cardoso de Almeida”, Avenida Santana S/N, Centro, Botucatu; SP
deliberacoes:
- tema: aprovação da ata da Assembléia anterior
  decisao: por aclamação da plenária foi abolida sua leitura, e colocada em discussão, não havendo nada a discutir, foi colocada
    em votação, sendo aprovada pôr unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: apresentação e deliberação das contas do exercício de 1995
  decisao: Colocado em votação as contas de 1995, foram aprovadas por unanimidade
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: apresentação e deliberação do orçamento para 1996
  decisao: Foi colocado em votação a proposta orçamentaria de 1996 sendo aprovado pela maioria, tendo três votos contra
  votacao: maioria
  pagina: 3
  conferido: false
- tema: proposta de alteração do Regulamento Regional (inclusão de artigo referente à Biblioteca Regional)
  decisao: não há decisão explícita sobre aprovação, apenas menção na pauta e discussão geral, sem deliberação clara
  votacao: ''
  pagina: 1
  conferido: false
- tema: estudo para modificação da Bandeira Regional
  decisao: foi colocado em votação, sendo aprovado pela Assembléia que se faça o estudo para a modificação da Bandeira Regional
  votacao: aprovado pela Assembléia
  pagina: 8
  conferido: true
- tema: escolha da cidade sede da próxima Assembléia Regional
  decisao: 'foi colocado em votação e tivemos os seguintes votos: Mogi das Cruzes 60 votos; Lapa 28 votos, ficando eleita
    para sediar a próxima Assembléia a cidade de Mogi das Cruzes'
  votacao: 60 votos a 28
  pagina: 8
  conferido: true
- tema: aceitação da inscrição dos delegados de Araraquara para votação
  decisao: foi colocado em votação, sendo aprovado o credenciamento com 64 votos a favor e 12 contra
  votacao: 64 votos a favor e 12 contra
  pagina: 9
  conferido: true
- tema: aprovação dos relatórios de atividades de 1995
  decisao: foi colocado em votação e aprovado por unanimidade
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: proposta de taxa máxima para inscrição nas Assembléias
  decisao: foi colocado em votação e a decisão pela planilha de custo venceu por 37 votos contra 26 para o custo máximo de
    R$15,00
  votacao: 37 votos contra 26
  pagina: 12
  conferido: true
- tema: encaminhamento da proposta para a Assembléia Nacional para suprimir frase do POR sobre traje escoteiro
  decisao: foi colocado em votação obtivemos 43 votos para à encaminhamento da propostas para a Nacional e 11 votos contra
  votacao: 43 votos a favor e 11 contra
  pagina: 13
  conferido: true
- tema: encaminhamento da proposta para incluir no calendário nacional o dia Internacional da Paz
  decisao: foi colocado o encaminhamento em votação e aprovado
  votacao: aprovado
  pagina: 13
  conferido: true
