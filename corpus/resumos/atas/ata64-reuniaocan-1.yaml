- tema: Comissão de acompanhamento ao Planejamento Estratégico
  decisao: Adir sugeriu que a Comissão seja composta por todos os membros eleitos do CAN e Ivan, um dos principais responsáveis
    pelo Planejamento Estratégico, concordou com a sugestão.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Medalha para Argus Rosenhaim
  decisao: Adir propôs medalha para Argus Rosenhaim pelo trabalho dele na Conferência e em diversos outros momentos... A proposta
    foi secundada por outros Conselheiros e deve ser encaminhada a DEN que deverá verificar a medalha a que o mesmo tem direito.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Local da próxima reunião
  decisao: Informado que as reuniões acontecem de forma alternada entre Curitiba e outras cidades tendo ficado acertado que
    a escolha do local para a próxima reunião será feita por votação virtual.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Novo representante da Região Sudeste
  decisao: Fred informou que o novo representante da Região Sudeste é Ricardo Coelho dos Santos (ES).
