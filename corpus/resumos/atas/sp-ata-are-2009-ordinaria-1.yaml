doc_key: sp-ata-are-2009-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '2009-08-29'
  local: CENFORPE - Centro de Formação dos Profissionais da Educação, Avenida Dom Jaime de Barros Câmara, n. 201, Bairro Planalto,
    São Bernardo do Campo — SP
deliberacoes:
- tema: Aprovação da ata da Assembleia Regional anterior
  decisao: 'Assim, realizada a votação é aprovada a ata da XV Assembléia Regional da UEB São Paulo com: 496 (cento e noventa
    e seis) votos favoráveis; 0 (zero) voto contrário; 14 (catorze) abstenções.'
  votacao: 496 votos a favor, 0 contra, 14 abstenções
  pagina: 2
  conferido: true
- tema: Aprovação das contas do exercício de 2008
  decisao: 'Presidência coordena votação que aprova as contas do exercício de 2008 com: 271 (duzentos e setenta e um) votos
    a favor, 0 (zero) voto contrário e 07 (sete) abstenções; cumprimentos e aplausos ao envolvidos.'
  votacao: 271 votos a favor, 0 contra, 7 abstenções
  pagina: 2
  conferido: true
- tema: Aprovação do Balancete do 1º semestre de 2009
  decisao: 'Parecer da Comissão fiscal ao Balancete do 1.0 semestre de 2009: Chefe Lívio, em nome da Comissão Fiscal, declara
    que as contas analisadas, foram consideradas justas e perfeitas.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Aprovação do apoio à apresentação do projeto de alteração do Programa ao Conselho de Administração Nacional e solicitação
    de autorização para implementação como Projeto Piloto
  decisao: A Presidente conduz a votação e, por aclamação, a Assembléia aprova o apoio à apresentação do projeto de alteração
    do Programa ao Conselho de Administração Nacional e da solicitação de autorização para que a Região de São Paulo o implemente
    como Projeto Piloto.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Aprovação do Orçamento para 2010 com acréscimo de R$ 1,00 nos registros
  decisao: 'Orçamento para 2010 com acréscimo de R$ 1,00 (um real) nos registros, que resultou em sua aprovação: com 239 (duzentos
    e trinta e nove) votos favoráveis; 25 (vinte e cinco) votos contrários e nenhuma abstenção, de um total de 264 (duzentos
    e sessenta e quatro) votos.'
  votacao: 239 votos a favor, 25 contra, 0 abstenções
  pagina: 6
  conferido: true
- tema: Criação de fundo para reforma do Campo Escola Jaraguá mediante acréscimo de R$ 2,00 nas taxas de renovação dos registros
    em 2010
  decisao: 'Criação de um fundo de caixa para reforma do Campo Escola Jaraguá, mediante acréscimo de R$ 2,00 (dois reais)
    nas taxas de renovação dos registros, somente durante o ano de 2010, também aprovada: com 199 (cento e noventa e nove)
    votos favoráveis, 62 (sessenta e dois) votos contrários e 08 (oito) abstenções, de um total de 269 (duzentos e sessenta
    e nove) votos.'
  votacao: 199 votos a favor, 62 contra, 8 abstenções
  pagina: 6
  conferido: true
- tema: Redução excepcional de 50% da taxa de registro não paga no ano anterior para quem regularizar seu registro
  decisao: Item aprovado com 182 (duzentos e trinta e nove) votos favoráveis, 76 (setenta e seis) votos contrários e 03 (três)
    abstenções, e um total de 271 (duzentos e setenta e um) votos.
  votacao: 182 votos a favor, 76 contra, 3 abstenções
  pagina: 6
  conferido: true
- tema: Isenção dos registros no primeiro e segundo lotes de registros dos Grupos Escoteiros novos
  decisao: Proposta aprovada com 239 (duzentos e trinta e nove) votos favoráveis, 25 (vinte e cinco) contrários e nenhuma
    abstenção. A mesa é alertada da existência de erro na impressão do Estatuto, quanto a esse assunto. Confirmado o erro,
    esclareceu-se que à isenção prevista para os novos Grupos Escoteiros é para o primeiro ano e não para o primeiro lote,
    o que torna nula essa última votação.
  votacao: 239 votos a favor, 25 contra, 0 abstenções (votação anulada)
  pagina: 6
  conferido: true
- tema: Eleição da Diretoria Regional para o mandato de 01/jan/2010 a 31/dez/2012
  decisao: Apresentada a chapa, é eleita por aclamação (discurso do Diretor Presidente eleito anexo).
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Eleição da Comissão Fiscal Regional para o mandato de 01/jan/2010 a 31/dez/2012
  decisao: Levantada questão de ordem quanto à validação dos votos destinados ao candidato ausente. Para celeridade nas gerais,
    a presidência conduz votação e, por aclamação a Assembleia.
  votacao: aclamação
  pagina: 7
  conferido: true
