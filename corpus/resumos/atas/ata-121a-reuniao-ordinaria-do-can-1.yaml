- tema: Ata da Reunião Extraordinária do CAN - Eleição DEN Triênio 2025-2028
  decisao: A ata registra a reunião extraordinária do Conselho de Administração Nacional dos Escoteiros do Brasil, realizada
    em 15 de dezembro de 2024, na qual foi aprovada por unanimidade a chapa "UNIDOS PELO ESCOTISMO", liderada por Irineu Muniz
    de Rezende Neto, para a Diretoria Executiva Nacional no triênio 2025-2028.
  votacao: 12 votos a favor, 2 abstenções
  pagina: 2
  conferido: true
