reuniao:
  tipo: ordinaria
  data: '2022-10-08'
  local: videochamada pelo Zoom, com transmissão pelo canal dos Escoteiros do Brasil no Youtube
deliberacoes:
- tema: Ata da 109ª Reunião Ordinária do CAN
  decisao: Ata da sessão aberta da 109ª Reunião Ordinária do Conselho de Administração Nacional, realizada nos dias 20 e 21
    de agosto de 2022. Aprovada com 10 votos a favor (ALDENISE, NETO, CLAUCIO, DANIELA, DAVID, ILKA, LINDOMAR, RAFAEL, RENATO
    E SARAH) 4 abstenções por falta de pronunciamento (MAGU, DAYANNA, LAURA e ROBSON).
  votacao: 10 votos a favor, 4 abstenções
  pagina: 2
  conferido: true
- tema: Ratificação da Validação de Candidatura ao Comitê Escoteiro Interamericano
  decisao: Após a DEN aprovar a candidatura, passa o Conselho de Administração Nacional a realizar a ratificação quanto à
    validação da candidatura à reeleição ao Comitê Escoteiro Interamericano (CSI) do associado Rubem Tadeu Cordeiro Perlingeiro.
    Aprovado por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Propostas de Resolução para a 28ª Conferência Interamericana
  decisao: 'A delegação dos Escoteiros do Brasil apresentou ao CAN o texto de duas resoluções para serem apresentadas e submetidas
    à 28ª Conferência Interamericana: uma sobre a Composição da Delegação com espaço para a participação juvenil nos espaços
    de tomada de decisão e outra sobre Acessibilidade Econômica acerca dos espaços utilizados para eventos da Região Interamericana.
    Aprovada com 10 votos a favor (ALDENISE, CLAUCIO, DANIELA, DAVID, ILKA, LINDOMAR, RAFAEL, RENATO, ROBSON E SARAH), 2 votos
    contrários (MAGU e LAURA) e 2 abstenções por falta de pronunciamento (NETO e DAYANNA).'
  votacao: 10 votos a favor, 2 contrários, 2 abstenções
  pagina: 2
  conferido: true
- tema: Ratificação de coordenação de Grupo de Trabalho
  decisao: Por unanimidade é aprovada a coordenação por Adrian Cordeiro do Nascimento do GTAPRI.
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Resolução CAN 06/2022 - Regulamenta a função do representante de Área Geográfica no CAN
  decisao: Por unanimidade a Resolução CAN 06/2022 - Regulamenta a função do representante de Área Geográfica no Conselho
    de Administração Nacional (CAN) da União dos Escoteiros do Brasil (UEB) é aprovada por todos.
  votacao: unanimidade
  pagina: 5
  conferido: true
