    Comissão Nacional de Gestão de Adultos: Ênio Hideyuki Cojho – Fred, Hélio, João, Castrianni, Klaes e Rafael Will; Comissão
    Nacional de Relações Institucionais: Marco Aurélio Romeu Fernandes – Alessandro e Rafael (GO); Comissão Nacional de Gestão
    Institucional: Mário Henrique Peters Farinon - Fred, Marcos e Rubem; Comissão Nacional de Relações Internacionais: Oscar
    Victor Palmquist Arias – Castrianni e Klaes.'
