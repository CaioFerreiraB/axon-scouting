- tema: Custeamento das despesas do CAN
  decisao: 'Foi aprovada proposta de encaminhar à apreciação da Assembléia Nacional, para deliberação, o custeio, ou não,
    de despesas de passagens para os Conselheiros Nacionais às Reuniões do CAN. Foram 9 votos favoráveis, dois votos contrários
    e uma abstenção. Proposta 2: Manutenção da decisão de novembro condicionada a informação em julho/2006, pela DEN, da existência
    de condições financeiras para tal: 6 votos favoráveis e 1 abstenção e o voto contrário de Farinon quanto à deliberação
    do assunto. Aprovada a proposta 2.'
  votacao: 9 votos favoráveis, 2 contrários e 1 abstenção; depois 6 votos favoráveis, 1 abstenção e 1 voto contrário
  pagina: 2
  conferido: true
- tema: Indicações das Comissões Assessoras
