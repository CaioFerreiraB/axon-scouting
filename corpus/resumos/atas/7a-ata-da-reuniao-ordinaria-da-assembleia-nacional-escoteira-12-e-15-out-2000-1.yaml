doc_key: 7a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-12-e-15-out-2000-1
reuniao:
  tipo: ordinaria
  data: '2000-10-12'
  local: Centro de Turismo do Serviço Social do Comércio — SESC, Rodovia do Sol, 1, Muquiçaba, Guarapari, ES
deliberacoes:
- tema: eleição da mesa diretora
  decisao: 'foi eleita a Mesa, conforme segue: Presidente: Paulo Salamuni (PR); Vice-presidentes: Baldur Oscar Schubert (DF)
    e Fernando Girelli (ES); Secretárias: Diva Irene da Paz Vieira (PR) e Dárcio Hélio Longhi (PR)'
  votacao: ''
  pagina: 1
  conferido: true
- tema: eleição das Comissões Assessoras
  decisao: 'COMISSÃO DE CREDENCIAMENTO: Iara Soares de Andrade (DF), Marcelo Lisboa (SC), Mariovani Carsten Cervi (PR), apoiada
    pelo Executivo Luiz César de Simas Horn (SC); COMISSÃO ELEITORAL: Carlos Delmar Lima Lyrio (DF); Jorge Luís Pinheiro Ferreira
    (RJ) e Márcio Siqueira da Silva (RS); COMISSÃO ESCRUTINADORA: Fábio Rodrigo Conde (RJ), Frederico Augusto Siqueira Neves
    (MG) e Sérgio Luís Franzner (SC); COMISSÃO DE ASSUNTOS GERAIS: Celso Luiz Girardello (PR), João Batista Fiorini Thomé
    (SC) e Luiz Salgado Klaes (SC)'
  votacao: ''
  pagina: 2
  conferido: true
- tema: aprovação da ata da reunião anterior
  decisao: a ata, constante do Relatório Anual distribuído a todos os presentes, foi colocada em discussão e aprovada, no
    final dos trabalhos, sem restrições
  votacao: ''
  pagina: 2
  conferido: true
- tema: aprovação do Relatório de Atividades 1999-2000 e Balanço Anual 1999
  decisao: foram aprovados, por unanimidade, o Relatório e as Demonstrações Financeiras, acompanhados do Parecer da Comissão
    Fiscal e do Parecer dos Auditores Independentes
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: aprovação do Relatório e Balanço da Loja Escoteira de 1999
  decisao: aprovados, por unanimidade, o Relatório e as Demonstrações Financeiras da Loja, acompanhados do Parecer da Comissão
    Fiscal e do Parecer dos Auditores Independentes
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: autorização para inscrição de candidatos menores de 21 anos para Comissão de Ética e Disciplina Nacional
  decisao: decidiu autorizar a inscrição de candidatos menores de vinte e um anos para aquela Comissão
  votacao: ''
  pagina: 3
  conferido: true
- tema: validação do direito a voto do Conselheiro Fiscal eleito em 1999 para complementação de mandato
  decisao: o eleito não teria direito a voto, consideração que foi referendada pela Assembléia
  votacao: ''
  pagina: 3
  conferido: true
- tema: eleição dos Conselheiros do Conselho de Administração Nacional para mandato 01/01/2001 a 31/12/2003
  decisao: 'Com cento e dois votos válidos, eleitos: Rubem Tadeu Cordeiro Perlingeiro, vinte votos; Júlio Augusto Mendes Ericeira,
    dezoito votos; Marcel Hugo, quinze votos; Marcos Venício Mattos Chaves, quinze votos; Irineu Muniz de Resende Neto, treze
    votos'
  votacao: 102 votos válidos
  pagina: 3
  conferido: true
- tema: eleição dos membros da Comissão Fiscal Nacional para mandato 01/01/2001 a 31/12/2003
  decisao: 'Com cento e um votos válidos e um branco, foram eleitos: Membros Efetivos: NELSON OTÁVIO MAIA (PR), trinta e quatro
    votos; MODESTO CARRO LOUREIRO (RS), trinta e um votos; CARLOS DELMAR LIMA LYRIO (DF), quatorze votos. Membros Suplentes:
    ADIR BARUSSO (PR), onze votos; LUÍS SALGADO KLAES (SC), nove votos; MARIOVANI CARSTEN CERVI (PR), dois votos'
  votacao: 101 votos válidos e 1 branco
  pagina: 3
  conferido: true
- tema: eleição dos membros da Comissão de Ética e Disciplina Nacional para mandato 19/01/2001 a 31/12/2003
  decisao: 'Foram eleitos: Membros Efetivos: MARCELO LISBÔA (SC), FREDERICO AUGUSTO SIQUEIRA NEVES (MG) e MARCO AURÉLIO ROMEU
    FERNANDES (RS); Membros Suplentes: MAURO GOMES CARDOSO (SP) e ALESSANDRO GARCIA VIEIRA (DF)'
  votacao: 70 votos válidos
  pagina: 4
  conferido: true
- tema: aprovação da proposta de aprofundamento dos estudos para realização do Jamboree Mundial de 2011 no Brasil
  decisao: foi aprovada a proposta de que os estudos sejam aprofundados, incluindo-se a participação, na Comissão, de Gerardo
    Gonzalez
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: constituição de Comissão para proposta da Rede Escoteira Brasileira de Jovens Líderes
  decisao: foi aprovada a constituição de Comissão composta por cinco jovens e cinco adultos, com a missão de, até dezembro
    de 2000, apresentar proposta para a Rede Escoteira Brasileira de Jovens Líderes
  votacao: ''
  pagina: 5
  conferido: true
- tema: eleição da Região-sede e Região-sede Alternativa para a 9.o Reunião Ordinária da Assembleia Nacional e 8.o Congresso
    Escoteiro Nacional
  decisao: por unanimidade, foi eleita a Região de Minas Gerais para sediar os eventos; como Região Alternativa, foi eleita
    a Região do Rio Grande do Sul
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: ratificação do credenciamento dos Delegados e validação dos votos
  decisao: Com setenta e cinco votos favoráveis, treze contrários e nenhuma abstenção, a Assembléia ratificou o credenciamento
    dos Delegados e considerou válidos os votos
  votacao: 75 votos a favor, 13 contra, 0 abstenções
  pagina: 7
  conferido: true
- tema: deliberação sobre proposta de reforma estatutária
  decisao: as propostas do Seminário serão apresentadas uma a uma, para considerações e deliberação, as quais, para serem
    aprovadas, precisarão de 2/3 dos votos, conforme Art. 62 do Estatuto; as modificações passam a vigir a partir desta data;
    os pontos divergentes e outras sugestões de mudança do Estatuto serão encaminhados à Comissão Estatuinte para análise
    e proposta na próxima Assembleia Nacional
  votacao: ''
  pagina: 8
  conferido: true
- tema: aprovação de alterações estatutárias diversas
  decisao: foram aprovadas as alterações estatutárias conforme redação registrada nas páginas 9 a 11, incluindo competências
    da Assembleia Nacional, composição e mandato do Conselho de Administração Nacional, Diretoria Executiva Nacional, Comissão
    de Ética e Disciplina Nacional, Assembleia Regional, Diretoria Regional, Assembleia de Grupo e Diretoria do Grupo, entre
    outras
  votacao: ''
  pagina: 9
  conferido: true
- tema: recomendação para esforços na eleição de jovens líderes como delegados às Assembleias
  decisao: recomendado sejam feitos esforços por parte dos Grupos e Regiões Escoteiras para elegerem jovens lideres como delegados
    às Assembleias
  votacao: ''
  pagina: 12
  conferido: true
