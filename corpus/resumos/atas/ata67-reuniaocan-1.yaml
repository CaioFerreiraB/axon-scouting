reuniao:
  tipo: ordinaria
  data: '2011-11-05'
  local: São Paulo/SP
deliberacoes:
- tema: Escolha do Presidente da Diretoria Executiva Nacional - DEN
  decisao: considerando o perfil definido para o novo Presidente da Diretoria Executiva Nacional – DEN o CAN analisou e aceitou
    as candidaturas de Alessandro Garcia Vieira, Antonio Felipe de Almeida Gonçalves e Marco Aurelio Romeu Fernandes. Foi
    decidido por 9 votos a favor, 2 contra e 2 abstenções por votação secreta. Ouvidas as propostas e argüidos os candidatos,
    os Conselheiros decidiram por 8 votos pela escolha de Marco Aurélio Romeu Fernandes para a função.
  votacao: 9 votos a favor, 2 contra e 2 abstenções na primeira votação; 8 votos para Marco Aurélio Romeu Fernandes na escolha
    final
  pagina: 1
  conferido: true
- tema: Composição da Comissão de avaliação de pedidos de condecorações
  decisao: a Comissão ficou composta por Altamiro, Paulo Henrique e Sônia.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Proposta de Resolução que Regulamenta a Concessão de Condecorações e Recompensas
  decisao: 'a) Retirada da criação da Comissão Nacional de Condecorações e Recompensas da presente resolução e criá-la mediante
    outra Resolução: o CAN aprovou manter a criação da Comissão dentro da própria Resolução; b) Definição da utilização do
    nome “Comenda” ou “Medalha”: o CAN aprovou a utilização do nome “Medalha”; c) Alteração do nome “Medalha de Valor Caio
    Vianna Martins” para “Medalha Cruz de Valor Caio Vianna Martins”: o CAN aprovou o uso do nome “Medalha Cruz de Valor Caio
    Vianna Martins”; d) Proposta de concessão de Medalha de Bons Serviços para os jovens somente após 10 anos de Bons Serviços:
    o CAN aprovou a proposta. A Resolução foi aprovada por unanimidade e sua publicação e vigência serão a partir do momento
    que as medalhas estejam confeccionadas.'
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Previsão financeira da UEB para 2012
  decisao: O CAN decidiu que deverá ser inserido como “Receita de captação” o valor correspondente ao percentual de 10% sobre
    a receita operacional líquida da UEB de 2010 (conforme Planejamento Estratégico) e a despesa prevista no Planejamento
    Estratégico para realização do Concurso de Projetos (aproximadamente R$10.000,00). O CAN aprovou a Previsão Financeira
    da UEB para 2012 ficando pendente a aprovação das despesas para o próprio CAN.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Orçamento do CAN 2012
  decisao: 'Após apreciação, o CAN decidiu: a) que o valor relativo a Reuniões do CAN será discutido por ocasião da análise
    do Regulamento do CAN; b) que o valor relativo à Representação do CAN será retirado do orçamento; c) que o valor relativo
    à Consultoria e Grupos de Trabalhos, será decidido após a definição das Comissões e suas necessidades.'
  votacao: ''
  pagina: 4
  conferido: true
- tema: Modificações em artigos do Regulamento do CAN
  decisao: 'a) Artigo 11: aprovado que a UEB cobrirá a despesa de deslocamento da cidade de origem até a cidade de destino;
    caso a UEB não tenha condições de cobrir tal despesa elas serão rateadas; participarão do rateio todos os Conselheiros
    Nacionais, seus suplentes convocados e os ausentes não justificados; Parágrafo único aprovado. b) Inserção do Artigo 5
    - Pautas Eletrônicas: aprovada a proposta para agilizar trabalhos entre reuniões ordinárias do CAN por meio eletrônico.
    c) Artigo 14 (renumerado para 15): aprovado que o CAN poderá instituir Grupos de Trabalhos internos com registro em ata
    dos participantes e coordenador, sem poder substituir a DEN ou tomar decisões do CAN.'
  votacao: ''
  pagina: 4
  conferido: true
- tema: Proposta de Resolução sobre Formação de Dirigentes eleitos e nomeados nos níveis Nacional e Regional
  decisao: O CAN concluiu não ser o caso de se ter uma nova Resolução, eis que a proposta já está contemplada nas atuais Diretrizes,
    entretanto, foi deliberado que o assunto será encaminhado à DEN, para que seja elaborada uma nota, com o objetivo de orientar
    os associados quanto à adoção dos procedimentos de formação, nos termos da proposta apresentada.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Comissões do CAN
  decisao: De acordo com resolução aprovada pelo CAN, as comissões do CAN passam a ter a denominação de Grupo de Trabalho,
    diferenciando-se assim, das comissões da DEN.
  votacao: ''
  pagina: 7
  conferido: true
- tema: Acompanhamento dos trabalhos realizados pelos Grupos de Trabalho (GT´s)
  decisao: 'O CAN decidiu que os Grupos de Trabalho prioritários são: Financiamento e Políticas Comerciais (CAN) coordenado
    por Bráulio; Gestão Integrada (CAN) coordenado por Paulo Henrique e Cristine; Relações Institucionais (DEN); Avaliação
    (CAN) coordenado por Rogério; Comunicação (DEN); Crescimento (DEN). Valores definidos para orçamento do CAN: Grupos de
    Trabalho R$18.000,00; Consultoria R$60.000,00; Reuniões do CAN R$30.000,00. Tais valores devem ser incorporados à Previsão
    Financeira da UEB para 2012.'
  votacao: ''
  pagina: 7
  conferido: true
- tema: Resolução que disciplina a prática do Escotismo e requisitos para reconhecimento das UEL’s
  decisao: A nova resolução recebeu o número 02/2011 e foi aprovada pelo CAN. Altamiro recomendou que as UEL´s que não tenham
    o seu certificado de reconhecimento para o ano não sejam listadas no Relatório Anual da UEB.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Resolução que determina os valores da contribuição para 2012
  decisao: A Resolução recebeu o número 01/2011 e foi aprovada pelo CAN. Altamiro propôs que 30% do repasse referentes a Roraima
    e Tocantins, onde não há Região Escoteira, fossem utilizados como desconto no valor do registro. Rubem Tadeu informou
    que a DEN está constituindo um fundo com os valores referentes ao repasse destes estados para ser utilizado no fomento
    do escotismo local.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Pedido da UEB/RS de Alienação de Imóvel
  decisao: O CAN aprovou o pedido por unanimidade.
  votacao: unanimidade
  pagina: 8
  conferido: true
- tema: Local das reuniões do CAN em 2012
  decisao: O CAN aprovou que as reuniões de agosto e novembro/2012 sejam realizadas em São Paulo.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Proposta que as reuniões do CAN encerrem às 16 horas
  decisao: O CAN aprovou a sugestão.
  votacao: ''
  pagina: 8
  conferido: true
