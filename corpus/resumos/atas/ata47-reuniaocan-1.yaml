- tema: Eleição da Diretoria Executiva Nacional
  decisao: 'O CAN ratifica a seguinte composição da Diretoria Executiva Nacional: Diretor Presidente: Paulo Salamuni, 1.º
    Vice-Presidente: Carlos Frederico dos Santos e 2.º Vice-Presidente: Adir Barusso.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Rateio de despesas das reuniões do CAN
  decisao: por consenso fica definido que as despesas serão sempre rateadas entre os 15 (quinze) membros titulares, ou seja,
    os 15 (quinze) conselheiros sempre participarão do rateio correspondente às despesas de deslocamento, independentemente
    de estarem, ou não, presentes e haverem, ou não, justificado a ausência.
  votacao: consenso
  pagina: 2
  conferido: true
- tema: Continuidade da Presidência e Vice-Presidência do CAN
  decisao: Renato propõe a continuidade de Geraldino na Presidência. A sugestão é aceita e Geraldino, de imediato, indica
    o nome de Marco Romeu para continuar na Vice-Presidência, que também é aceito.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Indicação dos Presidentes e composição das Comissões Estratégicas
  decisao: 'Geraldino apresenta a seguinte proposta de composição: Comissão Nacional de Gestão Institucional – CNGI, Presidente:
    Mário Henrique Peters Farinon e membros: Antônio César de Oliveira e Alessandro Vieira; Comissão Nacional de Gestão de
    Adultos – CNGA, Presidente: Ênio Hideyuki Cojho e membros: Geraldino Ferreira Moreira e Hélio Borba Moratelli; Comissão
    Nacional de Programa de Jovens – CNPJ, Presidente: Maria Terezinha Koneski Weiss e membros: Siágrio Felipe Pinheiro, Sérgio
    Luís Franzner, Guilherme Augusto Klingelfuss, Christian André Dávalos e Fábio Rodrigo Conde; Comissão Nacional de Relações
    Institucionais – CNRInst, Presidente: Marco Aurélio Romeu Fernandes e membro: Alessandro Vieira; Comissão Nacional de
    Relações Internacionais – CNRI, Presidente: Oscar Victor Palmquist Arias e membros: Marco Aurelio de Mello Castrianni
    e Luiz Salgado Klaes; Comissão Nacional de Crescimento – CNC, Presidente: Renato Eugênio de Lima e membros: Antônio César
    de Oliveira, João Roberto A. Cunha, Luiz Salgado Klaes, Sérgio Luís Franzner e Marco Aurélio Romeu Fernandes; Rede Interamericana
    de Recursos Humanos – Ênio Hideyuki Cojho, Geraldino Ferreira Moreira e Dennys Rodrigues Oliveira; Guias e Cartilhas -
    Luiz César de Simas Horn, Maria Terezinha Koneski Weiss, Marcos Carvalho e Carmem Barreira; REME - Guilherme Augusto Klingelfuss,
    Fernando Montserrat e Siágrio Felipe Pinheiro; Rede de Desenvolvimento Institucional - Marco Aurélio Romeu Fernandes,
    Rubem Tadeu Cordeiro Perlingeiro. Rede de Jovens Líderes – Ricardo Stuber.'
  votacao: ''
  pagina: 2
  conferido: true
