- tema: Concessão de Condecorações
  decisao: 'Tapir de Prata: concedida à Maurício Moutinho da Silva e à José Ferreira Machado foi aprovada por unanimidade;
    Medalha Tiradentes: concedida ao Grupo Escoteiro Mal. Rondon – 41/SP. Velho Lobo: concedida a Rubem Süffert.'
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Recurso na Ação Disciplinar contra João Alves dos Santos
  decisao: decidido que deverá ser formalizado à Região Escoteira do Pará a manutenção da decisão anterior e o não acatamento
    do recurso interposto.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Resolução sobre atividades nacionais
  decisao: A proposta foi aprovada por unanimidade e definida como Resolução 002/2005.
  votacao: unanimidade
