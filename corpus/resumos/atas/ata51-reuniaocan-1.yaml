doc_key: ata51-reuniaocan-1
reuniao:
  tipo: ordinaria
  data: '2006-07-15'
  local: Torre Palace Hotel, Brasília/DF
deliberacoes:
- tema: aprovação da ata da 50ª reunião do CAN
  decisao: a ata foi lida e aprovada por unanimidade após contemplar as ressalvas apresentadas por Castrianni, Klaes e Renato
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: criação de comissão de estudos sobre o Ramo Castor
  decisao: a proposta de criação da comissão de estudos recebe 8 (oito) votos contrários e 04 (quatro) votos favoráveis sendo,
    portanto, rejeitada
  votacao: 8 votos contrários e 4 votos favoráveis
  pagina: 1
  conferido: true
- tema: inserção de área no site da UEB para manifestação de associados sobre assuntos do CAN
  decisao: foi aprovada proposta que determina a inserção no site da UEB (no link destinado ao CAN) de uma área que permita
    a manifestação de associados da UEB sobre assuntos de relevância em discussão pelo CAN
  votacao: ''
  pagina: 1
  conferido: true
- tema: elaboração de calendário nacional de cursos
  decisao: é aprovado que seja elaborado um calendário nacional de cursos a fim de possibilitar e tentar facilitar a participação
    de interessados nos cursos oferecidos
  votacao: ''
  pagina: 2
  conferido: true
- tema: proposta de resolução "Crescimento é tarefa de todos"
  decisao: a minuta apresentada é aprovada com a supressão dos itens “b” e “f”, bem como é definida a realização de um Seminário
    Nacional de Crescimento a ser desenvolvido ainda este ano sob a coordenação da DEN e da Comissão de Crescimento da UEB
  votacao: ''
  pagina: 2
  conferido: true
- tema: alteração das etapas do Ramo Pioneiro
  decisao: a proposta deve ser encaminhada pela DEN à CNPJ para que seja apresentado parecer até outubro de 2006 (90 dias)
  votacao: ''
  pagina: 2
  conferido: true
- tema: distintivo especial Ramo Pioneiro
  decisao: a resolução é aprovada por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: criação de comissão para revisão do POR
  decisao: foi aprovada a realização de trabalho de revisão do texto do POR, que não importe alteração em seu conteúdo material,
    sob coordenação da DEN, que deverá apresentar o texto final no prazo de 90 (noventa) dias para posterior remessa ao CAN
  votacao: ''
  pagina: 3
  conferido: true
- tema: extração de receitas e despesas do Jamboree Mundial do SIG
  decisao: Proposta aprovada para extração do Sistema de Informações Gerenciais das receitas e despesas correspondentes ao
    Jamboree Mundial, com sua apresentação em quadro separado
  votacao: ''
  pagina: 3
  conferido: true
- tema: contribuição associativa para 2007 e inclusão de seguro agregado
  decisao: A resolução foi aprovada conforme texto em anexo. Quanto ao tema seguro ficou definido que a UEB deverá disponibilizar
    um serviço que facilite aos grupos a implementação, facultativa, do mesmo, cabendo à DEN a definição do melhor formato
  votacao: ''
  pagina: 3
  conferido: true
- tema: postergamento da deliberação sobre efetivo mínimo de Grupos Escoteiros
  decisao: Após amplo debate deliberou-se postergar a deliberação para o segundo dia de reunião
  votacao: ''
  pagina: 3
  conferido: true
- tema: divulgação da Assembleia Nacional de 2007 em Goiás
  decisao: Informado que na próxima semana será efetuada visita ao local e que dentro dos próximos 30 dias se iniciará a divulgação
    do evento
  votacao: ''
  pagina: 3
  conferido: true
- tema: apresentação da proposta de calendário 2007
  decisao: A DEN remeterá nos próximos dias a proposta de Calendário para o ano de 2007
  votacao: ''
  pagina: 3
  conferido: true
- tema: fixação da taxa do Mutirão Nacional Pioneiro 2007
  decisao: a taxa do Mutirão Nacional Pioneiro, a ser realizado em Porto Alegre, no mês de janeiro de 2007 foi fixada em R$
    300,00
  votacao: ''
  pagina: 3
  conferido: true
- tema: cronograma de produção de vídeos para capacitação de adultos
  decisao: foi aprovado que a DEN apresentará na próxima reunião do CAN um cronograma de produção de vídeos, sugerindo a periodicidade
    de sua produção, temas e formato
  votacao: ''
  pagina: 3
  conferido: true
- tema: alteração na sistemática de pontuação do Projeto Grupo Padrão
  decisao: Deliberou-se que as sugestões dos conselheiros devem ser centralizadas junto à Comissão de Crescimento, com Renato,
    para apresentação na próxima reunião do CAN
  votacao: ''
  pagina: 3
  conferido: true
- tema: inclusão do Distintivo de Piloto no POR
  decisao: foi aprovada a remessa do tema à CNPJ. O trabalho deverá ser acompanhado pela DEN
  votacao: ''
  pagina: 3
  conferido: true
- tema: resolução de registro e efetivo mínimo de Grupos Escoteiros
  decisao: o texto foi aprovado conforme anexo, com a fixação de regras e quantitativos mínimos para o reconhecimento de uma
    Unidade Escoteira Local e de Regiões Escoteiras
  votacao: ''
  pagina: 3
  conferido: true
- tema: avaliação do Programa de Jovens
  decisao: foi determinada a montagem de uma equipe multidisciplinar, vinculada à DEN, para avaliação total do Programa de
    Jovens e apresentação de sugestões ao CAN, com autonomia para utilizar os meios que entenda necessários para a consecução
    da referida avaliação
  votacao: ''
  pagina: 4
  conferido: true
- tema: alteração da resolução sobre aplicação de medidas disciplinares
  decisao: Deliberou-se que Rubem elaborará proposta de alteração da resolução que trata do tema
  votacao: ''
  pagina: 4
  conferido: true
- tema: avocação de procedimento disciplinar da Região Escoteira do Rio Grande do Sul
  decisao: A proposta é aprovada, devendo a DEN adotar as medidas necessárias para o encaminhamento da questão, resposta à
    Diretoria Regional e solução breve do processo
  votacao: ''
  pagina: 4
  conferido: true
- tema: concessão da Medalha Velho Lobo
  decisao: Aprovada a concessão da Medalha de Velho Lobo ao escotista Antônio Rodrigues, da Região Escoteira de São Paulo
  votacao: ''
  pagina: 4
  conferido: true
- tema: parceria com Grupo ELETRONORTE e confecção de Calendário 2007
  decisao: Ambos os temas são aprovados e deverão ser implementados pela DEN com urgência, sobretudo no que refere ao Calendário
    de 2007
  votacao: ''
  pagina: 4
  conferido: true
- tema: definição de política de captação de recursos externos
  decisao: Após amplo debate restou fixada a orientação à DEN para que atente à questão e desenvolva estudos que possibilitem
    sua permanente realização
  votacao: ''
  pagina: 4
  conferido: true
- tema: definição do local do IV Jamboree Nacional Escoteiro
  decisao: a DEN deliberou, desde já, definir como local do próximo Jamboree Nacional o Estado do Paraná
  votacao: ''
  pagina: 4
  conferido: true
