- tema: aprovação da ata da XXXIII Reunião do CAN
  decisao: Aprovada a ata fazendo constar que o texto do Manual do Escotista do Ramo Escoteiro foi aprovado com as alterações
    determinadas na reunião, após terem sido ouvidas as sugestões vindas das regiões
  votacao: ''
  pagina: 1
  conferido: true
- tema: composição das Comissões Estratégicas
  decisao: 'ficam as Comissões assim constituídas: Comissão de Programa de Jovens — Presidente: Carmem Virgínia Barreira,
    demais membros: David Crusius, Marcos Carvalho, Alexandre Machado Silva, Fábio Rodrigo Conde, Guilherme Klingetfuss; Comissão
    de Gestão de Adultos — Presidente: Geraldino Ferreira Moreira, demais membros: Júlio Mendes Ericeira, Marco Aurélio de
    Mello Castrianni; Comissão de Gestão Institucional — Pte.: Rubem Siffert e demais membros: Marco Aurélio Romeu Fernandes,
    Paulo Ney Ferreira da Silva, Rubem Tadeu C. Perlingeiro; Comissão de Relações Institucionais — Pte.: Marcos Venício Mattos
    Chaves; Comissão de Relações Internacionais — Pte.: Oscar Victor Palmquist Arias; Comissão de Crescimento — Pte.: Irineu
    Muniz de Resende Neto, demais membros: Marcel Hugo, Frederico Augusto Neves; e as Subcomissões assim representadas: Subcomissões
    de Programa: Espiritualidade: Maria Isabel de Oliveira Tongu; AR: Marcelo Penteado; MAR: Carlos Borba; criada a subcomissão
    Escotismo para Todos: Wiaderley Astolphi Galera e Jorge Lancevicius. Subcomissões de Gestão Institucional: Planejamento
    Estratégico e sua Avaliação; Política Comercial, Gestão Financeira e Captação de Recursos, Gestão Regional, Gestão de
    Unidades Escoteiras Locais, Comunicação Interna. Subcomissões de Relações Institucionais: União Parlamentar. Os nomes
    para presidirem as Subcomissões mencionadas estarão sendo escolhidos pelas Comissões a que estão subordinadas'
  votacao: ''
  pagina: 1
  conferido: true
- tema: forma de trabalho do CAN
  decisao: este colegiado aprova os procedimento e decide que os itens da proposta apresentada serão tomados como sugestão
    não havendo necessidade de criar-se regra específica sobre o tema. Fica ainda determinado que o Escritório Nacional faça
    um estudo sobre a viabilidade econômica de realização de reuniões do CAN em São Paulo e Rio de Janeiro, além de Curitiba.
    Fica ainda decidido que as decisões tomadas nas reuniões deverão ser publicadas de forma sucinta no Site da UEB
  votacao: ''
  pagina: 1
  conferido: true
- tema: Resolução 001/02 - Evasão
  decisao: fica aprovada alterando-se a proposta no artigo 1o, alínea “b” de “programa” para “projetos”; alínea “c”, de conveniente”
    para “necessário” e nos considerandos, alínea “c”, também de “conveniente” para “necessário”, conforme documento anexo
  votacao: ''
  pagina: 2
  conferido: true
- tema: resolução sobre delegações de poderes do CAN
  decisao: o CAN resolve fazer constar em ata que, a partir desta data, todas as delegações de poderes feitas pelo Conselho
    de Administração Nacional, e antes de sua criação, pelo órgão que lhe antecedeu então denominado Diretoria Nacional, tornam-se
    sem efeito e que a Diretoria Executiva Nacional e os Executivos Nacionais devem submeter de imediato ao CAN as delegações
    que estão utilizando e que consideram essenciais para 0 funcionamento da UEB
  votacao: ''
  pagina: 2
  conferido: true
- tema: proposta de resolução alterando o Regulamento do CAN
  decisao: fica aprovada a alteração do Regulamento conforme proposta apresentada, não representando esta decisão uma “Resolução
    do CAN”, conforme o documento anexo
  votacao: ''
  pagina: 2
  conferido: true
- tema: divisão do material do JamPan estocado
  decisao: sugere que seja feita a divisão do que está estocado entre as Regiões consorciadas para realizar o evento e a Direção
    Nacional dentro dos interesses de cada um e condições do material e o que não for destinado a ninguém que seja doado a
    alguma instituição, empresa ou interessado, finalizando mais esta questão
  votacao: ''
  pagina: 2
  conferido: true
- tema: proposta de resolução estabelecendo o “Perfil do Secr. Geral”
  decisao: o documento foi encaminhado à Comissão de Gestão Institucional
  votacao: ''
  pagina: 2
  conferido: true
- tema: cadernos de progressão do Ramo Escoteiro
  decisao: O CAN, após deliberação decide encaminhar a Comissão de Programa de Jovens, que terá até o final de ano para apresentar
    parecer, procurando ter o material disponível antes de
  votacao: ''
  pagina: 2
  conferido: true
- tema: proposta para condecorações
  decisao: o CAN decide que seja apresentada uma nova proposta de Resolução na reunião de maio, ficando o companheiro Geraldino
    responsável por este trabalho
  votacao: ''
  pagina: 3
  conferido: true
- tema: indicação dos delegados da UEB à Conferência Mundial e Fórum Mundial na Grécia
  decisao: o CAN indicará os delegados da UEB à Conferência e ao Fórum, na reunião de maio
  votacao: ''
  pagina: 3
  conferido: true
- tema: documento Estratégia para o Escotismo
  decisao: O CAN determina que este documento seja traduzido para o português e distribuído às Regiões e pessoas interessadas
    em participar da Conferência, além dos membros do Conselho
  votacao: ''
  pagina: 3
  conferido: true
- tema: inclusão do Fórum Mundial no Calendário Nacional
  decisao: O CAN determina que se inclua no Calendário Nacional o Fórum Mundial para maior divulgação e que o Escritório Nacional
    cobre da OSI o projeto com a BSA
  votacao: ''
  pagina: 3
  conferido: true
- tema: novos distintivos e terminologias
  decisao: O CAN decide que os assuntos deverão ser encaminhados às respectivas Comissões. Fred verificará cada um e encaminhará
    ao Escritório com as definições. Fred propõe ainda que seja feita uma nova pesquisa sobre a manutenção dos distintivos
    de especialidades na forma como existem hoje, ou se a preferência do público escoteiro é de voltar a utilização de um
    distintivo para cada especialidade. O CAN aprova a realização de uma nova pesquisa
  votacao: ''
  pagina: 3
  conferido: true
- tema: aprovação do Orçamento da UEB para 2002
  decisao: fica aprovado o Orçamento da UEB conforme documento anexo
  votacao: ''
