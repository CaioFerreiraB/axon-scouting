- tema: nomeação dos representantes da UEB nas Redes de Trabalho da OSI
  decisao: 'ficam nomeados para representar a UEB nas Redes de Trabalho da Oficina Scout Interamericana as seguintes pessoas:
    Rede de Desenvolvimento Institucional — Rubem Tadeu; Rede de Recursos Adultos - Marco Aurélio Castrianni; Grupo de Trabalho
    da Guias e Cartilhas — Rubem Siffert na primeira vaga e o Executivo Luiz César Hom na segunda. Fica decidido que o Escritório
    Nacional estará buscando a possibilidade de levantar uma terceira vaga para o companheiro Marcos Carvalho; Rede de Jovens
    — fica a DEN, ouvida a Comissão Nacional de Programa de Jovens, incumbida de definir quem estará ocupando esta vaga'
  votacao: ''
  pagina: 4
  conferido: true
