doc_key: sp-ata-are-2021-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '2021-03-27'
  local: São Paulo/SP
deliberacoes:
- tema: Eleição da Mesa Diretora dos trabalhos
  decisao: elegendo assim com 252 votos favoráveis Rodrigo de Freitas, contra 127 votos favoráveis para Pietá Rivas, 112 votos
    favoráveis para Robson Lancaster e 10 abstenções. Para 1º Vice-Presidente foi eleita Marianna Reali com 213 votos favoráveis,
    constando-se 143 votos para Ana Hidaka, 1220 votos para Bruno Fonseca e 15 abstenções. Para 2º Vice-Presidente foi eleito
    Erik Bueno com 253 votos favoráveis, constando-se 220 votos para Giuliano Di Raimo e 21 abstenções. Para 1º Secretário
    foi eleito Fernando Ramos com 464 votos favoráveis, constando-se 25 abstenções. Para 2º Secretário foi eleita Carolina
    Ikuta com 477 votos favoráveis, constando-se 21 abstenções
  votacao: ''
  pagina: 1
  conferido: true
- tema: Eleição das Comissões Assessoras da Assembleia
  decisao: com 449 votos favoráveis, 4 votos contrários e 6 abstenções, foi eleita a Comissão de Credenciamento e mantida
    nos serviços e, com 465 votos favoráveis, 6 votos contrários e 7 abstenções, a Comissão de Escrutínio também foi eleita.
    Larissa Avari foi eleita por aclamação para a Comissão de Estilo. Adriano da Luz foi eleito por aclamação para a Comissão
    de Avisos Gerais.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Aprovação da ata anterior
  decisao: proposto pelo Presidente da mesa a sua aprovação pela Plenária, sendo aprovada sem contestações e sem emendas
  votacao: ''
  pagina: 3
  conferido: true
- tema: Deliberação sobre presença de não-delegados na plataforma de videoconferência
  decisao: por maioria dos votos, 395 favoráveis, a Plenária se manteria como estava
  votacao: maioria
  pagina: 5
  conferido: true
- tema: Aprovação da Prestação de Contas e Balanço do Exercício Fiscal anterior
  decisao: foi demonstrado a aprovação da Prestação de Contas e do Balanço do Exercício Fiscal anterior com 416 votos favoráveis,
    20 votos contrários e 24 abstenções
  votacao: 416 votos favoráveis, 20 votos contrários e 24 abstenções
  pagina: 7
  conferido: true
- tema: Aprovação da Previsão Orçamentária para o próximo exercício
  decisao: foi demonstrado o resultado da votação do ITEM 6, notando-se 401 votos favoráveis à previsão orçamentária, 34 votos
    contrários e 22 abstenções, sendo assim aprovada, por maioria dos votos, a Previsão Orçamentária para o Exercício 2021-2022
  votacao: maioria
  pagina: 8
  conferido: true
- tema: Aprovação do Relatório Regional de Atividades de 2020
  decisao: encaminhou para deliberação da aprovação por aclamação, a qual não houveram objeções via Plenária online ou transmissões,
    sendo assim aprovado o Relatório Regional de Atividades de 2020
  votacao: aclamação
  pagina: 8
  conferido: true
- tema: Moção de apoio à alteração da idade de Jovem Líder na PNEJ
  decisao: solicitação foi aprovada sem opiniões contrárias
  votacao: aclamação
  pagina: 9
  conferido: true
- tema: Eleição do candidato paulista ao Conselho de Administração Nacional - CAN
  decisao: elegendo por maioria dos votos como candidato paulista ao CAN o Renato Wanderley Breneizer com 237 votos favoráveis
    contra 153 votos favoráveis para o Jabs Costa, 85 votos favoráveis para o Rudner Queiroz e 6 abstenções
  votacao: maioria
  pagina: 12
  conferido: true
- tema: Eleição dos Delegados Regionais à Assembleia Escoteira Nacional
  decisao: foram eleitos os 23 mais votados, com desempate pelo critério do membro mais novo, lista completa publicada no
    site Regional
  votacao: ''
  pagina: 13
  conferido: true
