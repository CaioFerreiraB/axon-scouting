- tema: Alteração do Estatuto da União dos Escoteiros do Brasil
  decisao: 'foram aprovadas por unanimidade com as seguintes alterações ao Estatuto da União dos Escoteiros do Brasil: Art.
    17-A Diretoria Executiva Nacional é O órgão executivo nacional constituído pelo Presidente e pelos dois Vice-Presidentes
    da UEB. § 1o - Os membros da Diretoria Executiva Nacional podem ser escolhidos dentre os integrantes do Conselho de Administração
    Nacional e ficam, neste caso, automaticamente licenciados da função de Conselheiro Nacional. Art. 23 - A Assembléia Regional
    é o órgão máximo, representativo e normativo em nivel regional. Compete à Assembléia Regional: I - deliberar sobre o Estatuto
    Regional e/ou o Regulamento Regional, oseu regulamento, o da Comissão Fiscal Regional e o da Comissão de Exiça Disciplina
    Regional; II - deliberar sobre os relatórios da Diretoria e da Comissão Fiscal; III - eleger em reunião ordinária: a)
    trienalmente os membros da Diretoria Regional, por chapa; e b) anualmente 1/3 (um terço) dos membros da Comissão Fisca
    Regional, e se houver, da Comissão de Ética e Disciplina Regional, por meio de votação unitária; IV - eleger anualmente,
    em reunião ordinária, e por votação unitária, seus Delegados titulares e suplentes junto à Assembléia Nacional, na proporção
    de um delegado para cada mil participantes registrados na Região no ano de sua realização; V - supervisionar a execução
    dos trabalhos afetos à Diretoria Regional, à Comissão Fiscal Regional e, se houver, à Comissão de Ética e Disciplina Regional;
    VI - propor ao Conselho de Administração Nacional a alienação ou a oneração dos bens imóveis da Região, na forma deste
    Estatuto; VII - deliberar sobre as contas e o balanço anual da Diretoria Regional, mediante parecer da Comissão Fiscal
    Regional; VIII - deliberar sobre questões de interesse da Região, fixando normas e procedimentos; IX- fixar a contribuição
    anual regional, dos participantes da UEB na Região; X - eleger, à cada reunião, seu Presidente, dois Vice-Presidentes
    e dois Secretários; XI - deliberar sobre a concessão de condecorações e recompensas cuja competência lhe for atribuída;
    e XII - indicar como candidato ao Conselho de Administração Nacional, um participante da UEB residente na Região que for
    mais votado em sua candidatura aprovada na Assembléia Regional. Art, 31 - A Assembléia de Grupo é o órgão máximo, normativo
    e deliberativo do Grupo Escoteiro. Compete à Assembléia do Grupo: I- deliberar sobre o regulamento ou estatuto do Grupo
    e da Comissão Fiscal do Grupo; II - eleger em reunião ordinária bienal: a) sua Diretoria, por meio de chapa; b) sua Comissão
    Fiscal, por meio de voto unitário; III - eleger anualmente e por votação unitária, seus representantes titulares e e suplentes
    junto à Assembléia Regional; IV - propor à Diretoria Regional, a alienação ou a oneração dos bens imóveis administrados
    pelo Grupo, na forma deste Estatuto; V - deliberar sobre as contas e o balanço anual-da Diretoria de Grupo, mediante parecer
    da Comissão Fiscal de Grupo; VI - deliberar sobre os relatórios da Diretoria, da Comissão Fiscal e das Seções do Grupo;
    VII - deliberar sobre a concessão de condecorações e recompensas, cuja competência lhe for atribuída; e VIII - eleger,
    a cada reunião, seu Presidente e seu Secretário. Art. 41 — A UEB tem, nos diversos níveis, as seguintes categorias de
    participantes: I- associados; II - beneficiários; III - escotistas; e IV - dirigentes; V- contribuintes; VI -colaboradores;
    VII - membros filiados; VIII —- membros beneméritos e honoríficos. § 1o - São associados da UEB os seus participantes
    com direito a voto na Assembléia Nacional e em dia com seu registro anual junto à Direção Nacional. § 2o - São beneficiários
    os membros juvenis: lobinhos, lobinhas, escoteiros, escoteiras, seniores, guias, pioneiras e pioneiros. § 3o - São escotistas,
    todos aqueles que, possuindo capacitação preestabelecida para o fim a que se propõem, forem nomeados para o cargo ou função
    cujo beneficiário direto são os membros juvenis (dependentes dos contribuintes) , tais como: chefes de Seção, assistentes,
    instrutores e outros auxiliares. § 4o - São dirigentes todos aqueles que possuindo capacitação preestabelecida para o
    fim a que se propõem, forem eleitos ou nomeados para o cargo ou função não incluídas no parágrafo anterior, tais como:
    integrantes de Diretorias, Comissões Fiscais, Comissões de Etica e Disciplina e Assembléias. § 5o - São contribuintes
    os pais ou responsáveis dos beneficiários, Os membros dos Clubes da Flor de Lis e as pessoas ou entidades admitidas pela
    respectiva Diretoria e que concorrem com contribuições regulares, segundo critérios definidos pela Assembléia correspondente,
    na forma dos regulamentos. § 6o - São colaboradores os antigos escoteiros e outras pessoas à Diretoria do respectivo nível.
    § 7o - São membros filiados, as instituições escoteiras, com personalidade jurídica própria, filiadas à UEB por decisão
    da Diretoria de nível imediatamente superior àquela entidade. § 8o - São membros beneméritos e/ou honoríficos todos aqueles
    que, à criter da Diretoria do nível a que se acham vinculados, assim deliberarem. § 9o - Os participantes das categorias
    previstas nos incisos III e IV deste artigo, são assim considerados automaticamente com a expedição de seu certificado
    de nomeação ou eleição. Já os integrantes das categorias V e VI deste artigo dependem da aprovação da Diretoria por meio
    do qual farão sua inscrição. § 10 - Os integrantes das categorias I e III a VI deste artigo, para que possam fazer uso
    de seus direitos como tal, voz e voto, eleger e ser eleito, devem estar em dia com suas obrigações sociais. Os membros
    da categoria VIII deste artigo tem direito a voz, não podendo, entretanto, votar ou serem votados nesta condição. § 11
    - Perde-se a condição de associado da UEB quando for eleito o respectivo substituto para a Assembléia Nacional. § 12 -
    É vetado o exercício simultâneo de funções na Diretoria e na Comissao Fiscal ou de Ética e Disciplina, no mesmo nível.
    § 13 - Os participantes da União dos Escoteiros do Brasil autorizam à entidade a utilizar o direito de suas imagens em
    atividades escoteiras. Art. 71 — A Assembléia Nacional Ordinária de 2004 ainda será realizada nos meses de outubro ou
    novembro e na mesma não haverá eleições para titulares e suplentes do Conselho de Administração Nacional, ficando prorrogados
    em até quatro meses os mandatos dos Conselheiros Nacionais titulares e suplentes, Ja eleitos, ou seja, até a data de encerramento
    da respectiva Assembléia Nacional Ordinária. Art. 72 - Na Assembléia Nacional Ordinária de 2006 serão eleitos, na ordem
    de votação, candidatos titulares e suplentes para a Comissão Fiscal Nacional e para a Comissão Nacional de Ética e Disciplina,
    com mandatos de dois anos e quatro meses (de 01 de janeiro de 2007 até o final da Assembléia Nacional Ordinária de 2009),
    um ano e quatro meses (de 01 de janeiro de 2007 até o final da Assembléia Nacional Ordinária de 2008) e de quatro meses
    (de 01 de janeiro de 2007 até o final da Assembléia Nacional Ordinária de 2007), se não surgirem antes vagas que permitam
    a eleição antecipada de suplentes. § 1o - Da mesma forma, as Assembléias Regionais elegerão os membros da Comissão Fiscal
    Regional, e se for o caso, da Comissão de Ética e Disciplina Regional, de tal forma a fazer a transição entre os atuais
    mandatos e a eleição anual de seus membros. § 2o — Existindo ou surgindo vagas nessas funções antes de 2007, as mesmas
    podem ser preenchidas, com os mandatos menores, para se desenvolver a transição.'
