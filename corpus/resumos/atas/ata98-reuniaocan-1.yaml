reuniao:
  tipo: ordinaria
  data: '2020-05-02'
  local: através de vídeo chamada pelo Zoom, com transmissão ao vivo pelo Facebook
deliberacoes:
- tema: aprovação de assuntos deliberados virtualmente no período
  decisao: 1) Aprovação do Escopo do projeto GT PNEJ; 2) Não validação da candidatura do associado Oscar Palmquist ao Comitê
    Mundial; 3) Continuidade do Processo Seletivo e consequentemente enviar o nome do jovem selecionado para participar do
    9º Encontro Escoteiro Internacional de Sharjah; 4) Validação da candidatura da associada Melissa Wilm Senna Pinto a Assessora
    Juvenil no Comitê Mundial com 8 votos a favor (Mark Caldeira, Marco Aurélio Romeu, Isabelly Castro, Dayanna Cristine,
    Leonardo Vilar, Magu, Antonio Mussio e Adriano Chaves), 5 votos contra (Eduardo Manique, Sarah Amaral, Robson Moraes,
    Carlos Frederico e Christian Ubiratan) e 1 abstenção por falta de manifestação de voto (Renato Eugênio); 5) Alteração
    do texto da resolução 11/2019; 6) Aprovação da Política de Governança Institucional; 7) Aprovação de manter os valores
    de royalties dos últimos três meses na própria Loja Escoteira Nacional; 8) Aprovação para transferir, integralmente, o
    Fundo de Reserva Orçamentária para projetos futuros para o Fundo de Rescisão criado em 2019; 9) Aprovação da Resolução
    01/2020; 10) Aprovação da Resolução 02/2020; 10) Aprovação do escopo da Comissão Permanente de Posicionamento Institucional;
    11) Convalidação do Ofício 53/2020; 12) Aprovação dos termos do acordo de rescisão trabalhista do funcionário Luiz Cesar,
    apresentado pela DEN, com 9 votos a favor (Isabelly, Carlos Frederico, Mark, Marco Aurélio Romeu, Adriano, Leonardo, Dayanna,
    Magu e Nadir), 1 contra (Eduardo) e 4 abstenções por interpretar que não seja competência do CAN tratar sobre o assunto
    (Sarah, Christian, Renato, Robson); 13) Pedido de Licença Temporária do Conselheiro Leonardo.
  votacao: ''
  pagina: 2
  conferido: true
