  decisao: 'Foi aprovado com alterações. O CAN aprovou ainda a convocação de uma reunião Extraordinária da Assembléia Nacional
    com a seguinte ordem do dia: Análise e votação de alteração de Estatuto da UEB, em especial, para adequação ao Código
    Civil.'
