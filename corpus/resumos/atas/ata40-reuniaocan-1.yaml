- tema: Renúncia e substituição de Conselheiro
  decisao: Foi definido que o companheiro Thomé continuará participando da Comissão de Adultos e como representante do Brasil
    na REME. Em decorrência da renúncia, a vaga de Conselheiro será ocupada pelo suplente Baldur O. Schubert.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Aprovação da ata da reunião anterior
  decisao: Foi aprovada a ata sem alterações.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Proposta de alteração dos distintivos de especialidades
  decisao: Proposta quanto a alteração dos distintivos de especialidades, que foi aprovada. Ficou ainda decidido que a resolução
    só entrará em vigor após os distintivos estarem prontos, considerando que depende de orçamentos e confecção.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Criação da Subcomissão de Condecorações e Recompensas
  decisao: Foi aprovada a criação da sub-comissão que deverá analisar os pedidos apresentados, inclusive para esta reunião.
    A subcomissão ficou composta por Geraldino, Thomé, Marco Romeu e Frederico (MG).
  votacao: consenso
  pagina: 1
  conferido: true
- tema: Rateio das despesas para a reunião do CAN
  decisao: O rateio passará a ser feito a partir de fevereiro de 2004 conforme os critérios definidos.
  votacao: consenso
  pagina: 1
  conferido: true
- tema: Autorização para CNPJ próprio para a Região Escoteira de Santa Catarina
  decisao: Decidiu-se por conceder autorização após a regularização da dívida que possa comprometer o CNPJ nacional.
