- tema: Indicação de Fernando Brodeschi como candidato à reeleição para o Comitê Mundial
  decisao: O CAN aprovou a indicação por aclamação.
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: Taxa de registro e orçamento para 2017
  decisao: O CAN aprovou o valor de R$ 24 mil anuais, pagos no valor mensal de R$ 2 mil conforme solicitado, a ser repassado
    ao CCME e solicitou que a DEN desse encaminhamento ao assunto com vistas a assinatura do contrato de patrocínio/convênio.
    Finalmente a proposta da taxa de registro e orçamento para 2017, com todas as correções – aumento do efetivo, ajuste no
    valor de dezembro/2016, aporte ao fundo de emergência no início do exercício e efetivação do repasse para o CCME - foi
    aprovada por unanimidade.
  votacao: maioria e depois unanimidade
  pagina: 4
  conferido: true
- tema: Estudos sobre a taxa de registro anual para 2017
  decisao: Vendramini solicita à DEN estudos sobre a unificação da taxa com validade de doze meses a partir do seu pagamento
    e sobre a existência de uma tarifa social contemplando uma faixa intermediária de renda acima do limite atual de isenção.
    Alessandro propõe que estes estudos sejam apresentados em agosto de 2017, recebendo concordância do CAN.
  votacao: ''
  pagina: 4
  conferido: true
