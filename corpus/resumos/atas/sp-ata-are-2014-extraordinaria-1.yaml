doc_key: sp-ata-are-2014-extraordinaria-1
reuniao:
  tipo: extraordinaria
  data: '2014-03-15'
  local: Câmara Municipal de Louveira, situada à Rua Wagner Luiz Bevilacqua, nº 35, Bairro de Guembéê, em Louveira/SP
deliberacoes:
- tema: Eleição da Mesa Diretora da Assembleia
  decisao: 'Passa-se então à eleição do Presidente da Assembleia, com cento e dezessete (117) votos para o chefe Rafael e
    cinquenta e um (51) para o chefe Vicente. Assume então a presidência e a direção dos trabalhos o chefe Rafael. Depois
    de comum acordo entre os inscritos, são apresentados os demais membros da Mesa Diretora: Primeira Vice-Presidente: Mariana
    De Marchi Oliveira; Segundo Vice-Presidente: Vicente Porto Vasconcelos Filho, Primeiro Secretário: Marcelo José Fassina;
    e Segundo Secretário: Edison Luiz Benato. Aprovados por aclamação, é eleita e empossada a mesa de trabalhos conforme Regulamento.'
  votacao: 117 votos a favor de Rafael, 51 votos a favor de Vicente, demais membros aprovados por aclamação
  pagina: 1
  conferido: true
- tema: Eleição das Comissões Assessoras da Assembleia
  decisao: Apresentadas e homologadas as comissões, tais como propostas, aprovadas por aclamação.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Alterações do Estatuto da União dos Escoteiros do Brasil - Região de São Paulo
  decisao: Colocada então em votação a proposta de alteração do Estatuto constante da minuta foram cento e cinquenta e um
    (151) votos a favor, sete (7) contra e trinta e uma (31) abstenções. Após nova votação, foram duzentos e trinta e quatro
    (234) votos a favor, cinco (5) contra e quatorze (14) abstenções, sendo então aprovada a nova redação do Estatuto Regional.
  votacao: 151 votos a favor, 7 contra, 31 abstenções; depois 234 votos a favor, 5 contra, 14 abstenções
  pagina: 2
  conferido: true
- tema: Alterações do Regulamento da União dos Escoteiros do Brasil - Região de São Paulo
  decisao: Foi dispensada a leitura da minuta. Após discussões e votação sobre destaque referente ao número mínimo de grupos
    por distrito, a Assembleia decidiu por alterar o texto e posteriormente, com a retirada do parágrafo que estipulava um
    limite mínimo de grupos por distrito, foi aprovada a nova redação do Regulamento Regional. Foram duzentos e vinte e nove
    (229) votos a favor, sete (7) contra e oito (8) abstenções.
  votacao: 229 votos a favor, 7 contra, 8 abstenções
  pagina: 8
  conferido: true
