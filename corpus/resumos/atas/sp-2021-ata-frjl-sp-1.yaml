deliberacoes:
- tema: Eleição e Posse da Mesa Diretora dos trabalhos
  decisao: 'foi eleita e empossada a mesa diretora do XIX Fórum Regional de Jovens Líderes, composta por: Presidente Rafael
    Gomes de Araújo, Vice-presidente Isabela Barros Lacerda, Primeiro Secretário Maria Cecília Gatti, Segundo Secretário Felipe
    Lian Carvalhal Maroti'
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Eleição e posse da comissão de escrutínio
  decisao: foi eleita e empossada a comissão de escrutínio do XIX Fórum Regional de Jovens Líderes composta por Ana Beatriz
    Pereira de Lima, Juliana de Souza Francisco e Vitor Correa Pereira Dos Santos
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Leitura e aprovação da Ata do XVIII Fórum Regional de Jovens Líderes
  decisao: foi aceita a modificação na ATA sendo a única proposta e procedeu-se à aprovação da ata com alteração
  votacao: ''
  pagina: 2
  conferido: true
- tema: Eleição dos Delegados Regionais aos Fóruns Nacionais de Jovens Líderes
  decisao: declaram-se eleitos por aclamação os três candidatos Aleksander Dimitrius Rugeroni, Denis Valenzuela das Neves
    e João Pedro Maia
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: Eleição da cidade sede do Encontro Regional de Jovens Líderes
  decisao: foi decidido que Santos será a cidade sede do Encontro Regional de Jovens Líderes
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição dos novos membros do Núcleo Regional de Jovens Líderes
  decisao: foram eleitos Denis Valenzuela das Neves para Coordenador e Isabela Lacerda para Comunicadora
  votacao: ''
  pagina: 7
  conferido: true
- tema: Encaminhamento sobre Regulamento Geral da Rede Nacional de Jovens Líderes (RNJL)
  decisao: foi aprovado por aclamação para votar contra a aprovação do Regulamento Geral da Rede Nacional de Jovens Líderes
    no caso de a PNEJ não ser publicada antes do Fórum Nacional ou se os delegados julgarem que não há tempo hábil de consultar
    a rede antes do Fórum; foram aprovados por aclamação os encaminhamentos para a Assembleia Regional e para o Fórum Nacional;
    foi aprovado por aclamação a criação de Grupo de Trabalho para análise das propostas
  votacao: aclamação
  pagina: 7
  conferido: true
