doc_key: sp-ata-are-2016-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '2016-03-12'
  local: Teatro Municipal “Paulo Machado de Carvalho”, Alameda Conde de Porto Alegre, nº 840, bairro Santa Maria, São Caetano
    do Sul/SP
deliberacoes:
- tema: Mesa Diretora dos trabalhos
  decisao: 'Eleita e empossada a Mesa Diretora dos trabalhos, conforme Regulamento, com a seguinte composição: Presidência:
    Anderson Condrasisen, Primeiro Vice-Presidente: Félix Varejão; Segundo Vice-Presidente: João Carlos Valentim Veiga Júnior,
    Primeiro Secretário: Marcelo José Fassina; e Segundo Secretário: Juliano Ferreira Arcuri.'
  votacao: aprovada por aclamação
  pagina: 5
  conferido: true
- tema: Regras para votação
  decisao: 'Regras para votação aprovadas por aclamação: credenciamento encerrado às 10h30 do dia 13 de março de 2016; apresentação
    de documento de identificação com foto para votar; identificação ao retirar a cédula.'
  votacao: aprovada por aclamação
  pagina: 5
  conferido: true
- tema: Aprovação da ata da reunião anterior
  decisao: A ata foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: Contas e balanço do exercício fiscal de 2015
  decisao: Aprovação das contas e balanço do exercício fiscal de 2015, com parecer da Comissão Fiscal Regional recomendando
    a aprovação.
  votacao: 228 votos a favor, 2 contrários e 22 abstenções
  pagina: 7
  conferido: true
- tema: Previsão Orçamentária para 2016/2017
  decisao: Aprovação da Previsão Orçamentária para 2016/2017, com alteração da nomenclatura do item para "apoio à participação
    de jovens e jovens líderes em eventos estratégicos" e compromisso da nova Diretoria em estudar suplementação de verba
    para jovens em eventos estratégicos para 2018.
  votacao: 246 votos a favor, 0 contrários e 10 abstenções para aprovação da previsão; 174 votos a favor, 38 contrários e
    26 abstenções para compromisso de estudo
  pagina: 8
  conferido: true
- tema: Relatório de Gestão 2015
  decisao: Relatório de Gestão 2015 apresentado e aprovado por unanimidade.
  votacao: unanimidade
  pagina: 10
  conferido: true
- tema: Regulamentação da candidatura a múltiplos cargos
  decisao: Aprovação por grande maioria da proibição de concorrer a dois cargos eletivos na mesma eleição, com exceção para
    esta Assembleia, e sugestão de alteração futura do Estatuto ou Regulamento.
  votacao: 308 votos a favor, 126 contra e 12 abstenções
  pagina: 13
  conferido: true
- tema: Concorrência igualitária para Comissão Fiscal Regional
  decisao: Aprovação por unanimidade de que todos os candidatos inscritos concorram em condições iguais para as vagas titulares
    da Comissão Fiscal Regional.
  votacao: unanimidade
  pagina: 13
  conferido: true
- tema: Aprovação da lista de candidatos a Delegados Regionais à Assembleia Nacional
  decisao: Lista dos candidatos a delegados e suplentes aprovada por aclamação.
  votacao: aprovada por aclamação
  pagina: 16
  conferido: true
- tema: Entrega de condecorações
  decisao: Entrega de condecorações para membros da Equipe Regional do Ramo Sênior e da Equipe Regional de Imagem e Comunicação
    (ERIC).
  votacao: ''
  pagina: 15
  conferido: true
- tema: Aprovação da carta de posicionamento da Rede Nacional de Jovens Líderes – São Paulo sobre diversidade
  decisao: Proposição aprovada por unanimidade para encaminhamento da carta à Assembleia Nacional.
  votacao: unanimidade
  pagina: 19
  conferido: true
- tema: Escolha da Cidade-Sede para Congresso Escoteiro Regional 2017
  decisao: São José do Rio Preto aprovada por unanimidade como próxima sede do Congresso Escoteiro Regional.
  votacao: unanimidade
  pagina: 20
  conferido: true
- tema: Encaminhamento de proposições de Assuntos Gerais
  decisao: Proposições encaminhadas para análise e providências conforme parecer da comissão, incluindo criação de equipe
    regional de informática, apresentação do coletivo feminista "Lady Olave", criação de corpo de conselheiros em grupos escoteiros,
    políticas claras de contratação de profissionais escoteiros, alteração da votação dos Assuntos Gerais para início da Assembleia,
    revisão do Estatuto e Regulamento Regionais, restrições para candidaturas de diretores nomeados.
  votacao: ''
  pagina: 21
  conferido: true
- tema: Entrega da Medalha de Bons Serviços – 20 Anos
  decisao: Entrega da Medalha de Bons Serviços – 20 Anos à chefe Patrícia Diniz.
  votacao: ''
  pagina: 23
  conferido: true
- tema: Entrega dos Certificados de Grupo Padrão 2016
  decisao: Entrega dos Certificados de Grupo Padrão para 2016 encaminhada aos Distritos Escoteiros, aprovada por unanimidade.
  votacao: unanimidade
  pagina: 23
  conferido: true
- tema: Posse dos membros eleitos
  decisao: Renovação da Promessa Escoteira dos membros eleitos das Comissões Fiscal e de Ética Regionais e Delegados Regionais
    à Assembleia Nacional.
  votacao: ''
  pagina: 24
  conferido: true
- tema: Posse da Diretoria Regional eleita
  decisao: 'Posse da chapa #façapartedaevolução eleita para mandato 2016-2019, composta por: Jabs Amilton Dutra Costa (Diretor
    Presidente), Alexandre Banchi (Diretor Vice-presidente), Larissa Lemes Avari Lauterjung (Diretora Administrativa), Roberlei
    Volpe Beneduzi (Diretor Financeiro), Rodrigo de Paula Caires (Diretor de Relações Institucionais).'
  votacao: '283 votos para a chapa #façapartedaevolução'
  pagina: 25
  conferido: true
