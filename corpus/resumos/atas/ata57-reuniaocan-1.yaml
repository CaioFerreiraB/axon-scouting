doc_key: ata57-reuniaocan-1
reuniao:
  tipo: ordinaria
  data: '2008-08-16'
  local: São José dos Pinhais/PR
deliberacoes:
- tema: aprovação da agenda
  decisao: a Agenda sofreu algumas alterações e foi aprovada.
  votacao: ''
  pagina: 1
  conferido: true
- tema: aprovação da ata da 56ª reunião extraordinária do CAN
  decisao: a ata, colocada em votação, foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: sistemática de análise dos recursos contra medidas disciplinares
  decisao: definida a sistemática de análise dos recursos.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Diretrizes Nacionais de Gestão de Adultos
  decisao: o CAN decidiu passar a coordenação dos trabalhos de conclusão das Diretrizes a Antonio César Oliveira, definindo
    que, na próxima reunião, as novas Diretrizes deverão ser apresentadas para apreciação do CAN.
  votacao: ''
  pagina: 1
  conferido: true
- tema: alteração do Art. 13 do regulamento do CAN
  decisao: 'foi aprovada a seguinte alteração no Art. 13 do Regulamento do CAN: “As atas de reuniões e decisões do CAN e da
    DEN deverão ser aprovadas preferencialmente ao final de cada reunião, sendo seu extrato disponibilizado ao público em
    geral em até 30 dias.”'
  votacao: ''
  pagina: 1
  conferido: true
- tema: política de concessão de medalhas e condecorações aos membros do CAN e DEN
  decisao: O CAN decidiu, sem a necessidade de alteração do seu Regulamento, que, nas sessões solenes de Assembléias Nacionais,
    sejam entregues preferencialmente as medalhas Tiradentes e Tapir de Prata e que os membros que estão saindo do CAN só
    possam ser contemplados por medalhas a partir do ano seguinte à sua saída.
  votacao: ''
  pagina: 1
  conferido: true
- tema: edição de Resolução sobre distintivos de Recrutador e Semeador
  decisao: a mesma, que se encontra na pasta dos Conselheiros, foi analisada, modificada e aceita pelo CAN, tendo sido definida
    como Resolução 01/2008.
  votacao: ''
  pagina: 1
  conferido: true
- tema: proposta de Resolução sobre procedimentos eleitorais
  decisao: o CAN concluiu que tal assunto é de competência da Assembléia Nacional e que deverá ser apresentado na próxima
    AGO constando, inclusive, no Edital de Convocação.
  votacao: ''
  pagina: 1
  conferido: true
- tema: contratação de seguro para credenciamento anual 2009
  decisao: O CAN aprova a contratação do seguro devendo a DEN avaliar se existe algo mais em conta de outra seguradora.
  votacao: ''
  pagina: 2
  conferido: true
- tema: contribuição associativa para 2009
  decisao: a proposta de Resolução apresentada, que se encontra na pasta dos Conselheiros, foi analisada e aceita pelo CAN,
    tendo sido definida como Resolução 02/2008.
  votacao: ''
  pagina: 2
  conferido: true
- tema: intervenção na Região Escoteira do Amapá
  decisao: O CAN concorda com a gravidade da situação, decide que a DEN deve instaurar o competente Processo Disciplinar e
    efetivar a intervenção na Região Escoteira.
  votacao: ''
  pagina: 2
  conferido: true
- tema: tema motivacional para 2009
  decisao: O CAN aprova a idéia do tema e recomenda uma melhor adequação da frase.
  votacao: ''
  pagina: 2
  conferido: true
- tema: aprovação de balancetes
  decisao: Adir apresentou a razão dos balancetes não estarem disponíveis e ficou de disponibilizá-los com o parecer da Comissão
    Fiscal Nacional tão logo estejam prontos.
  votacao: ''
  pagina: 2
  conferido: true
- tema: situação dos processos disciplinares na DEN e CEDN
  decisao: Paulo informou que não existe na DEN, nenhum Processo Disciplinar que não esteja em tramitação regimental, o que
    foi ratificado por Siágrio, Presidente da Comissão de Ética e Disciplina Nacional – CEDN.
  votacao: ''
  pagina: 2
  conferido: true
- tema: política de auxílio para interiorização do Escotismo
  decisao: 'Propôs e foi aceita: a adoção de uma política de auxílio para interiorização do Escotismo e a montagem de uma
    Comissão composta por Altamiro, Sandra, Rafael Macedo, David e Bráulio, com suporte do Escritório Nacional, e definida
    como área piloto para implementação do projeto a Amazônia Legal e o Agreste.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: aceitação de participantes para IV Jamboree Nacional Escoteiro
  decisao: o CAN decidiu que devem ser aceitos participantes com mais de 10 anos de idade, desde que já tenham passado formalmente
    para o ramo escoteiro, antes da data da atividade, e esta informação deve ser propagada, não apenas àqueles que perguntarem
    no Escritório Nacional.
  votacao: ''
  pagina: 3
  conferido: true
- tema: proposta de alienação de imóvel da UEB/SC
  decisao: O CAN decide aprovar a venda por 11 votos favoráveis, com 2 abstenções.
  votacao: 11 votos a favor, 2 abstenções
  pagina: 3
  conferido: true
- tema: proposta de implementação do distintivo Listel Pioneiro
  decisao: A proposta foi aceita pelo CAN e encaminhada à DEN.
  votacao: ''
  pagina: 4
  conferido: true
- tema: símbolos das modalidades do Mar e Ar
  decisao: A proposta, constante na pasta dos Conselheiros, foi secundada por Raphael Tostes, aprovada pelo CAN, e encaminhada
    à DEN para incluir no Manual da Marca.
  votacao: ''
  pagina: 4
  conferido: true
- tema: insígnia de Net-Escotismo
  decisao: O CAN decidiu pelo encaminhamento da proposta à CNPJ para emissão de parecer.
  votacao: ''
  pagina: 4
  conferido: true
- tema: nova Resolução sobre medidas disciplinares
  decisao: o CAN decidiu por aprovar a proposta que será divulgada como Resolução 03/2008.
  votacao: ''
  pagina: 5
  conferido: true
- tema: envio eletrônico da pasta para Conselheiros
  decisao: a pasta distribuída aos Conselheiros deverá ser enviada por meio eletrônico para os que assim solicitarem eliminando-se
    sua impressão para a reunião do CAN.
  votacao: ''
  pagina: 5
  conferido: true
- tema: UEB custeará Seguro de Vida para associados de Grupos fundados em 2009
  decisao: o CAN analisando o Art. 18 da Resolução define que a UEB irá custear o Seguro de Vida relativo aos associados dos
    Grupos Escoteiros fundados no ano de 2009.
  votacao: ''
  pagina: 5
  conferido: true
- tema: indicação da nova DEN para biênio 2009/2010
  decisao: O CAN decidiu, por aclamação, que a nova Diretoria Executiva Nacional – DEN será composta por Rubem Tadeu Cordeiro
    Perlingeiro na Presidência, Marco Aurélio Romeu Fernandes como primeiro Vice-presidente e Renato Bini como segundo Vice-presidente.
  votacao: aclamação
  pagina: 5
  conferido: true
