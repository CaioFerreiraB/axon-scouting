doc_key: sp-2017-02-04-ata-de-reuniao-do-conselho-consultivo-regional-1
reuniao:
  tipo: ordinaria
  data: '2017-02-04'
  local: Centro Escoteiro Jaraguá (Parque Estadual do Jaraguá, Rua Adryano Reis, 20, Vila Jaraguá, São Paulo/SP)
deliberacoes:
- tema: Participação dos Presidentes dos Conselhos Regionais no Conselho Consultivo Regional
  decisao: Jabs ressalta que a proposta é que também participe das Reuniões do Conselho Consultivo Regional o Presidente do
    Conselho Regional Jovem a ser criado, e faz reflexão sobre a necessidade de serem feitas as mudanças necessárias no Estatuto
    e Regulamento Regionais para que os Presidentes dos Conselhos Regionais de Portadores da Medalha Velho Lobo e Jovem tenham
    também direito a voz e voto nas Reuniões do Conselho Consultivo Regional.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Composição de Grupo de Trabalho para Prêmio Distrito Padrão
  decisao: Deliberado composição de Grupo de Trabalho (GT) sobre a recriação do Prêmio Distrito Padrão, composto por Filipe
    Bassetto, Anderson Condrasisen, Filipe Vitalli, Juliano Arcuri e Vania Ferrari. Este GT deverá apresentar resultados na
    próxima Reunião do Conselho Consultivo Regional.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Proposta de fornecimento de kit didático para Distritos Escoteiros
  decisao: Raphael Raiza propõe ao Núcleo Gestor da Diretoria Regional que seja fornecido para cada Distrito Escoteiro um
    kit didático com literatura básica do Movimento Escoteiro, a exemplo do que é fornecido às UELs em processo de abertura/reabertura,
    para uso nos cursos e demais eventos de formação distritais. Roberlei sugere o Distrito Escoteiro utilize o repasse do
    Orçamento Compartilhado para adquirir este kit didático.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Verificação de falhas no protocolo de correspondências do Escritório Regional
  decisao: Thiago se compromete a verificar junto ao setor responsável do Escritório Regional para que falhas neste procedimento
    não se repitam.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Contestação da exigência de intimação pessoal em processos disciplinares
  decisao: Sergio Teijeira propõe que o Núcleo Gestor da Diretoria Regional conteste junto ao CAN e à DEN a exigência de intimação
    pessoal para denunciados em notificações de processos disciplinares, pois isto muitas vezes inviabiliza a condução desses
    processos.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Composição de Grupo de Trabalho para revisão do fluxograma de abertura/reabertura de UEL
  decisao: Deliberado pela composição de Grupo de Trabalho para revisão do referido fluxograma, composto por Filipe Bassetto,
    Anderson Condrasisen, Filipe Vitalli, Juliano Arcuri, Vania Ferrari, Agente de Desenvolvimento Regional e representante
    da Coordenação Regional de Crescimento e Expansão. Este GT deverá apresentar resultados na próxima Reunião do Conselho
    Consultivo Regional.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Alterações no formulário de parecer do Conselho Distrital para abertura/reabertura de UEL
  decisao: Por consenso dos presentes, tendo em vista a dificuldade de se reunir o Conselho Distrital sobretudo no Interior,
    desde já fica alterado o formulário de parecer do Conselho Distrital sobre abertura/reabertura de UEL, de modo que possa
    ser preenchido unicamente pelo Comissário Distrital ou assessor designado para abertura/reabertura de UEL, consultado
    o Conselho Distrital.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Alterações no Manual do Comissário Distrital
  decisao: Por consenso dos presentes, são feitas alterações em trechos no Manual do Comissário Distrital, e deverão ser aguardados
    os resultados do GT de revisão do fluxograma regional para abertura/reabertura de Unidades Escoteiras Locais para que
    sejam feitas as alterações necessárias no Manual do Comissário Distrital, para, em seguida, ser publicada nova edição
    do referido Manual.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Remanejamento de Aparecido Duarte para Agente de Desenvolvimento Regional
  decisao: Núcleo Gestor da Diretoria Regional informa que Aparecido Duarte foi remanejado para a nova função de Agente de
    Desenvolvimento Regional, responsável por dar suporte aos Comissários Distritais e aos Coordenadores Distritais de Crescimento
    e Expansão no processo de abertura/reabertura de Unidades Escoteiras Locais e para viabilizar projetos estratégicos e
    especiais da Região Escoteira de São Paulo relacionados à área.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Informações sobre regulamentação da Lei Estadual 16.304/2016
  decisao: Renato Araujo da Silva e Vera Lucia Santos da Silva informam que já realizaram algumas reuniões com representantes
    da Secretaria de Estado da Educação de São Paulo para regulamentação da Lei Estadual 16.304 de 13 de setembro de 2016,
    que cria o Programa de Estímulo ao Escotismo nas escolas estaduais.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Projeto 'Multiplica' para abertura de novas UELs
  decisao: Henrique Messias faz informe sobre o projeto “Multiplica”, com a experiência-piloto de abertura de novas UELs em
    algumas unidades da ACM São Paulo.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Projeto da Equipe Regional de Descentralização da Gestão de Adultos
  decisao: Paulo Hoenen e equipe apresentam projeto da Equipe Regional de Descentralização da Gestão de Adultos.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Formação da Equipe Regional de Apoio Jurídico às UELs
  decisao: Ronaldo Engracia informa que foi encarregado de montar a Equipe Regional de Apoio Jurídico às UELs, composta preferencialmente
    por pessoas com formação e atuação na área jurídica, e solicita que Comissários Distritais encaminhem nomes de associados
    com formação na área jurídica que se disponham a colaborar.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Curso de Capacitação de Comissão de Ética e Disciplina
  decisao: Haverá primeiro Curso de Capacitação de Comissão de Ética e Disciplina no Centro Escoteiro Jaraguá em 11 e 12 de
    março de 2017, com inscrições via Meu SIGUE.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Criação da Equipe Regional de Ações Humanitárias
  decisao: Caires informa que está sendo criada pela Diretoria Regional de Relações Institucionais a Equipe Regional de Ações
    Humanitárias, com nomeação de novo Coordenador Regional de Ações Humanitárias para interagir com Distritos Escoteiros
    em mobilizações de ações humanitárias na sociedade.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Próxima Reunião do Conselho Consultivo Regional
  decisao: Deliberado que próxima Reunião do Conselho Consultivo Regional será realizada em 30 de julho de 2017 (domingo),
    durante o Congresso Regional Escoteiro 2017.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Redefinição dos limites geográficos de Distritos Escoteiros
  decisao: São redefinidos os limites geográficos dos Distritos Escoteiros 29º Ribeirão Preto, 31º Araçatuba e 36º Norte Paulista;
    bairro São Matheus permanece no 4º Distrito Escoteiro Aricanduva; estudos para criação de novo Distrito Escoteiro em Indaiatuba
    e reativação do 37º Distrito Escoteiro em Guarujá; estudos para divisão dos Distritos 19º Campinas e 20º Sorocaba.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Orientação oficial sobre o 'Ramo Castor'
  decisao: Comissários Distritais solicitam que haja uma orientação oficial conjunta das Diretoria Regional e Nacional sobre
    como lidar com o assunto “Ramo Castor”, pois não está previsto no programa educativo dos Escoteiros do Brasil e está sendo
    fomentado irregularmente em algumas UELs.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Projeto do Escritório Regional inteligente
  decisao: Caires esclarece que nível Nacional está finalizando o SIGUE 2.0 até setembro/2017 e que as ferramentas que não
    houverem nesta nova versão do SIGUE serão complementadas por sistema próprio a ser contratado pelo nível Regional, com
    prazo de implantação até o primeiro semestre/2018.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Data da Romaria Escoteira Nacional 2017
  decisao: Diretoria Regional esclarece que está prevista para 30 de abril de 2017.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Reajuste do valor do Orçamento Compartilhado
  decisao: Roberlei esclarece que deverá haver algum reajuste, com percentual ainda em estudo.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Notificação de abertura de novo Grupo Escoteiro
  decisao: 'Mario Benedito Pires notifica abertura de novo Grupo Escoteiro no 22º Distrito Escoteiro Sudoeste Paulista: Boipeva,
    em Itapeva/SP.'
  votacao: ''
  pagina: 6
  conferido: true
- tema: Notificações sobre atividades no Centro Escoteiro Ipanema
  decisao: Notificações sobre a realização de atividades escoteiras no Centro Escoteiro Ipanema devem ser feitas ao 22º Distrito
    Escoteiro Sudoeste Paulista e não ao 20º Distrito Escoteiro Sorocaba.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Edital de recrutamento para projeto arquitetônico do Centro Escoteiro Ipanema
  decisao: Será lançado em breve edital de recrutamento voluntário de engenheiro civil e arquiteto para elaboração do projeto
    arquitetônico do Centro Escoteiro Ipanema.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Projeto Escoteiros no Shopping
  decisao: Elmer Pessoa apresenta proposta do projeto Escoteiros no Shopping, convidando os Comissários Distritais para que
    o utilizem em seus Distritos Escoteiros.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Atualização e organização dos dados dos Comissários Distritais
  decisao: Thiago solicita que os Comissários Distritais atualizem relação online dos dados de contato dos membros da Comissão
    Distrital, confiram contratos de trabalho voluntário, enviem fotos para carógrafo, e enviem indicações de jovens líderes
    para Rede de Jovens Líderes; informa sobre criação de emails institucionais @escoteirossp para comunicações oficiais;
    solicita apresentação da prestação de contas do Orçamento Compartilhado 2016 o mais breve possível.
  votacao: ''
  pagina: 7
  conferido: true
