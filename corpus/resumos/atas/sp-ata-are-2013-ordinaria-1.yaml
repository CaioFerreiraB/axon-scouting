  local: Câmara Municipal de São Paulo, Viaduto Jacareí, nº 100, bairro Bela Vista, São Paulo - SP
deliberacoes:
- tema: Aprovação da Ata da Assembleia Regional anterior
  decisao: A ata foi aprovada por unanimidade, com as ressalvas apresentadas.
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Aprovação do Relatório de 2012
  decisao: O relatório foi aprovado por unanimidade, com agradecimentos do presidente da assembleia para todos os colaboradores
    que fizeram um belíssimo trabalho.
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: Aprovação das contas e balanço do exercício de 2012
  decisao: Foi aprovado por grande maioria, com apenas oito (8) abstenções.
  votacao: maioria
  pagina: 7
  conferido: true
- tema: Proposta de sediar a XXI Assembleia Regional 2014 na cidade de Louveira
  decisao: Como foi a única candidata, o presidente Bakos solicita a aprovação por aclamação, sendo atendido pelo plenário.
  votacao: aclamação
  pagina: 8
  conferido: true
- tema: Proposição sobre isenção parcial de taxas para associados carentes em eventos regionais ou distritais
  decisao: Ficou aprovada a segunda proposta, com cobrança de 25% das taxas para os associados carentes.
  votacao: 62 votos para isenção total, 160 votos para cobrança de 25%, 56 votos pela rejeição dos descontos, 17 abstenções
  pagina: 12
  conferido: true
- tema: Proposição sobre custeio na participação dos conselheiros paulistas das reuniões do CAN
  decisao: Aprovado o encaminhamento como recomendação à nova diretoria por grande maioria.
  votacao: maioria
  pagina: 13
  conferido: true
- tema: Proposição sobre revisão dos valores praticados para contribuição regional
  decisao: Encaminhamento aprovado pela plenária à próxima gestão da Direção Regional para análise, com apenas uma (1) abstenção.
  votacao: maioria
  pagina: 13
  conferido: true
- tema: Proposição sobre equipe médica obrigatória para eventos regionais
  decisao: Encaminhamento aprovado pela plenária à próxima gestão da Direção Regional para análise, com apenas uma (1) abstenção.
  votacao: maioria
  pagina: 13
  conferido: true
- tema: Proposição sobre repasse de verba para o Mutirão Regional
  decisao: Proposta de repasse foi aprovada com 214 votos, 27 votos contrários e 16 abstenções.
  votacao: 214 votos a favor, 27 contra, 16 abstenções
  pagina: 13
  conferido: true
