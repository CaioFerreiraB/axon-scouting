  local: Faculdades Integradas Campos Salles, Rua Nossa Senhora da Lapa - No 270 - Bairro da Lapa, São Paulo/SP
deliberacoes:
- tema: Credenciamento de delegados
  decisao: Às 16h55min foi informado que haviam 24 delegados credenciados.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Eleição da Comissão de Escrutínio
  decisao: Por se tratarem de quatro candidaturas para três vagas, foi realizada votação na plenária para eleger a Comissão
    de Escrutínio, sendo eleitos Pedro, Rafaela e Paulo.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Eleição da Mesa Diretora dos trabalhos
  decisao: Considerando que todos os cargos tiveram somente uma candidatura, sugeriu-se a aprovação por aclamação. Sem questionamentos,
    foi eleita e empossada a Mesa Diretora supracitada.
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: Eleição da candidata da Rede Interamericana de Jovens
  decisao: Aprovação em primeira instância, por unanimidade, da candidatura de Larissa Oliveira (GE Arno Friedrich 43º/RS).
    Sua candidatura foi levada ao Conselho de Administração Nacional (CAN) e, posteriormente, foi informado que a candidatura
    foi aprovada em segunda instância, levando a candidatura adiante.
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Eleição da Comissão de Assuntos Gerais
  decisao: Por não exceder a quantidade de vagas, foi sugerido pela Mesa Diretora aprovação por aclamação, elegendo por unanimidade
    a Comissão de Assuntos Gerais do Fórum.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Aprovação da Ata do Fórum Nacional de Jovens Líderes - Reunião Extraordinária de 25/09/2022
  decisao: Por sugestão da Mesa Diretora, seguiu-se aprovação da ata por aclamação, sendo a mesma aprovada por unanimidade
    da Plenária.
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Eleição da Cidade-sede do Encontro Nacional de Jovens Líderes 2024
  decisao: Mesa Diretora sugeriu que Florianópolis fosse aprovada por aclamação, sendo eleita por unanimidade como Cidade-sede
    do Encontro Nacional de Jovens Líderes de 2024.
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Aprovação do documento do Grupo de Trabalho de Relações Internacionais para encaminhamento ao CAN
  decisao: Deliberação na Plenária sobre documento elaborado pelo Grupo de Trabalho para encaminhamento e aprovação integral
    do mesmo ao CAN, que passou por aclamação.
  votacao: aclamação
  pagina: 10
  conferido: true
- tema: Criação de grupo de trabalho para tratar sobre reforma no Ensino Médio
  decisao: Sugestão entrou em votação na Plenária e foi aprovada, seguindo seu encaminhamento à Assembleia Nacional da UEB.
  votacao: ''
  pagina: 10
  conferido: false
- tema: Sugestão para realização de processo seletivo com cadastro de reserva para a Rede Nacional
  decisao: Sugestão foi posta para aprovação por aclamação e foi aprovada por unanimidade da Plenária.
  votacao: aclamação
  pagina: 10
  conferido: true
- tema: Recomendação para transmissão online dos fóruns e assembleias nacionais
  decisao: Aprovação por aclamação unânime da sugestão para possibilitar a realização da Assembleia Nacional da UEB em formato
    híbrido, com transmissão simultânea para participação online.
  votacao: aclamação
  pagina: 10
  conferido: true
- tema: Encaminhamento para estudo de sediar evento mundial no Brasil
  decisao: Item, por sugestão da Mesa Diretora, foi aprovado por aclamação e encaminhado ao CAN e à DEN, sugerindo um estudo
    para sediar um Moot Mundial.
  votacao: aclamação
  pagina: 10
  conferido: true
- tema: Aprovação da revisão da idade permitida para candidatura a cargos internacionais
  decisao: Encaminhamento votado e aprovado pela Plenária, sendo levado à Comissão de Revisão.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Criação de grupo de trabalho para revisão da faixa etária para ser Jovem Líder
  decisao: Encaminhamento aprovado por aclamação unânime da Plenária.
  votacao: aclamação
  pagina: 9
  conferido: true
