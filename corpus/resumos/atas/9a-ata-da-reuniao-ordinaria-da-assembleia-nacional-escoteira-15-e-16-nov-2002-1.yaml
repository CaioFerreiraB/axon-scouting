  pagina: 3
  conferido: true
- tema: relatório anual e balanço da Loja Escoteira Nacional de 2001
  decisao: 'Relatório e o Balanço foram aprovados, com uma abstenção, e as seguintes observações: corrigir a data de encerramento
    do Balanço — 31 de dezembro de 2001; considerar no plano de ação do próximo exercício seus elevados custos administrativos'
  votacao: ''
  pagina: 3
  conferido: true
