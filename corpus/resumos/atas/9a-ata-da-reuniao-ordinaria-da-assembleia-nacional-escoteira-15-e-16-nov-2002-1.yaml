  decisao: realizar a eleição dos doze candidatos inscritos; recomendar ao Conselho de Administração que os outros quatro
    candidatos passem a fazer parte do Conselho como convidados, com direito a voz; recomendação aprovada por unanimidade
    pela Assembléia Nacional
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: abertura solene
