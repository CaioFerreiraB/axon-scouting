doc_key: 4a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-14-nov-1997-1
reuniao:
  tipo: ordinaria
  data: '1997-11-14'
  local: Auditório Minas Gerais, do Hotel Kubitschek Plaza, em Brasília, DF
deliberacoes:
- tema: aprovação da ata da 3o Reunião Ordinária
  decisao: a Assembléia aprovou, por aclamação, a ata da 3o Reunião Ordinária da Assembléia Nacional, tal como se encontra
    publicada no Relatório Anual 1996 - 1997
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: aprovação do parecer da Comissão Fiscal Nacional e balanço de 1996
  decisao: foram aprovados por unanimidade tanto o parecer da Comissão Fiscal Nacional como o Balanço Patrimonial e a Demonstração
    de Resultados de 1996
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: eleição dos membros efetivos da Comissão Fiscal Nacional
  decisao: foram eleitos como membros efetivos da Comissão Fiscal Nacional, os interinos Tadeu Ottoni e Celso Perotto, que
    passaram à condição de aptos a votar na 4o Reunião da Assembléia Nacional da UEB
  votacao: 40 votos a favor, 15 contra, 12 abstenções
  pagina: 3
  conferido: true
- tema: eleição dos Diretores Nacionais e membros da Comissão Fiscal Nacional
  decisao: foram eleitos os 5 (cinco) mais votados para Diretores Nacionais e os 3 (três) primeiros para membros titulares
    e os 3 (três) seguintes para suplentes da Comissão Fiscal Nacional
  votacao: 74 votos
  pagina: 3
  conferido: true
- tema: composição da Diretoria Nacional para 1998
  decisao: a Diretoria Nacional estará composta, durante o ano de 1998, pelos Diretores Nacionais eleitos nas reuniões anteriores
    e na 4o Reunião Ordinária da Assembléia Nacional
  votacao: ''
  pagina: 4
  conferido: true
- tema: aprovação da recomendação sobre debate dos Fundamentos do Escotismo
  decisao: a Assembléia aprovou a recomendação, por aclamação, para que a Direção Nacional e as Direções Regionais organizem
    debate amplo para apresentar proposta de alteração dos Fundamentos do Escotismo Brasileiro na próxima reunião ordinária
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: escolha da Região-Sede para o 5o Congresso Escoteiro Nacional
  decisao: foi aprovada por aclamação a candidatura única da Região do Paraná para sediar o Congresso Escoteiro Nacional e
    a Reunião da Assembléia Nacional da UEB, em 1999
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: compromisso de correção do POR
  decisao: o Diretor Presidente eleito declarou que houve um erro na edição do POR e se comprometeu a promover a devida correção
  votacao: ''
  pagina: 6
  conferido: true
