doc_key: 5a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-31-out-1998-1
reuniao:
  tipo: ordinaria
  data: '1998-10-31'
  local: Auditório do Ponta Mar Hotel, localizado na Av. Beira Mar n.o 2200, Praia de Iracema, Fortaleza/CE
deliberacoes:
- tema: eleição e posse da mesa da reunião
  decisao: foram eleitos o Presidente, dois Vice-presidentes e duas Secretárias da 5.o Reunião Ordinária da Assembléia Nacional
    da UEB, respectivamente, o Sr. Paulo Salamuni, Sr. Lino Schieferdecker, Sr. Donald Malchitzky, Sra. Diva Irene da Paz
    Vieira e Sra. Amélia Meireles Pagano de Mello, que de imediato tomaram posse c assumiram a condução dos trabalhos.
  votacao: ''
  pagina: 2
  conferido: true
- tema: designação das Comissões Assessoras da Assembléia
  decisao: 'COMISSÃO DE CREDENCIAMENTO: Carmen Barreira, João Batista Fiorini Thomé e Paulo Luís Pencarinha de Moraes; COMISSÃO
    ELEITORAL: Carlos Delmar Lima Lyrio, Maurício Moutinho da Silva c Ronei Castilhos da Silva; COMISSÃO ESCRUTINADORA: Geraldo
    F. Monteiro, Júlio Augusto Mendes Ericeira e Paulo Ney F. da Silva; COMISSÃO DE APRECIAÇÃO DE RECURSO DISCIPLINAR: Carlos
    Nascimento, Satoshi Shimohirao e Darcy Rogério Muniz; COMISSÃO DE ASSUNTOS GERAIS: Carlos Frederico dos Santos, Paulo
    Sérgio Cabelo e Renato Dornelles Pereira.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: aprovação da ata da reunião anterior
  decisao: aprovada, sem restrições.
  votacao: ''
  pagina: 2
  conferido: true
- tema: aprovação do Relatório e Balanço Anual da Diretoria Nacional
  decisao: aprovados, por unanimidade, o Relatório, as Demonstrações Financeiras e o Parecer da Comissão Fiscal
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: aprovação do Relatório e Balanços da Loja Escoteira de 1995 a 1997
  decisao: aprovados, por unanimidade.
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: aprovação do parecer da Auditoria Externa
  decisao: As demonstrações financeiras e contábeis referentes ao ano de 1997, por ser da competência desta Assembléia, foram
    aprovadas por esta, sem restrições.
  votacao: ''
  pagina: 3
  conferido: true
- tema: proposta de Regulamento da Comissão Fiscal Nacional
  decisao: o assunto foi retirado de pauta e encaminhadas as sugestões daquele colegiado para a análise da Diretoria Nacional.
  votacao: ''
  pagina: 4
  conferido: true
- tema: eleição dos Diretores Nacionais para mandatos de 1.o/01/1999 a 31/12/2001
  decisao: 'foram eleitos os novos diretores: WLADERLEI ASTOLPHI GALERA, dezesseis votos; ALEXANDRE MACHADO SILVA, quinze
    votos; CARMEN BARREIRA, treze votos; MARTA TOLENTINO, treze votos; RENATO BINI, doze votos.'
  votacao: votos indicados para cada eleito
  pagina: 4
  conferido: true
- tema: apreciação das recomendações dos Seminários
  decisao: recomendações diversas para gestão de recursos adultos, formação, crescimento, fundamentos, serviço escoteiro profissional,
    missão do escotismo, reforma estatutária e modalidades específicas do programa escoteiro.
  votacao: ''
  pagina: 5
  conferido: true
- tema: apreciação do relatório e recomendações do 3.o Fórum Nacional de Jovens Líderes
  decisao: sugestões para designação de membro da Comissão Nacional de Programa para aconselhar o Fórum e realização do Fórum
    antes do Congresso Nacional.
  votacao: ''
  pagina: 5
  conferido: true
- tema: deliberação sobre a proposta de reforma dos Fundamentos
  decisao: aprovadas, com sessenta e sete votos favoráveis e vinte votos contrários, as sugestões para o texto dos Fundamentos
    do Escotismo, incluindo definição, propósito, princípios e método escoteiro, mantendo a Lei e a Promessa para debate futuro.
  votacao: 67 votos favoráveis e 20 contrários
  pagina: 6
  conferido: true
- tema: deliberação sobre a proposta de reforma estatutária
  decisao: decidiu seja constituída uma Comissão responsável por promover debate sobre o assunto junto às Regiões Escoteiras,
    analisar as sugestões apresentadas e apresentar proposta a ser apreciada pela Assembléia de 1999, com recomendações para
    orientar o trabalho.
  votacao: ''
  pagina: 6
  conferido: true
- tema: escolha da Região-sede e Região-sede alternativa para eventos futuros
  decisao: com trinta e três votos, foi eleita a Região do Espírito Santo para sediar os eventos; como Região alternativa,
    foi eleita, com trinta votos, a Região do Rio de Janeiro.
  votacao: 33 votos para Espírito Santo, 30 votos para Rio de Janeiro
  pagina: 7
  conferido: true
- tema: concessão de condecorações
  decisao: aprovada por unanimidade, a concessão do TAPIR DE PRATA ao Escotista ÁLVARO TAVARES GOMES DE SOUZA (SP).
  votacao: unanimidade
  pagina: 7
  conferido: true
- tema: procedimento disciplinar
  decisao: o assunto foi retirado de pauta por requerimento do proponente, o Diretor Nacional Helmgton José Brito de Souza,
    que renunciou ao seu mandato.
  votacao: ''
  pagina: 7
  conferido: true
- tema: orientações quanto aos prazos para prestação de contas
  decisao: 'fixados prazos para prestação de contas: Comissão Fiscal Nacional até 31 de março; Diretorias Regionais até 31
    de março; Diretorias de Unidades Locais até 15 de março.'
  votacao: ''
  pagina: 7
  conferido: true
