doc_key: sp-ata-are-2003-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '2003-09-27'
  local: Rua Bernardino de Campos, 254, no Centro, em Santo André-SP
deliberacoes:
- tema: Composição da mesa diretora e comissões
  decisao: Os mesmos foram eleitos por aclamação. Marco Aurelio de Mello Castrianni assumiu a presidência da Assembléia Regional
    e convidou as seguintes pessoas para a composição da mesa diretora dos trabalhos... As comissões e o nome da secretária
    da reunião foram aprovados por aclamação.
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: Aprovação da ata da Assembléia Regional anterior
  decisao: Nada havendo a considerar, a ata foi aprovada por aclamação.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Aprovação das contas do exercício de 2002
  decisao: O Presidente da Assembléia colocou em discussão as contas do exercício 2002. Não havendo manifestação, procedeu-se
    à votação e foram aprovadas por aclamação.
  votacao: aclamação
  pagina: 3
  conferido: true
- tema: Aprovação do orçamento para 2004
  decisao: O Presidente da Assembléia colocou em discussão o Orçamento para 2004, Não havendo manifestação, procedeu-se à
    votação, tendo sido aprovado por aclamação.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Eleição da Diretoria Regional
  decisao: O Chefe Ribeiro colocou em votação a chapa única apresentada para a diretoria, que foi eleita por aclamação.
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Inclusão de mais dois delegados no credenciamento
  decisao: A inclusão de mais dois delegados foi aprovada pelo plenário.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Manutenção da regra de inscrição de delegados até 3 horas antes da votação
  decisao: 'O Presidente da Assembléia colocou o caso em votação e a Comissão de Escrutínio contabilizou os seguintes votos:
    manter a decisão da mesa de cumprir a regra, que as inscrições sejam feitas até 3 (três) horas antes do início da sessão
    de votação: 272 votos; contra a decisão da mesa: 17 votos; e abstenção: 9 votos.'
  votacao: 272 votos a favor, 17 contra, 9 abstenções
  pagina: 6
  conferido: true
- tema: Encaminhamento de assuntos gerais para órgãos competentes
  decisao: Foram encaminhados aos órgãos competentes para apreciação diversos assuntos listados, como regulamentação da Estrela
    de Atividade, padronização do modelo da saia padrão, royalties para comercialização de distintivos, entre outros.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Escolha da cidade sede da próxima Assembléia Regional (2004)
  decisao: 'Após votação, a Comissão de Escrutínio apurou os seguinte votos: Águas de São Pedro com 139 votos; Vale do Paraíba
    com 39 votos, Espírito Santo do Pinhal e Guarulhos com 12 votos.'
  votacao: 139 votos a favor de Águas de São Pedro
  pagina: 8
  conferido: true
