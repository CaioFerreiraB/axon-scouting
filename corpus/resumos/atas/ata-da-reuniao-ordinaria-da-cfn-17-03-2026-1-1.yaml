doc_key: ata-da-reuniao-ordinaria-da-cfn-17-03-2026-1-1
reuniao:
  tipo: ordinaria
  data: '2026-03-17'
  local: Escritório Nacional da União dos Escoteiros do Brasil sito na Rua Coronel Dulcídio, 2107 - Bairro Água Verde, Curitiba
    - PR
deliberacoes:
- tema: Aprovação das contas e balanço anual do nível nacional da UEB
  decisao: a Comissão Fiscal Nacional opina favoravelmente ao encaminhamento e aprovação pela Assembleia Nacional da União
    dos Escoteiros do Brasil contas e o balanço anual do nível nacional da UEB, salientando-se o voto divergente de aprovação
    com as três ressalvas mencionadas pelo membro titular Eduardo Manique
  votacao: maioria
  pagina: 14
  conferido: true
- tema: Indicação para presidente da Comissão Fiscal Nacional
  decisao: foi aprovada a indicação para presidente Luiz Salgado Klaes por unanimidade
  votacao: unanimidade
  pagina: 14
  conferido: true
- tema: Encaminhamento para elaboração do relatório da Comissão Fiscal Nacional
  decisao: Eduardo Manique se disponibilizou para a elaboração do relatório, juntamente com a equipe do EN
  votacao: ''
  pagina: 14
  conferido: true
- tema: Disponibilização de planilha detalhada para acompanhamento dos balancetes por região
  decisao: deliberou-se pela disponibilização, em ambiente compartilhado (drive), de planilha detalhada contendo as datas
    de recebimento e de envio dos balancetes por região, permitindo acompanhamento contínuo e maior transparência do processo
  votacao: ''
  pagina: 9
  conferido: true
- tema: Elaboração de relatório detalhado dos atrasos para apresentação na Assembleia Nacional
  decisao: foi aprovado pelos demais membros o encaminhamento da elaboração de um relatório detalhado dos atrasos para apresentação
    na Assembleia Nacional, com o objetivo de evidenciar o problema como gargalo institucional e sensibilizar as regiões quanto
    à necessidade de cumprimento dos prazos estabelecidos
  votacao: aprovado
  pagina: 7
  conferido: true
- tema: Realização de reunião entre a Comissão Fiscal Nacional e a Diretoria Executiva Nacional
  decisao: Eduardo Manique propõe a realização de reunião entre a Comissão Fiscal Nacional e a Diretoria Executiva Nacional,
    com o objetivo de aprofundar o diálogo e alinhar entendimentos, sugestão aprovada pelos demais membros
  votacao: aprovada
  pagina: 11
  conferido: true
- tema: Estabelecimento de fluxo e prazos para envio, análise e resposta de documentos financeiros
  decisao: foi sugerido o estabelecimento de prazo padrão para envio das informações até o dia 10 do mês subsequente ao do
    fechamento, com exceções para o início do exercício e período de planejamento orçamentário (setembro e outubro), bem como
    prazo aproximado de 15 dias para análise pela Comissão Fiscal Nacional
  votacao: ''
  pagina: 11
  conferido: true
- tema: Criação de rede de articulação entre as Comissões Fiscais Regionais
  decisao: foi sugerida a criação de rede de articulação entre as Comissões Fiscais Regionais, com realização de reuniões
    periódicas para alinhamento e fortalecimento das práticas de governança
  votacao: ''
  pagina: 11
  conferido: true
- tema: Solicitação de espaço em reuniões do Conselho de Administração Nacional para apresentação do relatório
  decisao: Luiz Klaes propõe solicitação de espaço em reuniões de instâncias estratégicas da instituição, como o Conselho
    de Administração Nacional, com o objetivo de apresentar os principais pontos do relatório e fortalecer o alinhamento institucional
  votacao: ''
  pagina: 14
  conferido: true
