deliberacoes:
- tema: Eleição da Mesa Diretora dos trabalhos
  decisao: Rafael Melis Rogéro foi eleito Presidente por aclamação; Isabela Cristina Cordeiro eleita Vice-Presidente por aclamação;
    Beatriz Chrispim eleita Secretária por aclamação.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Eleição da Comissão de Escrutínio
  decisao: Foram eleitos por aclamação Lucas Macedo Dos Santos, Thiago Carvalho de Souza e Silas Sousa da Silva para a Comissão
    de Escrutínio.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Aprovação da Ata do XXI Fórum Regional de Jovens Líderes
  decisao: A Ata do XXI Fórum Regional de Jovens Líderes foi aprovada por aclamação.
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Prestação de Contas e Relatório da Gestão 2023
  decisao: Foi apresentado o relatório da gestão 2023 e prestação de contas, destacando gastos previstos e ultrapassados no
    Encontrinho, dentro do esperado, e possibilidade de custeio para delegados ao Fórum Nacional.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição das cidades-sede do Encontro Regional de Jovens Líderes 2024 e 2025
  decisao: Marília foi eleita cidade-sede para 2024 com 15 votos, São Bernardo do Campo suplente com 12 votos; para 2025,
    São Bernardo do Campo foi eleita cidade-sede com 23 votos, Americana suplente com 11 votos.
  votacao: votação com votos nominais
  pagina: 3
  conferido: true
- tema: Eleição de delegados e suplentes ao Fórum Nacional de Jovens Líderes
  decisao: Foram eleitos delegados Rafael Melis Rogero, Isadora Gualda Macedo e Thiago Carvalho; demais candidatos eleitos
    suplentes; sugestão de considerar todos jovens líderes presentes no Fórum Nacional como suplentes aprovada por aclamação.
  votacao: votação nominal e aclamação
  pagina: 4
  conferido: true
- tema: Eleição do Coordenador do Núcleo Regional de Jovens Líderes (2024-2026)
  decisao: Patrick Alves da Silva Quinério foi eleito Coordenador do Núcleo Regional de Jovens Líderes com 25 votos.
  votacao: 25 votos a favor
  pagina: 5
  conferido: true
- tema: Proposta de Assembleias Institucionais em Formato Híbrido
  decisao: Proposta de encaminhamento à Assembleia Regional Escoteira para estudo de implementação de assembleias híbridas
    foi aprovada por aclamação.
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Proposta de instituição de 1/3 da delegação paulista como jovem líder
  decisao: Proposta de encaminhamento à Assembleia Regional Escoteira para instituição de marco juvenil com 1/3 da delegação
    paulista como jovem líder aprovada por aclamação.
  votacao: aclamação
  pagina: 6
  conferido: true
- tema: Moção de Apoio à Carta Aberta sobre a Política Nacional de Relações Internacionais (PNRI)
  decisao: Moção de apoio aprovada com 41 votos a favor, 0 contra e 3 abstenções.
  votacao: 41 votos a favor, 0 contra, 3 abstenções
  pagina: 7
  conferido: true
- tema: Proposta ao Fórum Nacional de Jovens Líderes sobre voto dos representantes do CAN
  decisao: Proposta de encaminhamento para discussão sobre direito de voto dos representantes da Rede no CAN aprovada por
    aclamação.
  votacao: aclamação
  pagina: 7
  conferido: true
- tema: Inclusão das Iniciativas Juvenis no Regulamento Regional
  decisao: Proposta de encaminhamento para alteração do Regulamento Regional incluindo iniciativas juvenis aprovada por aclamação.
  votacao: aclamação
  pagina: 7
  conferido: true
- tema: Proposta de maior apoio às Equipes Distritais Pioneiras (EDP)
  decisao: Proposta de encaminhamento ao Núcleo Regional de Jovens Líderes e mobilizadores distritais para apoio às EDPs aprovada
    por aclamação.
  votacao: aclamação
  pagina: 7
  conferido: true
