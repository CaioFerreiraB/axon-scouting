doc_key: 2a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-02-e-05-nov-1995-1
reuniao:
  tipo: ordinaria
  data: '1995-11-02'
  local: auditórios do Colégio Bom Jesus e do Banco do Brasil, Joinville, SC
deliberacoes:
- tema: Relatório Anual 1994/1995
  decisao: o Relatório Anual 1994/1995 da Diretoria Nacional e da Comissão Fiscal Nacional foi submetido à votação e aprovado
    por unanimidade
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Base para cálculo do número de Delegados regionais
  decisao: o plenário se manifesta pela adoção da quantidade de sócios que pagaram sua Contribuição Anual como base para esse
    cálculo
  votacao: ''
  pagina: 2
  conferido: true
- tema: Mandato dos Conselheiros Nacionais
  decisao: o plenário se manifesta pela extinção desses mandatos após o encerramento da presente reunião ordinária da Assembléia
    Nacional, destacando que o mesmo procedimento deverá ser observado em 1996
  votacao: ''
  pagina: 2
  conferido: true
- tema: Criação da Ordem da Flor de Lis
  decisao: Diretor Presidente da Diretoria Nacional anuncia a decisão tomada pela Diretoria Nacional de criar a Ordem da Flor
    de Lis, explicando ao plenário sua regulamentação e anunciando o lançamento da Ordem
  votacao: ''
  pagina: 2
  conferido: true
- tema: Escolha do local para o III Congresso Escoteiro Nacional
  decisao: o plenário decide, por 43 votos, realizar em Brasília, em 1997, o III Congresso Escoteiro Nacional
  votacao: 43 votos a favor
  pagina: 2
  conferido: true
- tema: Alteração do Estatuto da UEB sobre número máximo de Diretores Nacionais por Região
  decisao: o plenário aprova, preliminarmente, remeter a matéria à apreciação da Assembléia Nacional, em reunião extraordinária
    a ser realizada por ocasião do II Congresso Escoteiro Nacional, a ser realizado em Canelas, RS, em 1996
  votacao: ''
  pagina: 3
  conferido: true
- tema: Data da III Reunião Ordinária da Assembléia Nacional e II Congresso Escoteiro Nacional
  decisao: por 66 votos contra 17, o plenário decide manter a data anteriormente definida (01 a 04 de novembro de 1996)
  votacao: 66 votos contra 17
  pagina: 3
  conferido: true
- tema: Prorrogação do prazo para apresentação dos projetos do Concurso Identidade Visual da UEB
  decisao: a Assembléia, por unanimidade, decide prorrogar o prazo para apresentação dos projetos, delegando à Diretoria Nacional
    competência para julgar os trabalhos e divulgar o resultado
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Votos de louvor e agradecimentos
  decisao: registrar em ata votos de louvor às Comissões Assessoras, à Região Escoteira de Santa Catarina, às Regiões Escoteiras
    do Paraná e de São Paulo, e agradecimentos pelo êxito do evento e iniciativas apresentadas
  votacao: ''
  pagina: 4
  conferido: true
