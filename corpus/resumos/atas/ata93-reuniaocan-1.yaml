doc_key: ata93-reuniaocan-1
reuniao:
  tipo: ordinaria
  data: '2018-11-10'
  local: Escritório Nacional dos Escoteiros do Brasil, na cidade de Curitiba/PR
deliberacoes:
- tema: Inclusão de informações pessoais da DEN eleita na ata
  decisao: solicitação pelo MACEDO e MARANGONI de que seja incluída na última ata as informações pessoais da Diretoria Executiva
    Nacional (DEN) eleita, para que sendo feito o registro desta os órgãos e empresas competentes sejam notificados e não
    ocorra qualquer perda operacional quando da mudança das composições de Diretorias. Tal solicitação foi aprovada por unanimidade
    pelo Conselho.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Encaminhamento sobre Edital 001/2018 de Publicização da ACADEBIO
  decisao: O CAN encaminha que seja composta uma Comissão para esse fim exclusivo e em caráter de urgência, para começa a
    trabalhar na avaliação da oportunidade. O CAN autoriza ainda, caso seja confirmada a necessidade, condicionando à apreciação
    e deliberação positiva da avaliação, a convocação da Assembleia Extraordinária.
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Aprovação parcial da Política Nacional de Gestão de Adultos
  decisao: foi encaminhado para votação a aprovação parcial do documento, ficando subordinado às revisões do GT, e do Conselho
    de forma ampla, dentro de 30 (trinta) dias, para que possa ser votada de forma eletrônica a adoção e divulgação do mesmo.
    Submetido à votação, o encaminhamento foi aprovado por unanimidade.
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Encaminhamento sobre orçamento de 2018
  decisao: A aprovação feita por unanimidade pelo Conselho é de aprovação da alteração no orçamento de 2018, com o destaque
    que de fato seja encaminhado o saldo consolidado para o Fundo de Obra, que deverá ser utilizado futuramente para a construção
    da expansão da sede nacional.
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Análise da viabilidade do Registro Provisório para 2019
  decisao: Fica encaminhado de que a DEN/EN façam uma análise da viabilidade de implantação do Registro Provisório, para ser
    apresentado para apreciação do Conselho ainda no primeiro semestre de 2019.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Aceitação da proposta da DEN para resolução de registro escoteiro com adequações
  decisao: Após debates de adequação no texto da Resolução, fica encaminhado pelo CAN a aceitação da proposta da DEN com as
    adequações ajustadas.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Encaminhamento para adequação da resolução de condecorações e recompensas
  decisao: Fica encaminhado que a ISABELLY irá trabalhar em cima do texto e será enviado por e-mail para apreciação dos conselheiros.
  votacao: ''
  pagina: 6
  conferido: true
- tema: Reembolso de despesas para conselheiros suplentes no exercício da titularidade
  decisao: quando um conselheiro titular não puder comparecer à reunião e, o suplente assumir e exercer direito de voto, caberá
    o reembolso das despesas de deslocamento como praticado para os titulares, na eventualidade daquelas situações em que
    o suplente se dispôs a comparecer sem convocação prévia para atender vacância em determinada reunião.
  votacao: ''
  pagina: 7
  conferido: true
- tema: Encaminhamento para apreciação eletrônica do regulamento da Ordem da Flor de Lis
  decisao: A proposta de regulamento será encaminhada de forma eletrônica para apreciação e aprovação do Conselho.
  votacao: ''
  pagina: 7
  conferido: true
- tema: Alteração do nome da rubrica 'Fundo de Contingência' no orçamento 2019
  decisao: MACEDO sugere que seja dado um novo nome para essa rubrica, alterando o termo “Fundo de Contingência”, que não
    deixaria claro para qual finalidade ele estará previsto; o que foi aprovado pelo Conselho.
  votacao: ''
  pagina: 8
  conferido: true
- tema: Encaminhamento para aprovação do orçamento 2019 após 30 dias
  decisao: Ficou como encaminhamento do Conselho que dentro de 30 dias o Conselho irá se reunir para deliberar o orçamento
    apresentado pela atual DEN.
  votacao: 7 conselheiros a favor da pausa para análise
  pagina: 8
  conferido: true
- tema: Manutenção da Resolução de Conflito de Interesses vigente
  decisao: Fica, portanto, aprovado o encaminhamento de manutenção da Resolução como consta publicada para todos os associados.
  votacao: 6 contra, 6 a favor, presidente votou contra
  pagina: 8
  conferido: true
- tema: Reativação do GT Eventos do CAN
  decisao: o GT Eventos do CAN será reativado, devendo sua composição e escopo de trabalho ser discutido e definido de forma
    eletrônica pelos conselheiros.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Criação de Resolução para redefinição da Região Escoteira do Piauí
  decisao: Fica encaminhado de que deverá ser criada Resolução pelo órgão nacional competente, que registre a redefinição
    da Região Escoteira do Piauí.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Encaminhamento para apresentação eletrônica dos informes das áreas e grupos
  decisao: o presidente KONTZ sugere que a apresentação dos Jovens Líderes, Áreas Geográficas, comissões e demais grupos de
    trabalho apenas com relatos de ações, sejam encaminhados de forma eletrônica aos conselheiros.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Encaminhamento para análise eletrônica sobre isenção de adultos
  decisao: A proposta oferecida por WENDEL inclui uma análise da isenção de adultos. ISABELLY faz um adendo, sugerindo que
    seja feito um acompanhamento nas Regiões onde o índice de isentos adultos é acima da média. O encaminhamento será feito
    de forma eletrônica.
  votacao: ''
  pagina: 9
  conferido: true
- tema: Aprovação da divulgação do Internacional Peace Camp na Arábia Saudita
  decisao: Após debate sobre os prós e contras de divulgar a oportunidade para os associados da UEB, o assunto é submetido
    à votação, restando 8 votos favoráveis e 4 contrários. Fica então aprovada a divulgação, com o destaque de que no edital
    devem estar expressos todos os riscos efetivos e as leis de circulação naquele país.
  votacao: 8 a favor, 4 contra
  pagina: 10
  conferido: true
- tema: Adiamento da Aventura Nacional Sênior para após JamCam
  decisao: Submetido à votação, o adiamento do evento para a partir de 2020, foi obtido o resultado de 10 votos a favor e
    2 contrários. Fica então ratificado o adiamento excepcional da Aventura Nacional Sênior para após a data do JamCam.
  votacao: 10 a favor, 2 contra
  pagina: 10
  conferido: true
