- tema: Deliberação sobre interlocutor do CAN junto à DEN
  decisao: por unanimidade de votos, o Conselho deliberou que o conselheiro MARANGONI será o interlocutor do CAN junto a DEN,
    devendo ele passar a acompanhar de forma próxima a gestão da DEN e sua administração dos Executivos Escoteiros do Escritório
    Nacional, inclusive participando de reuniões da Diretoria, devendo o conselheiro então se reportar ao CAN sobre o que
    for relevante e necessário de apreciação e/ou deliberação.
  votacao: unanimidade
  pagina: 13
  conferido: true
