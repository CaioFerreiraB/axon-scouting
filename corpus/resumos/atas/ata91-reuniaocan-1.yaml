  decisao: seja aprovada o recurso solicitado, mas sua utilização fica condicionada a apresentação de um plano de negócios
    e aprovação por esse conselho.
  votacao: 'votaram a favor da letra “a” da ressalva 7 os conselheiros: ADRIANO, RENATO, KONTZ, MUSSIO, BINI, ROMEU, ISABELLY
