deliberacoes:
- tema: Execução Orçamentária 2017 e acompanhamento 2018
  decisao: 'parecer: “na execução do próximo exercício qualquer situação que haja necessidade de gasto superior ao que foi
    orçado e aprovado, seja solicitada a autorização do CAN para a sua execução em tempo hábil para a sua realização, ou se
    acontecer de maneira emergencial, que seja informada imediatamente para que sejam considerados na revisão orçamentária”.
    KONTZ esclarece alguns aspectos desse parecer, encaminhando-o em seguida para votação do Conselho, que com 12 votos a
    favor, 1 contra e nenhuma abstenção, realiza a sua aprovação.'
  votacao: 12 votos a favor, 1 contra e nenhuma abstenção
  pagina: 3
  conferido: true
- tema: Contratação de consultoria para Comissão Estatuinte
  decisao: aprovação da contratação do Escritório Szazi Bechara Storto Advogados para a realização dos trabalhos.
  votacao: 'votaram a favor os conselheiros: NUNES, MALAFAIA, INACIO, MUSSIO, DELMAR, CHRISTIAN, ROMEU, ISABELLY, KONTZ, BINI,
    RENATO e MARANGONI; votou a favor da contratação do Escritório Martins de Souza Advogados o conselheiro ADRIANO; não houve
    abstenções.'
  pagina: 4
  conferido: true
- tema: Solicitação de intervenção na Região Escoteira de São Paulo
  decisao: não aprovação da solicitação de intervenção na Região Escoteira de São Paulo, solicitada pelo associado Vicente
    Vasconcelos em ofício remetido ao CAN em abril de 2016.
  votacao: 'votaram na não aprovação os conselheiros: RENATO, ADRIANO, MALAFAIA, NUNES, MUSSIO, BINI, KONTZ, ROMEU, DELMAR,
    ISABELLY, CHRISTIAN e MARANGONI; INACIO votou em abstenção; não houve votos a favor.'
  pagina: 4
  conferido: true
- tema: Minuta da ata da reunião 90a do Conselho de Administração Nacional
  decisao: aprovação da minuta da ata da reunião 90a do Conselho de Administração Nacional realizada dias 11 e 12 de novembro
    2017, na cidade de Curitiba PR.
  votacao: 'votaram a favor os conselheiros: NUNES, INACIO, BINI, ADRIANO, CHRISTIAN, DELMAR, KONTZ, MUSSIO, ISABELLY, MARANGONI,
    WENDELL e LEONARDO; ROMEU manifestou-se impedido de votar; MALAFAIA votou em abstenção; não houve votos contra.'
  pagina: 4
  conferido: true
- tema: Parecer do GT de Acompanhamento Orçamentário referente ao Orçamento para 2018
  decisao: aprovação do parecer do GT de Acompanhamento Orçamentário referente ao Orçamento para 2018 proposto pela Diretoria
    Executiva Nacional (DEN).
  votacao: 'votaram a favor os conselheiros: RENATO, MALAFAIA, INACIO, CHRISTIAN, ROMEU, ADRIANO, DELMAR, BINI, MUSSIO, KONTZ,
    NUNES, ISABELLY e MARANGONI; não houve votos contra e não houve abstenções.'
  pagina: 4
  conferido: true
- tema: Aprovação da previsão de vendas para 2018
  decisao: APROVE A PREVISÃO DE VENDAS que utilizemos deva ser a apresentada na ocasião da reunião do CAN em novembro de 2017,
    mantendo a previsão conservadora inicial.
  votacao: 'votaram a favor da letra “a” da ressalva 1 os conselheiros: ADRIANO, KONTZ, MUSSIO, BINI, ROMEU, ISABELLY e MARANGONI;
    a favor da letra “b” da ressalva 1 os conselheiros: INACIO, RENATO, DELMAR, NUNES, MALAFAIA e CHRISTIAN; não houve abstenções.'
  pagina: 4
  conferido: true
- tema: Aprovação da previsão de crescimento da Loja Escoteira Nacional
  decisao: manter a sugestão da DEN - 12% de crescimento.
  votacao: 'votaram a favor da letra “b” da ressalva 1 os conselheiros: INACIO, RENATO, DELMAR, NUNES, MALAFAIA e CHRISTIAN;
    não houve abstenções.'
  pagina: 5
  conferido: true
- tema: Aprovação da previsão de vendas das regiões para 2018
  decisao: aprove uma previsão de vendas das regiões baseada no crescimento de 3% sobre o faturamento total de 2017, condicionada
    a aceitação do Comitê de Governança e Transparência da Loja Escoteira.
  votacao: 'votaram a favor da letra “a” da ressalva 2 os conselheiros: DELMAR, ADRIANO, KONTZ, MUSSIO, BINI, ROMEU, ISABELLY
    e MARANGONI; a favor da letra “b” da ressalva 2 os conselheiros: RENATO, INACIO, NUNES, MALAFAIA e CHRISTIAN; não houve
    abstenções.'
  pagina: 5
  conferido: true
- tema: Investimento na filial da Loja Escoteira Nacional na Região de Minas Gerais
  decisao: não seja aprovado esse investimento, sugerindo que se identifique um outro modelo para atender as necessidades
    da Região Escoteira de Minas Gerais e solicitação de elaboração de planos de negócios para todas as regiões escoteiras.
  votacao: 'votaram a favor da letra “a” da ressalva 4 os conselheiros: KONTZ, ADRIANO, MUSSIO, BINI, ROMEU, ISABELLY e MARANGONI;
    a favor da letra “b” da ressalva 4 os conselheiros: INACIO, DELMAR, RENATO, NUNES, MALAFAIA e CHRISTIAN; não houve abstenções.'
  pagina: 6
  conferido: true
