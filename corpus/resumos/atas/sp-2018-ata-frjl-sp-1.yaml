reuniao:
  tipo: ordinaria
  data: '2018-03-17'
  local: Piracicaba
deliberacoes:
- tema: Posse da mesa diretora dos trabalhos
  decisao: '1. Eleição do Presidente da mesa: candidato Matheus França (G.E. Santo Amaro 56), eleito por aclamação. 2. Eleição
    do Vice-presidente: candidatos Julia Ribeiro (G.E. Curumim 50) e Carolina Salgado (G.E. Cristo Rei 100), sendo eleita
    Julia Ribeiro. 3. Eleição do primeiro e segundo secretário: candidatos João Leonardo Casemiro (G.E. Falcão Peregrino 20)
    e Carolina Salgado (G.E. Cristo Rei 100), ambos eleitos por aclamação. 4. Comissão de Escrutínio: candidatos Mariana de
    Marchi (G.E. Curuqui 142), Jessica (G.E. Santo Amaro 56) e Carlinhos Nunes (G.E. Santo Amaro 56), eleitos por aclamação.'
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Leitura e aprovação da Ata do XV Fórum Regional de Jovens Líderes
  decisao: Colocou-se em votação a leitura da ata, sendo onze (11) votos para a leitura, vinte (20) votos para a não-leitura
    e vinte e dois (22) abstenções; sendo realizada a contagem de votos válidos que resultou em sessenta e quatro (64) votos,
    tendo como resultado a não leitura da ata e aprovação da mesma.
  votacao: 64 votos, não leitura e aprovação
  pagina: 2
  conferido: true
- tema: Prestação de contas do Núcleo Regional de Jovens Líderes
  decisao: O Núcleo teve uma despesa que acabou zerando esse valor, sendo gasta na participação de facilitadores no Congresso
    Regional Escoteiro com custo de quarenta reais e quarenta e um centavos (R$ 40,41), participação do núcleo no Encontro
    Nacional de Jovens Líderes no Rio Grande do Sul com custo de mil novecentos e vinte e quatro reais e trinta e um centavos
    (R$ 1.924,31), participação no Seminário Nacional de Métodos Educativos com custo de duzentos reais (R$ 200,00) e o subsídio
    ao ônibus da Pasta Jovem para o XVI Fórum Regional 2018 que custou dois mil quatrocentos e dezessete reais e noventa centavos
    (R$ 2.417,90), sendo dois mil e cinquenta (R$ 2.050,00) do ônibus, cento e vinte (R$ 110,00) da alimentação do motorista
    e duzentos e quarenta e sete e noventa (R$ 247,90) para o resto da alimentação, destacando que tudo foi com uma inscrição
    de trinta e cinco reais e cinquenta centavos (R$ 35,50) que resultou em mil trezentos e treze reais e cinquenta centavos
    (R$ 1.313,50) e de subsídio da Pasta Jovem foi mil e trezentos reais (R$ 1.300,00) que resultou em um saldo final de cento
    e noventa e cinco reais e cinquenta centavos (R$ 195,50) positivos.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Votação da Proposta “Parâmetros Regionais 2.0”
  decisao: Na votação foram contabilizados quarenta e três votos (43) a favor, zero (0) votos contra e treze (13) abstenções;
    total de sessenta e um (61) votantes nessa rodada. Após esse resumo foi realizada a votação do texto integral, tendo quarenta
    e seis (46) votos a favor da aprovação, sendo assim aprovado em seu texto integral e entrando em vigor a partir do XVI
    Fórum Regional de Jovens Líderes 2018.
  votacao: 46 votos a favor, aprovado
  pagina: 5
  conferido: true
- tema: Eleição da cidade sede para Encontro Regional de Jovens Líderes 2018
  decisao: 'A votação procede e os votos se sumarizam em: Sorocaba com vinte e nove (29) votos, São José do Rio Preto com
    dez (10) votos, e São João da Boa Vista com vinte e sete (27) votos. As abstenções somam oito (8) votos, o que elege Sorocaba
    como a cidade sede para o Encontro Regional de Jovens Líderes de 2018.'
  votacao: 29 votos a Sorocaba, 10 a São José do Rio Preto, 27 a São João da Boa Vista, 8 abstenções
  pagina: 7
  conferido: true
- tema: Eleição dos Delegados Regionais ao Fórum Nacional de Jovens Líderes
  decisao: Candidatos e suplentes foram eleitos por consenso e aclamação.
  votacao: aclamação
  pagina: 7
  conferido: true
- tema: Eleição dos candidatos a novos membros do Núcleo Regional de Jovens Líderes
  decisao: Pedro (G.E. Rainha das Águas 403) recebe trinta e um votos (31) e se torna o novo comunicador do Núcleo. Laura
    (G.E. Avanhandava 04) recebe catorze (14) votos, enquanto dezenove (19) pessoas se abstiveram. Júlia Falcone (G.E. São
    Paulo) é eleita como nova Coordenadora da Rede de Jovens Líderes São Paulo com vinte e um votos (21), Paulo (G.E. Guaypacaré)
    recebe onze (11) votos e trinta e dois (32) votantes se abstêm.
  votacao: 31 votos para Pedro, 14 para Laura, 19 abstenções; 21 votos para Júlia Falcone, 11 para Paulo, 32 abstenções
  pagina: 10
  conferido: true
