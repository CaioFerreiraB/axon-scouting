- tema: Resolução - 43ª Conferência Escoteira Mundial
  decisao: Proposta de Resolução a ser apresentada na 43ª Conferência Escoteira Mundial, intitulada "Rumo a uma Conferência
    Mundial Escoteira Verdadeiramente Inclusiva". Aprovada por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
