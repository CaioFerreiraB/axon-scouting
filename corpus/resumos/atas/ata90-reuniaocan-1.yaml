- tema: Ajuste de repasse da Política Comercial para 35% em 2017
  decisao: O encaminhamento do Conselho é de autorizar o ajuste imediato de repasse para 35% no ano de 2017, com a necessidade
    de o Comitê continuar discutindo e calculando valores mais adequados para atender as partes interessadas. Submetido a
    votação, foi aprovado por unanimidade.
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Rejeição da resolução sobre correção automática do Registro Anual pelo IGPM
  decisao: A proposta de resolução foi votada, resultando em 12 votos pela rejeição e 1 de aprovação, restando rejeitada então
    pelo Conselho.
  votacao: 12 votos a favor da rejeição, 1 contra
  pagina: 7
  conferido: true
- tema: Reajuste da taxa de registro anual para 2018
  decisao: A proposta apresentada para o reajuste da taxa de registro anual foi aprovada de maneira unânime e será a resolução
    05/2017.
  votacao: unanimidade
  pagina: 7
  conferido: true
- tema: Alteração no texto da resolução que regulamenta a prática do Escotismo no Brasil
  decisao: Tal alteração foi aprovada e consta na resolução 04/2017, artigo 2º, parágrafo 3º.
  votacao: ''
  pagina: 7
  conferido: true
- tema: Posicionamento institucional sobre participação na Parada Gay 2018
  decisao: Fica estabelecido o encaminhamento apresentado pela conselheira ISABELLY, de não necessidade de um posicionamento
    institucional para a Região Escoteira participar do evento.
  votacao: unanimidade
  pagina: 9
  conferido: true
