- tema: Planejamento Estratégico da UEB
  decisao: Proposto e aceito pelo CAN alterar a data da reunião de agosto para 4 a 7 de setembro, com vistas a trabalhar exclusivamente
    no desenvolvimento do Planejamento Estratégico. Cabe a DEN definir o melhor local para tal reunião. Participarão da reunião
    os membros do CAN, DEN, Coordenadores de Comissões, os Presidentes de Regiões Escoteiras ou uma pessoa por eles indicada.
    Márcio sugeriu que se convide pessoa fora do Movimento Escoteiro para mediar a reunião de setembro, o que foi aprovado
    pelo Conselho.
  votacao: ''
  pagina: 1
  conferido: true
