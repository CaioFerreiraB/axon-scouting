doc_key: ata-28-reuniao-ordinaria-do-conselho-de-administracao-nacional-1
reuniao:
  tipo: ordinaria
  data: '2000-08-19'
  local: Hotel Lyzon
deliberacoes:
- tema: Aprovação da Agenda
  decisao: Após alterações de ordem prática, a agenda é aprovada com disposição alternativa dos assuntos sugeridos.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Aprovação da Ata da XVII Reunião do CAN
  decisao: A Ata foi aprovada com as alterações acima descritas.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Discussão sobre Estatuto da UEB
  decisao: Ficou decidido que será feita a convocação conforme entendimento geral, propondo a discussão do assunto e que se
    for do entendimento da Assembléia que deva-se votar a questão em reunião diversa, então a partir dessa decisão o assunto
    será postergado para próxima reunião, em Natal/RN.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Solicitação de Condecorações e Propostas de Medalhas de Tiradentes
  decisao: Foi aprovada por unanimidade a emissão das medalhas para Wilma ica Veit Schiefferdecker, José Ferreira Machado,
    Ayrtom Álvares Pinheiro Bitencourt S.J. e Nelson Sepka Senna. Paulo propõe Medalha de Tiradentes para Régis Blauth a qual
    também é aprovada por unanimidade. Geraldino solicita Medalha de Tiradentes para Elmer de Souza Pessoa, a qual é aprovada
    por unanimidade. Ewerson apresenta proposta de Medalha de Tiradentes para Francisco de Lima da Região Escoteira de Minas
    Gerais, a qual também é aprovada por unanimidade.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Entrega de documentos ao Escritório Nacional
  decisao: Ficou decidido que não serão entregues para cópia os documentos solicitados pelo companheiro David Crusius, estando
    todos os documentos solicitados em poder do Secretário Geral durante a reunião para qualquer análise, por cinco votos
    a favor da entrega, seis contra e duas abstenções.
  votacao: 5 a favor, 6 contra, 2 abstenções
  pagina: 2
  conferido: true
- tema: Proposta de Reforma no Regulamento do CAN
  decisao: Aprovada a proposta de que o plano não seja bienal conforme consta no documento apresentado e sim anual como vem
    sendo feito.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Intervenção no Maranhão
  decisao: O CAN aprovou a ida do companheiro Fred para tratar do assunto diretamente em nome da Comissão, evitando gastos
    ainda maiores com o deslocamento de toda a Comissão.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Projeto Centro-oeste
  decisao: O projeto será passado aos cuidados da Diretoria Executiva para detalhamento e aproveitamento em um projeto ainda
    maior em fase de elaboração pelo Escritório Nacional.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Aprovação do distintivo de Recrutador para adultos
  decisao: O CAN aprova a ideia e a Comissão de Crescimento compromete-se a verificar melhores formas de divulgação do Projeto
    “É tempo de Crescer”, bem como fica o EN incumbido de divulgar na Internet e outras formas imediatas a decisão.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Proposta de Resolução fixando o valor anual para 2001
  decisao: Foi determinado ao Escritório Nacional que providencie a redação do documento final contemplando as alterações
    feitas pelo CAN e envie aos Conselheiros para aprovação final via correio eletrônico ou fax.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Proposta de resolução quanto ao uso de pólvora, morteiros, fogos de estampidos e de artifício
  decisao: Ficou decidido que Rubem fará uma nova redação fazendo algumas alterações e apresentará posteriormente.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Custeio de um membro do CCME na Assembléia Nacional
  decisao: Fica aprovada a proposta de que as despesas desta pessoa no Evento serão custeadas pela UEB.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Formação de Comissão de Sindicância para recurso do 10./MT
  decisao: 'É formada Comissão de Sindicância para verificar a questão. Integrarão a Comissão: Fred, Geraldino e Chaves.'
  votacao: ''
  pagina: 3
  conferido: true
- tema: Proposta quanto a literatura básica da UEB
  decisao: Ficou decidido que, na próxima reunião, Rubem Tadeu apresentará nova proposta. Proposta a aplicação de 10% de “royalties”,
    após votação a proposta foi aprovada por 10 votos à favor e 1 abstenção.
  votacao: 10 a favor, 1 abstenção
  pagina: 3
  conferido: true
- tema: Alteração do horário da reunião para o dia seguinte
  decisao: A proposta é aceita e a reunião é encerrada às 19:00 h.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Notificação Judicial para Grupos com Castores
  decisao: Foi aprovada a proposta, e incumbido o EN de providenciar as Notificações.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Alteração da Regra 131 do P.O.R. sobre uso de morteiros e fogos de artifício
  decisao: A proposta de alteração da Regra 131 do P.O.R. com relação ao uso de Morteiros, Fogos de Artifício e similares,
    a qual é aprovada pelo Conselho.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Cobrança de royalties por publicações regionais
  decisao: Fica decidido que deverão ser cobrados os “royalties” da Região do Rio Grande do Sul e o Companheiro David solicita
    que seja notificada oficialmente a Região sobre esta decisão. Também serão cobrados os valores devidos ao Nível Nacional
    pela publicação do “Guia do Lobinho”.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Realização de reunião extraordinária do CAN em novembro de 2000
  decisao: Propõe-se realizar uma reunião extraordinária do CAN no mês de novembro de 2000, para dar continuidade ao trabalho
    do Plano Estratégico e Rubem Tadeu fica de apresentar sugestão de datas para realização da reunião nos moldes das reuniões
    antigas no que se refere às despesas individuais.
  votacao: ''
  pagina: 5
  conferido: true
