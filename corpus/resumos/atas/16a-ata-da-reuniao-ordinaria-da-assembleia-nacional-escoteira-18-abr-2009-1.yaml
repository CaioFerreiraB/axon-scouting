doc_key: 16a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-18-abr-2009-1
reuniao:
  tipo: ordinaria
  data: '2009-04-18'
  local: Dall’Onder Grande Hotel, na rua Herny Hugo Dreher, nº 197 em Bento Gonçalves/RS
deliberacoes:
- tema: Eleição e posse da mesa diretora
  decisao: 'foi aclamada e empossada a Mesa, conforme segue: Presidente: Rubem Süffert (DF), Vice-Presidentes: Marco Aurélio
    Romeu Fernandes (RS) e Carlos Eduardo Chaise (RS); Secretárias: Cleide Pires de Jesus (GO) e Maria Cristina Rutz Debiazio
    (PR)'
  votacao: aclamação
  pagina: 1
  conferido: true
- tema: Constituição das Comissões Assessoras da Assembléia
  decisao: 'As comissões assessoras foram constituídas da seguinte forma: COMISSÃO DE CREDENCIAMENTO – Luiz Salgado Klaes
    (SC) e Mariovani Carsten Cervi (PR), auxiliados pelo Executivo Celso Ferreira Filho; COMISSÃO ELEITORAL – André Carreira
    (RJ), Raphael Tostes Salin e Souza (DF) e Ronilde Carsten Cervi (PR) auxiliados pelo Executivo Nacional Luiz César de
    Simas Horn; COMISSÃO DE ESCRUTÍNIO – Augusto de Barcellos Willer (DF), Fábio Conde (RJ), Júlio Massirer (RS) e Siágrio
    Felipe Pinheiro (RJ), e COMISSÃO DE ASSUNTOS GERAIS – Carlos Frederico dos Santos (RJ), Irineu Muniz de Resende Neto (PR)
    e Renato Araújo Silva (SP)'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Aprovação da Ata da 15ª Reunião Ordinária da Assembléia Nacional
  decisao: A Ata com as alterações sugeridas foi colocada para apreciação, e aprovada por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação da Ata da Reunião Extraordinária da Assembléia Nacional Escoteira de 21/04/2008
  decisao: a ata foi colocada para apreciação, e aprovada por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação do Relatório Anual de 2008 da UEB
  decisao: O Relatório Anual 2008 foi aprovado por 61 votos favoráveis, tendo tido somente 1 voto contrário e 3 abstenções
  votacao: 61 votos favoráveis, 1 contrário, 3 abstenções
  pagina: 2
  conferido: true
- tema: Aprovação do Balanço Anual de 2008 da UEB
  decisao: o Balanço Anual e a Apuração de Resultados/2008 foram aprovados por 58 votos favoráveis, tendo tido 3 votos contrários
    e 3 abstenções
  votacao: 58 votos favoráveis, 3 contrários, 3 abstenções
  pagina: 2
  conferido: true
- tema: Arquivamento do pedido de análise da candidatura de Marco Aurélio de Mello Castrianni ao CAN
  decisao: Colocado para apreciação a proposta de arquivamento do pedido de análise recebeu o voto favorável de 58 Delegados
    tendo, portanto, sido aprovado
  votacao: 58 votos favoráveis
  pagina: 3
  conferido: true
- tema: Rejeição do pedido de consulta ao Conselho Nacional de Justiça sobre candidatura ao CAN
  decisao: Colocado para apreciação a proposta de pedido de consulta ao Conselho Nacional de Justiça recebeu 15 votos favoráveis,
    havendo 5 abstenções, não tendo sido aceita
  votacao: 15 votos favoráveis, 5 abstenções, rejeitada
  pagina: 3
  conferido: true
- tema: Aprovação da postulação da UEB/DF para sediar eventos em 2011
  decisao: A postulação foi aprovada por Aclamação e foi delegada à DEN a indicação de uma eventual sede alternativa
  votacao: aclamação
  pagina: 5
  conferido: true
- tema: Encaminhamento para atualização e modernização do POR sobre Escotismo e Direitos Humanos
  decisao: A Comissão decide encaminhar para o Conselho de Administração Nacional para atualização e modernização do POR
  votacao: ''
  pagina: 6
  conferido: true
- tema: Voto de Louvor à Região do Rio Grande do Sul e outros
  decisao: Registrado Voto de Louvor, com aprovação unânime pela Assembléia, à Região do Rio Grande do Sul pela organização
    do Congresso, à Diretoria Executiva Nacional pelo trabalho realizado, a todos os dirigentes e Escotistas em atividade
    no Brasil e em especial aos participantes deste Congresso e seus familiares
  votacao: unanimidade
  pagina: 6
  conferido: true
