- tema: Comissões Assessoras da Assembleia
  decisao: 'as comissões ficaram assim formadas: Comissão de Credenciamento: Aline Milan Falcade 315º SP, Kátia Cristina Videira
    de Freitas Antonin 362º SP, Eliana Márcia Sotello Cabrera 269º SP, Fernando Del Antonini 362º SP, Priscila Oriani de Carvalho
    9º SP, Vilma Pietropoli Morais — Diretoria Regional, William Capuci Rodrigues 269º SP; Comissão Eleitoral: Marcos Antônio
    de Carvalho (Moral) 98º SP, Leandro Rodrigues de Campos 402º SP, Paulo Silva Nhemetz (P3) 58º SP e Fábio Soladro 191º
    SP; Comissão de Escrutínio: Félix Vieira Varejão Filho 66ºSP, Carlos Alberto Barboza 252º SP, Arnoldo Wilde 101º SP, Maurício
    Freire Dias 150º SP, Vânia Ferrari 206º SP, Alexandro José Pimenta 241º SP, Fernando Faria de Oliveira 235º SP; Comissão
    de Estilo: dispensada por ser opcional; Comissão de Assuntos Gerais: Victor Brotto Sguillaro 316º SP, Fabiano Kunert 55º
    SP, Filipe Pereira Bassetto 81º SP, Mariana de Marchi 142º SP'
  votacao: aclamação
