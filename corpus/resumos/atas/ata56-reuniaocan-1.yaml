  data: '2008-04-19'
  local: Aracruz, Espírito Santo/ES
deliberacoes:
- tema: Agenda de trabalho
  decisao: A agenda de trabalho com as modificações foi aprovada.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Ata da 55ª reunião Extraordinária do CAN
  decisao: a ata, colocada em votação, foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Ordem da Flor de Lis – proposta de revitalização
  decisao: O CAN decidiu pela criação de um Conselho Curador Provisório para reestruturação da Ordem da Flor de Lis composto
    por Fernando Brodeschi, Rubem Tadeu Cordeiro Perlingeiro e Luiz Salgado Klaes e que apresentarão ao CAN um estudo para
    implementação de alterações.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Encaminhamentos sobre comodato do terreno UEB/PB
  decisao: O CAN sugere seja contratado um escritório de advocacia e seja dada total atenção ao assunto. Ambas as orientações
    foram aprovadas pelo CAN.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Concessão de medalhas
  decisao: 'aprovadas a concessão das seguintes medalhas: Tapir de Prata: Antônio César Oliveira; Tiradentes: Severino José
    dos Santos, Haroldo Garcia de Moraes, Luiz Carlos Figueredo Barbosa e Marco Aurélio Romeu Fernandes; Velho Lobo: Monsenhor
    João Penha Filho; Cruz de São Jorge: João Roberto Andriani Cunha e Rafael Will Suarez Cuadra e Gratidão Ouro: Luiz Salgado
    Klaes.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Proposta de criação de Medalha
  decisao: o CAN decidiu por não aprovar a criação da medalha proposta.
  votacao: 9 votos favoráveis e 5 abstenções
  pagina: 2
  conferido: true
- tema: Solicitação de Concessão de Cruz de Valor
  decisao: o CAN decidiu por rejeitar o pedido e encaminhar à DEN para que estude a viabilidade de conceder outra Condecoração.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Renovação do mandato da DEN
  decisao: será coletada assinatura em documento específico para prorrogação do mandato da DEN tendo em vista necessidades
    legais junto à bancos e outras instituições.
  votacao: ''
  pagina: 3
  conferido: true
- tema: Eleição do Presidente e Vice-Presidente do CAN
  decisao: Para Presidência do CAN foi escolhido o Conselheiro Rubem Tadeu Cordeiro Perlingeiro. Para Vice-Presidente foram
    indicados os Conselheiros Márcio e Bini. Bini declinou da indicação. Márcio foi eleito por aclamação para Vice-presidência
    do CAN.
  votacao: aclamação
  pagina: 4
  conferido: true
- tema: Indicação de Conselheiros para áreas do Planejamento Estratégico
  decisao: 'O CAN decide indicar para as áreas: Estrutura: Rubem Tadeu, Klaes e Bini; Programa: Júlio, Raphael Tostes e Adolfo;
    Gestão de Adultos: Geraldino e Ênio; Imagem: Márcio; Comunidade: Rafael e Sandra.'
  votacao: ''
  pagina: 4
  conferido: true
