deliberacoes:
- tema: Destinação do superávit do Jamboree do Centenário
  decisao: Aprovada com 9 votos a favor (ALDENISE, BRAGA, CLAUCIO, DANIEL, DANIELA, ILKA, LUIZ CÉSAR, RENATO e SÉRIS), 3 abstenções
    por falta de pronunciamento (NETO, FÁBIO e LUCIANO) e 2 abstenções por manifestação fora do prazo (KARINA e SIMONI).
  votacao: 9 votos a favor, 5 abstenções
  pagina: 2
  conferido: true
- tema: Indicação a candidatura ao Comitê Escoteiro Interamericano
  decisao: A indicação da associada Fernanda Cristina Santos Soares para concorrer ao cargo de membro do Comitê Escoteiro
    Interamericano, com mandato previsto para o triênio 2026-2029, foi aprovada pela maioria dos Conselheiros(as) Nacionais.
  votacao: maioria
  pagina: 2
  conferido: true
- tema: Indicação de Chefe de Contingente - 26º Jamboree Mundial
  decisao: Aprovada com 12 votos a favor (ALDENISE, BRAGA, NETO, CLAUCIO, DANIEL, DANIELA, FÁBIO, ILKA, LUIZ CÉSAR, RENATO,
    SÉRIS e SIMONI); 1 abstenção por falta de pronunciamento (KARINA) e 1 abstenção por manifestação fora do prazo (LUCIANO).
  votacao: 12 votos a favor, 2 abstenções
  pagina: 3
  conferido: true
- tema: Indicação de Chefe de Contingente - JAMCAM 2025
  decisao: Aprovada por 7 votos (ALDENISE, BRAGA, CLAUCIO, DANIELA, FÁBIO, ILKA e RENATO); 7 abstenções por falta de pronunciamento
    (NETO, DANIEL, KARINA, LUCIANO, LUIZ CÉSAR, SÉRIS e SIMONI).
  votacao: 7 votos a favor, 7 abstenções
  pagina: 3
  conferido: true
- tema: Ata da 121ª Reunião Ordinária do CAN
  decisao: Aprovada por 11 votos (BRAGA, NETO, CLAUCIO, DANIEL, DANIELA, FÁBIO, LUCIANO, LUIZ CÉSAR, RENATO, SÉRIS e SIMONI);
    1 abstenção (ALDENISE) e 2 abstenções por falta de pronunciamento (ILKA e KARINA).
  votacao: 11 votos a favor, 3 abstenções
  pagina: 3
  conferido: true
- tema: Ata sessão fechada | reunião extraordinária do CAN 07/03/2025 | Cordões Ramos Escoteiro e Sênior
  decisao: Aprovada por 10 votos (ALDENISE, BRAGA, NETO, CLAUCIO, DANIEL, DANIELA, ILKA, LUIZ CÉSAR, RENATO e SÉRIS); 2 abstenções
    (FÁBIO e LUCIANO) e 2 abstenções por falta de pronunciamento (KARINA e SIMONI).
  votacao: 10 votos a favor, 4 abstenções
  pagina: 4
  conferido: true
- tema: Proposta de Resolução para Criação da Medalha e PIN da Solidariedade
  decisao: A proposta de Resolução CAN na qual dispõe sobre a criação de reconhecimento específico para ações voluntárias
    em situações de emergência, catástrofes naturais e apoio humanitário; com possibilidade de concessão retroativa de até
    quatro anos a partir da data do evento, aplicável em todo o território nacional, mediante análise da respectiva Região
    Escoteira, foi aprovada por unanimidade às 10h45min.
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: Proposta de Resolução de Criação do Grupo de Trabalho para Elaboração do Planejamento Estratégico - GTEPE
  decisao: Foi aprovada a inclusão de um representante da Diretoria Executiva Nacional (DEN) na coordenação do GETEPE. A data
    de entrega do planejamento para outubro de 2025 foi aprovada para posterior avaliação e aprovação pelo CAN. A proposta
    de Resolução do CAN que regulamenta a elaboração e aprovação do novo Planejamento Estratégico dos Escoteiros do Brasil
    foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: Proposta de Resolução que altera o P.O.R. – Princípios, Organização e Regras – da União dos Escoteiros do Brasil
  decisao: A proposta de Resolução que altera o P.O.R. foi aprovada por unanimidade pelos Conselheiros e Conselheiras Nacionais
    presentes.
  votacao: unanimidade
  pagina: 7
  conferido: true
- tema: Proposta de Resolução que estabelece a transição para o novo Programa Educativo
  decisao: A proposta de Resolução que dispõe sobre o período de transição para a implementação do Programa Educativo Atualizado
    dos Escoteiros do Brasil foi aprovada por unanimidade às 11h37min.
  votacao: unanimidade
  pagina: 7
  conferido: true
- tema: Proposta de encerramento da Intervenção na Região Escoteira do Tocantins
  decisao: A proposta de Resolução que dispõe sobre o encerramento da intervenção e a descontinuidade da Região Escoteira
    do Tocantins foi aprovada por unanimidade às 11h42min.
  votacao: unanimidade
  pagina: 8
  conferido: true
- tema: Proposta de atualização da Resolução CAN‑02/2019 (Conflito de Interesse)
  decisao: A Resolução que institui normas sobre acúmulo indevido de cargos e conflitos de interesse, revogando a CAN‑02/2019,
    foi aprovada por unanimidade às 15h08min.
  votacao: unanimidade
  pagina: 9
  conferido: true
- tema: Proposta de Alteração da Resolução CAN‑08/2022 (Regime Disciplinar)
  decisao: A Resolução CAN que altera o Regime Disciplinar da UEB, revogando disposições anteriores, foi aprovada conforme
    votação por item às 17h18min.
  votacao: aprovada conforme votação por item
  pagina: 10
  conferido: true
- tema: Nomeação Oficial do Presidente do Conselho
  decisao: DANIELA formaliza a nomeação de Irineu Muniz de Resende Neto como Presidente, conforme decisão da reunião extraordinária
    do CAN, em 15 de dezembro de 2024.
