doc_key: ata53-reuniaocan-1
reuniao:
  tipo: ordinaria
  data: '2007-04-28'
  local: Goiânia, GO
deliberacoes:
- tema: Documentos Internacionais
  decisao: O CAN deliberou que todo o material internacional que for recebido pela UEB em meio digital deverá ser imediatamente
    disponibilizado aos integrantes do CAN. Os demais deverão ser informados de sua existência e remetidos àqueles que manifestarem
    interesse em recebê-los.
  votacao: ''
  pagina: 1
  conferido: true
- tema: Plano de trabalho Comissão Nacional de Gestão de Adultos
  decisao: 'Foi proposto e aprovado o seguinte plano de trabalho: discussão interna na Comissão para consolidar o material
    - prazo de 90 (noventa) dias. Após a CNGA e DEN deverão divulgar e estimular a discussão nacional e finalizar a proposta
    com a realização de Seminário Nacional no Congresso de 2008 e aprovação pelo CAN na reunião de Agosto/2008.'
  votacao: unanimidade
  pagina: 1
  conferido: true
- tema: Ajustes no Estatuto e Assembleia Geral Extraordinária
  decisao: Aprovado, também por unanimidade, a realização de Assembléia Geral Extraordinária em 2008 para adequação estatutária
    de tais pontos.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Criação de Secretaria Executiva para a UPEB
  decisao: Fred propõe, e é aprovada, a criação de uma Secretaria Executiva para a UPEB e outras ações de relações institucionais
    da UEB.
  votacao: ''
  pagina: 2
  conferido: true
- tema: Propostas de Condecorações
  decisao: 'aprovadas as solicitações para: Medalha Tiradentes: Antônio Boulanger Ulhoa Ribeiro e Renato Araújo da Silva.
    Medalha Velho Lobo: Wilson Antonio Rodrigues e Elmer de Souza Pessoa. Cruz de São Jorge: Siágrio Felipe Pinheiro e Carlos
    Frederico dos Santos. Tapir de Prata: Renato Martins Conde.'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Aprovação dos balancetes do segundo semestre de 2006
  decisao: os balancetes do segundo semestre de 2006 foram enviados antecipadamente e aprovados por unanimidade
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Autorização para negociação de aquisição de imóvel para Escritório Nacional
  decisao: O CAN aprova por unanimidade a autorização para negociações
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Autorização para postular realização do Jamboree Nacional e Pan-Americano
  decisao: O CAN concede a autorização solicitada
  votacao: ''
  pagina: 3
  conferido: true
- tema: Voto de louvor a organizadoras do Mutirão Nacional Pioneiro
  decisao: Paulo pede voto de louvor do CAN à Luiza Campelo e Rosele Penz (Tamy), organizadoras do mesmo, o que é aprovado
    por unanimidade.
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Aprovação da criação do cargo de Diretor Voluntário de Métodos Educativos e contratação
  decisao: Aprovada criação do cargo e a contratação de Executivo de Gestão de Adultos de acordo com disponibilização orçamentária.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Elaboração de minuta de resolução sobre ingresso e nomeação de adultos
  decisao: aprovada a designação do Conselheiro Alessandro para elaborar minuta de resolução que trate do ingresso e nomeação
    de adultos no Movimento Escoteiro e posterior inclusão nas Diretrizes Nacionais de Gestão de Adultos.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Proposta para Comissão Nacional de Crescimento
  decisao: Renato Eugênio de Lima fique a frente da Comissão Nacional de Crescimento até agosto/2007.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Estudo sobre situação dos Grupos Escoteiros para próxima reunião
  decisao: para a reunião de agosto a DEN deve apresentar estudo da situação dos Grupos Escoteiros que tinham efetivo de 20
    e 30 registrados no ano de 2006.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Proposta para Comissões Assessoras do CAN
  decisao: Aprovada proposta apresentada por Rubem para encaminhamento de questionário e apresentação de proposta de Resolução
    na próxima reunião.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Complementação do Sistema de Informações Gerenciais - SIG
  decisao: a DEN deve complementar o SIG a cada dois meses com um Relatório Administrativo e o CAN deverá apresentar a informação
    quanto ao andamento do trabalho das Comissões.
  votacao: ''
  pagina: 4
  conferido: true
- tema: Deliberação sobre custeio de passagens aéreas para reuniões do CAN
  decisao: o CAN decide que a despesa de transporte que ocorrer por ocasião da reunião junto a Assembléia Nacional ou algum
    evento nacional correrá por conta individual, e que quanto às duas outras reuniões uma será rateada entre os participantes
    e outra paga pela UEB.
  votacao: consenso
  pagina: 4
  conferido: true
- tema: Manutenção da Presidência e Vice-Presidência do CAN
  decisao: Aprovada a proposta de César ficando o Conselheiro Romeu na Presidência do CAN e o Conselheiro Rubem na Vice-Presidência.
  votacao: ''
  pagina: 5
  conferido: true
- tema: Indicações das Comissões Assessoras
  decisao: 'Comissão Nacional de Programa de Jovens: Maria Terezinha Koneski Weiss; Comissão Nacional de Crescimento: Renato
    Eugenio de Lima – César e João; Comissão Nacional de Gestão de Adultos: Ênio Hideyuki Cojho – João, Castrianni, Klaes
    e Rafael Will; Comissão Nacional de Relações Institucionais: Marco Aurélio Romeu Fernandes – Alessandro, Rafael (GO) e
    Márcio (DF); Comissão Nacional de Gestão Institucional: Mário Henrique Peters Farinon - Márcio, Sandra e Rubem; Comissão
    Nacional de Relações Internacionais: Oscar Victor Palmquist Arias – Fernando, Castrianni e Klaes.'
  votacao: ''
  pagina: 5
  conferido: true
