- tema: Composição das Comissões Assessoras
  decisao: 'As comissões assessoras restaram constituídas da seguinte forma: COMISSÃO DE CREDENCIAMENTO – Mariovani Carsten
    Cervi (PR), Luiz Salgado Klaes (SC) e auxiliados pelo Gerente Sênior Celso Ferreira Filho; COMISSÃO DE ESCRUTÍNIO – Francis
    Souza Carrer (SP), David Izecksohn Neto (RJ), Narciso Saffério Giraldi (SC), Miguel Ney Carvalho (PA) e Pedro Fabiano
    da Silva Souza (RS) e COMISSÃO DE ASSUNTOS GERAIS: Alex Amorim Faia (RJ), Geraldo Tiaraju Barbosa (RS) e Vitor Augusto
    Gay (PR)'
  votacao: ''
  pagina: 1
  conferido: true
- tema: Deliberação sobre o Relatório Anual de 2009
  decisao: O Relatório Anual de 2009 da União dos Escoteiros do Brasil foi aprovado por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Deliberação sobre o Balanço Anual de 2009
  decisao: o Balanço Anual e a Apuração de Resultados/2009 foram aprovados por ampla maioria tendo sido registrado somente
