    Sede e Região Sede alternativa
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Escolha da Região-Sede para eventos de 2012 (reconsideração)
  decisao: por unanimidade foi escolhida a Região do Maranhão para Região Sede e deixada para a DEN a escolha de uma eventual
    Sede-Alternativa
  votacao: unanimidade
