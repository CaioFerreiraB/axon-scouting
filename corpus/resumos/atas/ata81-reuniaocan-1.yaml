- tema: Aprovação da eleição do 1º Vice-Presidente da DEN no final do dia
  decisao: A eleição do 1º Vice-Presidente da DEN no final do dia de hoje foi aprovada por 9 (nove) votos favoráveis, 3 (três)
    votos contrários e 1 (uma) abstenção.
  votacao: 9 a favor, 3 contra, 1 abstenção
  pagina: 5
  conferido: false
- tema: Manutenção da eleição da DEN na reunião do CAN
  decisao: Colocado em votação se a eleição da DEN deve ser retirada da pauta desta reunião, 8 (oito) votos foram contrários
    e 5 (cinco) favoráveis, sendo, com isso, mantida a eleição nesta reunião do CAN.
  votacao: 8 contra, 5 a favor
  pagina: 5
  conferido: false
- tema: Aprovação da carta para Assembleia Nacional sobre Assembleia do Maranhão
  decisao: Colocada em votação a carta redigida para encaminhamento à Assembleia Nacional acerca da Assembleia Extraordinária
    da Região Escoteira do Maranhão, sujeitando-a a aprovação do Conselho, a qual foi debatida. Em regime de votação a mesma
    foi aprovada por unanimidade.
  votacao: unanimidade
  pagina: 9
  conferido: false
- tema: Criação de Grupo de Trabalho para elaboração de políticas institucionais
  decisao: Fica aprovada a criação do GT por unanimidade com estes 5 (cinco) componentes.
