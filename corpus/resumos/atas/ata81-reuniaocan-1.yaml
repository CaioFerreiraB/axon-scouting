  decisao: O CAN acatou o encaminhamento do sugerido pela Equipe Nacional de Espiritualidade e deliberou por unanimidade pelo
    encaminhamento do assunto ao GT de Posicionamento Institucional.
  votacao: unanimidade
  pagina: 20
  conferido: true
- tema: Voto de louvor a Oscar e Jonathan pelo trabalho na coordenação do contingente brasileiro no Jamboree Mundial
  decisao: Solicitando que o Conselho aprove um voto de louvor a Oscar e a Jonathan pelo trabalho realizado, o que é aprovado
