doc_key: 6a-ata-da-reuniao-ordinaria-da-assembleia-nacional-escoteira-12-e-14-nov-1999-1
reuniao:
  tipo: ordinaria
  data: '1999-11-12'
  local: Rafain Palace Hotel, Av. Olímpio Rafagnin, s/n.o, BR-277, km 727, Foz do Iguaçu, PR
deliberacoes:
- tema: Composição da Mesa
  decisao: 'foi eleita a Mesa, ad referendum da 2.o Sessão da Assembléia, conforme segue: Presidente: Paulo Salamuni (PR);
    Vice-presidentes: Luís César Souto de Moura (RS) e Renato Araújo da Silva (SP); Secretárias: Diva Irene da Paz Vieira
    (PR) e Nanci Maria AbelinCechela (RS).'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Designação das Comissões Assessoras
  decisao: 'feitas as seguintes designações, a serem referendadas pela 2.o Sessão da Assembléia: COMISSÃO DE CREDENCIAMENTO:
    Antônio César Oliveira (GO), Luiz Roberto de Morais (SP) e Marcelo Lisboa (SC), apoiada pelo Executivo Luiz César de Simas
    Hom (SC); COMISSÃO ELEITORAL: Irene Rosa Sintra (SP), José Carlos Petró (RS) e Mauro Edson Alberti (PR), apoiada pelo
    Executivo Gino Augusto Bacchi; COMISSÃO ESCRUTINADORA: Cleusa lara Campello (RS), Ênio Hideyuki Cojho (SP) e Mariovani
    Carsten Cervi (PR), apoiada pelo Executivo Alexandre Liber (SP); COMISSÃO DE ASSUNTOS GERAIS: João Batista Fiorini Thomé
    (SC), Mário Gréggio (SP) e Roberto Luiz Martins Riche (RS), apoiada pelo Executivo Eduardo Carneiro Bello (DN).'
  votacao: ''
  pagina: 2
  conferido: true
- tema: Concessão de condecorações
  decisao: aprovada, por unanimidade, a concessão do TAPIR DE PRATA aos Escotistas JOÃO PENHA FILHO, MÁRIO HENRIQUE PETERS
    FARINON e GEORGE DUNCAN SHELLARD.
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Aprovação da composição da Mesa e Comissões de Trabalho
  decisao: foi aprovado por unanimidade o REFERENDO A COMPOSIÇÃO DA MESA E DAS COMISSÕES DE TRABALHO, aprovadas na 1.o Sessão
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Inclusão na Ordem do Dia da eleição de Conselheiro Fiscal Nacional Suplente
  decisao: foi aprovada por unanimidade a inclusão na Ordem do Dia da ELEIÇÃO DE CONSELHEIRO FISCAL NACIONAL SUPLENTE
  votacao: unanimidade
  pagina: 3
  conferido: true
- tema: Aprovação do Relatório de Atividades de 1998-1999 e Balanço Anual
  decisao: aprovados, por unanimidade, o Relatório e as Demonstrações Financeiras, acompanhados do Parecer da Comissão Fiscal
    e do Parecer dos Auditores Independentes
  votacao: unanimidade
  pagina: 4
  conferido: true
- tema: Aprovação do Relatório e Balanço de 1998 da Loja Escoteira Nacional
  decisao: aprovados, por unanimidade o Relatório e as Demonstrações Financeiras da Loja, acompanhados do Parecer da Comissão
    Fiscal e do Parecer dos Auditores Independentes
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Eleição dos Diretores Nacionais (Conselheiros de Administração Nacional) para o mandato 2000-2002
  decisao: 'foram eleitos os conselheiros para o período de janeiro de 2000 a dezembro de 2002, com o seguinte resultado total:
    GERALDINO FERREIRA MOREIRA, dezoito votos; MARCOS CARVALHO, dezoito votos; PAULO SALAMUNI, dezoito votos; CARLOS FREDERICO
    DOS SANTOS, dezessete votos; DAVID CRUSIUS, quinze votos; JULIO AUGUSTO MENDES ERICEIRA, quinze votos'
  votacao: 101 votos válidos e 1 branco
  pagina: 5
  conferido: true
- tema: Referendo à composição da Mesa e Comissões de Trabalho
  decisao: foi aprovado por unanimidade o REFERENDO A COMPOSIÇÃO DA MESA E DAS COMISSÕES DE TRABALHO, aprovadas na 1.o Sessão
  votacao: unanimidade
  pagina: 6
  conferido: true
- tema: Aprovação das recomendações do 4.o Fórum Nacional de Jovens Líderes
  decisao: foram apresentadas e aprovadas diversas sugestões e propostas para o Fórum Nacional de Jovens Líderes, incluindo
    mudanças no regimento, eleição, composição do Comitê Nacional de Programa de Jovens, apoio a fóruns internacionais, política
    contra álcool e drogas, e plano de ação para 2001
  votacao: ''
  pagina: 6
  conferido: true
- tema: Aprovação das recomendações dos Seminários
  decisao: foram aprovadas recomendações relativas à publicação de manuais, definição de equivalências, divulgação de ações,
    realização de seminários e apoio à União Parlamentar Escoteira
  votacao: ''
  pagina: 7
  conferido: true
- tema: Deliberação sobre proposta de alteração do Estatuto
  decisao: foram votados e aprovados diversos pontos da proposta de alteração do Estatuto, incluindo personalidade jurídica
    dos Grupos Escoteiros, autorização para Regiões, critérios para candidatura, direitos dos conselheiros fiscais, criação
    de Comissão de Ética, mudança de denominação da Diretoria Nacional para Conselho de Administração Nacional, transferência
    da sede para Curitiba, competência do Conselho de Administração Nacional e ajustes nos artigos dos Fundamentos
  votacao: ''
  pagina: 8
  conferido: true
- tema: Escolha da Região-Sede e Região Alternativa para a 8.o Reunião Ordinária da Assembléia Nacional, 7.o Congresso Escoteiro
    Nacional e 6.o Fórum Nacional de Jovens Líderes - 2001
  decisao: por unanimidade, foi eleita a Região do Rio Grande do Sul para sediar os eventos; como Região Alternativa, foi
    eleita a Região do Espírito Santo
  votacao: unanimidade
  pagina: 9
  conferido: true
- tema: Eleição de Conselheiro Fiscal Nacional Suplente
  decisao: foi eleito com 52 votos NELSON OTÁVIO MAIA (PR) - contra 21 votos recebidos pelo candidato Ronei Castilho da Silva
    (RS) - para mandato a encerrar-se na Assembléia de 2000
  votacao: 52 votos a 21
  pagina: 9
  conferido: true
- tema: Constituição de Comissão para estudo do Jamboree Mundial de 2011 no Brasil
  decisao: foi aprovada a constituição da Comissão para estudar a viabilidade técnico-econômica para a realização do Jamboree
    Mundial de 2011 no Brasil e elaborar Plano de Ação a ser apresentado à Assembléia Nacional de 2000
  votacao: unanimidade
  pagina: 9
  conferido: true
