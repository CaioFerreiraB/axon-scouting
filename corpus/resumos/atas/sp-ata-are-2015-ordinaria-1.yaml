doc_key: sp-ata-are-2015-ordinaria-1
reuniao:
  tipo: ordinaria
  data: '2015-03-14'
  local: Instituto Tecnológico de Aeronáutica (ITA), Praça Marechal Eduardo Gomes, nº. 50, Vila da Acácias, São José dos Campos,
    SP
deliberacoes:
- tema: Mesa Diretora da Assembleia
  decisao: 'foi aprovado pelo plenário, com a seguinte nominata: Carlos Eugênio Bakos — Presidente da Mesa, Marco Aurélio
    de Mello Castrianni — 1º Vice-Presidente; Rafael Teixeira Nunes — 2º Vice-Presidente; Fábio Sola Aro — 1º Secretário;
    e João Carlos Valentim Veiga Junior — 2º Secretário'
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Comissões Assessoras da Assembleia
  decisao: manutenção das Comissões Assessoras, de Credenciamento, Eleitoral e Escrutínio, também eleitas durante a Reunião
    Extraordinária, com substituição do membro da Comissão de Escrutínio, Carlos Nunes, pelo Carlos Barboza, aprovada por
    aclamação; e aprovação por aclamação dos membros das Comissões de Assuntos Gerais e Estilo
  votacao: aclamação
  pagina: 2
  conferido: true
- tema: Entrega de Medalhas de Gratidão
  decisao: entrega da Medalha de Gratidão Grau Ouro, Prata e Bronze a diversos agraciados, saudados com uma palma escoteira
  votacao: ''
  pagina: 2
  conferido: true
- tema: Suspensão e reinício da Assembleia
  decisao: suspensão da presente Assembleia, com reinício para a manhã de domingo, que, em regime de votação, foi aprovada
    por unanimidade
  votacao: unanimidade
  pagina: 2
  conferido: true
- tema: Dispensa da leitura da ata da reunião anterior
  decisao: a ata foi dispensada por maioria absoluta de votos e aprovada por unanimidade com ressalva apresentada
  votacao: maioria e unanimidade
  pagina: 3
  conferido: true
- tema: Aprovação das contas e balanço do exercício fiscal de 2014
  decisao: prestação de contas com a observação do Chefe Vicente, foi aprovada com 4 (quatro) abstenções
  votacao: 4 abstenções
  pagina: 4
  conferido: true
- tema: Aprovação da previsão orçamentária para 2015/2016
  decisao: previsão orçamentária aprovada por unanimidade
  votacao: unanimidade
  pagina: 5
  conferido: true
- tema: Referendo ao trabalho dos jovens do XIII Fórum Regional de Jovens Líderes
  decisao: o trabalho dos jovens fosse referendado
  votacao: aclamação
  pagina: 9
  conferido: true
- tema: Aprovação da proposta para encaminhamento das decisões da Assembleia
  decisao: proposta de que as decisões da Assembleia sejam informadas de seu encaminhamento na medida em que as providências
    forem sendo tomadas; aprovada por unanimidade
  votacao: unanimidade
  pagina: 11
  conferido: true
