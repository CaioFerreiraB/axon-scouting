reuniao:
  tipo: ordinaria
  data: '1994-04-23'
  local: ''
deliberacoes:
- tema: aprovação das atas das reuniões anteriores
  decisao: o Presidente submeteu ao plenário a aprovação das atas da Reunião Extraordinária e da XLIV Reunião Ordinária do
    Conselho Nacional, realizadas em 25 e 24 de abril de 1993, respectivamente, tendo sido aprovadas
  votacao: por Resea7777777//////7///77//7/0777707070007/7/22/ 00000
  pagina: 1
  conferido: true
- tema: aprovação do relatório anual/1993 da CENA e do CNR
  decisao: Procedida a votação, os relatórios foram aprovados
  votacao: por Renee 77///////////////////////7///////////00 000
  pagina: 1
  conferido: true
- tema: eleição da diretoria nacional e comissão fiscal nacional
  decisao: 'Foram eleitos os seguintes companheiros: Diretoria Nacional, com mandato de 1 (um) ano: ALEXANDRE A.C. OLIANI
    (SP), JOÃO FAGUNDES HAUCK (MG), JORGE ANTÔNIO DOS SANTOS (BA), IGOR KIPMAN (DF), e JOÃO ALBERTO BORDIGNON (PR). Diretoria
    Nacional, com mandato de 2 (dois) anos: GUILHERME REICHWALD (RD), MARIO HENRIQUE PETERS FARINON (RS), MARCO AURÉLIO DE
    MELO CASTRIANI (SP), VANDER VELOSO PIRES (MG), e OSCAR VICTOR P. ARIAS (PR). Diretoria Nacional, com mandato de 3 (três)
    anos: EDUARDO SZAZI (SP), ANTÔNIO CÉSAR DE OLIVEIRA (GO), ANTÔNIO CARLOS HOFF (RS), RENATO EUGÊNIO DE LIMA (PR) e MAURÍCIO
    MOUTINHO DA SILVA (RJ). Membros Titulares da Comissão Fiscal Nacional: WULMAR LYSIS BISSÁGIO (MG), FUJO SEI (SP), e EDUARDO
    RAYA (SP). Membros Suplentes da Comissão Fiscal Naciong: LUIZ SALGADO KLAES (SC), ALCIONES AMARAL (MG), e HELMINGTON J.B.
    SOUZA (BA)'
  votacao: ''
  pagina: 1
  conferido: true
- tema: posse da diretoria e comissão fiscal nacional
  decisao: Os recém eleitos membros da Diretoria € Comissão Fiscal Nacional, tomaram posse, renovando a Promessa Escoteira
    frente ao plenário da Assembléia Nacional.
  votacao: ''
  pagina: 2
  conferido: true
- tema: fixação de datas para a II e III Assembleias Nacionais
  decisao: 'ficando aprovadas as seguintes: II Assembléia Nacional - de 02 a 05 de novembro de 1995; III Assembléia Nacional
    - de 01 a 04 de novembro de 1996.'
  votacao: por unanimidade
  pagina: 2
  conferido: true
- tema: aprovação das candidaturas para sediar a II e III Assembleias Nacionais
  decisao: A Região de Santa Catarina apresenta sua candidatura para sediar a II Assembléia Nacional, e a Região do Rio Grande
    do Sul apresenta sua candidatura para sediar a III Assembléia Nacional. Não havendo outras candidaturas, as duas propostas
    foram aprovadas por unanimidade.
  votacao: por unanimidade
  pagina: 2
  conferido: true
- tema: aprovação da proposta de alteração dos limites geográficos das Regiões Escoteiras de Goiás e Distrito Federal
  decisao: A presente proposta foi aprovada
  votacao: 'por Rana: 7297/////////////////////////00//0000//0 0000'
  pagina: 2
  conferido: true
