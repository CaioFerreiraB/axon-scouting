  - {id: can, nome: Conselho de Administração Nacional, instancia_de: conselho_de_administracao_nacional,
     parte_de: ueb, fonte: estatuto-2024#art16@p11}
  - {id: den, nome: Diretoria Executiva Nacional, instancia_de: diretoria_executiva_nacional, parte_de: ueb,
     fonte: estatuto-2024#art18@p14}
  - {id: ccn, nome: Conselho Consultivo Nacional, instancia_de: conselho_consultivo_nacional, parte_de: ueb,
     fonte: estatuto-2024#art20@p15}
  - {id: cfn, nome: Comissão Fiscal Nacional, instancia_de: comissao_fiscal_nacional, parte_de: ueb,
     fonte: estatuto-2024#art21@p15}
  - {id: cedn, nome: Comissão de Ética e Disciplina Nacional, instancia_de: comissao_de_etica_nacional, parte_de: ueb,
     fonte: estatuto-2024#art22@p16}
  - {id: rnjl, nome: Rede Nacional de Jovens Líderes, instancia_de: rede_de_jovens_lideres, parte_de: ueb,
     fonte: regulamento-geral-rnjl-2022#art1@p6}
  - {id: ar_sp, nome: Assembleia Regional de São Paulo, instancia_de: assembleia_regional, parte_de: regiao_sp,
     fonte: regulamento-regional-sp-2022#art2@p2, citacao: "São órgãos regionais: I. a Assembleia Regional; …"}
  - {id: dr_sp, nome: Diretoria Regional de São Paulo, instancia_de: diretoria_regional, parte_de: regiao_sp,
     fonte: regulamento-regional-sp-2022#art2@p2}
  - {id: ccr_sp, nome: Conselho Consultivo Regional de São Paulo, instancia_de: conselho_consultivo_regional,
     parte_de: regiao_sp, fonte: regulamento-regional-sp-2022#art2@p2}
  - {id: cfr_sp, nome: Comissão Fiscal Regional de São Paulo, instancia_de: comissao_fiscal_regional,
     parte_de: regiao_sp, fonte: regulamento-regional-sp-2022#art2@p2}
  - {id: cedr_sp, nome: Comissão de Ética e Disciplina Regional de São Paulo, instancia_de: comissao_de_etica_regional,
     parte_de: regiao_sp, fonte: regulamento-regional-sp-2022#art2@p2}
  - {id: crj_sp, nome: Conselho Regional Jovem de São Paulo, instancia_de: conselho_regional_jovem, parte_de: regiao_sp,
     fonte: regimento-conselho-regional-jovem-sp-2019.02.22#art1@p1}
  - {id: cvl_sp, nome: Conselho Regional dos Portadores da Medalha Velho Lobo de São Paulo,
     instancia_de: conselho_regional_velhos_lobos, parte_de: regiao_sp,
     fonte: regimento-conselho-medalha-velho-lobo-sp-2018.12.08#art1@p1}
  - {id: crp_sp, nome: Comissão Regional Pioneira de São Paulo, instancia_de: comissao_regional_pioneira,
     parte_de: regiao_sp, fonte: sp-1-ata-xxii-frjl-ordinario-marco-de-2024-assinada-1-1#s24@p9,
     citacao: "Núcleo Regional de Jovens Líderes, Comissão Regional Pioneira, Diretoria Jovem e Conselho Regional Jovem"}

cargos:
