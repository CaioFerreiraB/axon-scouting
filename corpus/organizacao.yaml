# Organização do movimento: a parte curada do grafo de domínio do scouting (spec 106, ADR-063 e ADR-064).
#
# Lido por `scripts/grafo.py build`: os tipos de órgão e de instituição (com nome e apelidos, que reconhecem a entidade
# numa pergunta), as instituições e os órgãos reais (Região SP, DR-SP, GE Inah…, 106 G3), cada um com a fonte, os
# cargos e as relações de governança. Os ramos, as seções, as áreas e os conceitos vão para `corpus/dominio.yaml` (106
# research R5). O desenho está em `Organização Escoteira.revisado.json` (arrows.app).
#
# `fonte` é o `chunk_id` do trecho que prova a relação, e `citacao` é o pedaço do texto, para conferência. Uma relação
# com `fonte: a verificar` não entra no grafo até ser conferida. As relações de governança ficam no grafo e fora da
# busca automática (decisão 4 do mantenedor; só a consulta `ligados` as devolve).
#
# `taxonomia` liga o tipo de órgão ao órgão da pasta (`bodies` no índice, o léxico da 101): é por ele que um documento
# fica EMITIDO_POR um órgão (G3).
version: 1

niveis:
  - {id: mundial, ordem: 0}
  - {id: interamericano, ordem: 1}
  - {id: nacional, ordem: 2}
  - {id: regional, ordem: 3}
  - {id: distrital, ordem: 4}
  - {id: local, ordem: 5}

tipos_de_instituicao:
  - {id: omme, nome: Organização Mundial do Movimento Escoteiro, nivel: mundial, aliases: [omme, wosm]}
  - {id: regiao_interamericana, nome: Região Interamericana, nivel: interamericano, aliases: [regiao interamericana]}
  - id: ueb
    nome: União dos Escoteiros do Brasil
    nivel: nacional
    aliases: [ueb, escoteiros do brasil]
    fonte: estatuto-2024#art6@p7
    citacao: "A UEB está organizada em três níveis: I - o NACIONAL … II - o REGIONAL … III - o LOCAL"
  - {id: regiao, nome: Região Escoteira, nivel: regional, aliases: [regiao, regiao escoteira], fonte: estatuto-2024#art6@p7}
  - id: distrito
    nome: Distrito Escoteiro
    nivel: distrital
    aliases: [distrito, distrito escoteiro, distritos escoteiros]
    fonte: estatuto-2024#art6@p7
    citacao: "Os Distritos Escoteiros têm atribuições definidas pela Diretoria Regional"
  - {id: grupo_escoteiro, nome: Grupo Escoteiro, nivel: local, aliases: [grupo escoteiro, grupos escoteiros],
     tipo_de: uel}
  - {id: secao_escoteira_autonoma, nome: Seção Escoteira Autônoma, nivel: local,
     aliases: [secao autonoma, secoes escoteiras autonomas], tipo_de: uel}

