     natureza: deliberativo, aliases: [assembleia regional], taxonomia: assembleias,
     instituido_em: estatuto-2024#art24@p17}
  - {id: diretoria_regional, nome: Diretoria Regional, nivel: regional, instituicao: regiao, natureza: executivo,
     aliases: [diretoria regional, diretorias regionais, direcao regional, dr], taxonomia: diretoria_regional,
     instituido_em: estatuto-2024#art27@p19}
  - {id: comissao_fiscal_regional, nome: Comissão Fiscal Regional, nivel: regional, instituicao: regiao,
     natureza: fiscal, aliases: [comissao fiscal regional], taxonomia: comissao_fiscal,
     instituido_em: estatuto-2024#art29@p21}
  - {id: comissao_de_etica_regional, nome: Comissão de Ética e Disciplina Regional, nivel: regional,
     instituicao: regiao, natureza: etico, aliases: [comissao de etica regional, cedr], taxonomia: comissao_de_etica,
     instituido_em: estatuto-2024#art30@p21, nota: "de criação facultativa"}
  - {id: conselho_consultivo_regional, nome: Conselho Consultivo Regional, nivel: regional, instituicao: regiao,
     natureza: consultivo, aliases: [conselho consultivo regional], taxonomia: conselho_consultivo,
     instituido_em: regulamento-regional-sp-2022#art44@p17}
  - {id: escritorio_regional, nome: Escritório Regional, nivel: regional, instituicao: regiao, natureza: apoio,
     aliases: [escritorio regional], instituido_em: a verificar, nota: "citado no Estatuto, Art. 28, XIV"}
  - {id: conselho_regional_jovem, nome: Conselho Regional Jovem, nivel: regional, instituicao: regiao,
     natureza: juvenil, aliases: [conselho jovem, conselho regional jovem], taxonomia: conselho_jovem,
     instituido_em: a verificar}
  - {id: conselho_regional_velhos_lobos, nome: Conselho Regional dos Portadores da Medalha de Velhos Lobos,
     nivel: regional, instituicao: regiao, natureza: consultivo, aliases: [velhos lobos, velho lobo],
     taxonomia: conselho_de_velhos_lobos, instituido_em: a verificar}
  - {id: comissao_regional_pioneira, nome: Comissão Regional Pioneira, nivel: regional, instituicao: regiao,
     natureza: juvenil, aliases: [comissao regional pioneira, forum regional pioneiro],
     taxonomia: comissao_regional_pioneira, instituido_em: a verificar}
  - {id: rede_de_jovens_lideres, nome: Rede de Jovens Líderes, nivel: nacional, instituicao: ueb, natureza: juvenil,
     aliases: [rede de jovens lideres, rede nacional de jovens lideres, rnjl], taxonomia: rede_de_jovens_lideres, instituido_em: a verificar,
     nota: "tem núcleos e fóruns regionais (Regulamento Geral da RNJL, Título IV)"}
  # --- local (Estatuto, Art. 31) -------------------------------------------------------------------------------------
  - {id: assembleia_de_grupo, nome: Assembleia de Grupo, nivel: local, instituicao: grupo_escoteiro,
     natureza: deliberativo, aliases: [assembleia de grupo], instituido_em: estatuto-2024#art32@p22}
  - {id: diretoria_de_grupo, nome: Diretoria de Grupo, nivel: local, instituicao: grupo_escoteiro,
     natureza: executivo, aliases: [diretoria de grupo, diretoria do grupo, diretoria de um grupo, diretoria do grupo escoteiro],
     instituido_em: estatuto-2024#art35@p24}
  - {id: comissao_fiscal_de_grupo, nome: Comissão Fiscal de Grupo, nivel: local, instituicao: grupo_escoteiro,
     natureza: fiscal, aliases: [comissao fiscal de grupo], instituido_em: estatuto-2024#art37@p26}
  - {id: conselho_de_pais, nome: Conselho de Pais, nivel: local, instituicao: grupo_escoteiro, natureza: apoio,
     aliases: [conselho de pais], instituido_em: estatuto-2024#art40@p26, nota: "um por seção"}

instituicoes:
  # As instituições reais (106 G3, research R20): o tipo (`instancia_de`), as de cima (`parte_de`, até 5 níveis) e a
  # fonte, um trecho do acervo. `jurisdicao` (a do catálogo) e `pasta` (a subpasta da UEL na taxonomia) dizem quais
  # documentos APLICA_SE_A a instituição; nos níveis de uma só instituição (mundial, interamericano, nacional), basta o
  # nível. Só reconhecem a pergunta as que têm `aliases`: a UEB, a OMME e a Interamericana já são reconhecidas pelo
  # tipo. Sem fonte no acervo, a instituição fica fora (decisão 1); os distritos e os outros grupos entram quando
  # tiverem documento e fonte.
  - {id: omme, nome: Organização Mundial do Movimento Escoteiro, instancia_de: omme, fonte: estatuto-2024#art1@p4,
     citacao: "titular do registro internacional junto à Organização Mundial do Movimento Escoteiro"}
  - {id: regiao_interamericana, nome: Região Escoteira Interamericana, instancia_de: regiao_interamericana,
     fonte: estatuto-2024#art1@p4, citacao: "membro fundador da Conferência Escoteira Interamericana"}
  - {id: ueb, nome: União dos Escoteiros do Brasil, instancia_de: ueb, parte_de: [regiao_interamericana, omme],
     fonte: estatuto-2024#art1@p4,
     citacao: "registro internacional junto à Organização Mundial … membro fundador da Conferência Escoteira Interamericana"}
  - id: regiao_sp
    nome: Região Escoteira de São Paulo
    instancia_de: regiao
    parte_de: [ueb]
    jurisdicao: sao-paulo
    aliases: [regiao escoteira de sao paulo, regiao de sao paulo, regiao sao paulo, regiao sp]
    fonte: regulamento-regional-sp-2022#art1@p2
    citacao: "normas complementares ao Estatuto da União dos Escoteiros do Brasil … aplicado à Região Escoteira de São Paulo"
  - id: ge_inah
    nome: Grupo Escoteiro Professora Inah de Mello, 147/SP
    instancia_de: grupo_escoteiro
    parte_de: [regiao_sp]
    pasta: grupo-escoteiro-professora-inah-de-mello-147-sp
    aliases: [grupo escoteiro professora inah de mello, professora inah de mello, inah de mello, ge inah, gepim]
    fonte: estatuto-gepim-2026#art1@p2
    citacao: "O Grupo Escoteiro Professora Inah de Mello, 147/SP … filiado a União dos Escoteiros do Brasil"
    parte_de_fonte: estatuto-gepim-2026#preambulo@p1

orgaos:
