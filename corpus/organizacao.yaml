     aliases: [assembleia nacional, assembleia escoteira nacional], taxonomia: assembleias,
     instituido_em: estatuto-2024#art12@p9}
  - {id: conselho_de_administracao_nacional, nome: Conselho de Administração Nacional, nivel: nacional,
     instituicao: ueb, natureza: diretivo, aliases: [can, conselho de administracao nacional],
     taxonomia: conselho_de_administracao_nacional, instituido_em: estatuto-2024#art16@p11}
  - {id: diretoria_executiva_nacional, nome: Diretoria Executiva Nacional, nivel: nacional, instituicao: ueb,
     natureza: executivo, aliases: [den, diretoria executiva nacional], taxonomia: diretoria_executiva_nacional,
     instituido_em: estatuto-2024#art18@p14}
  - {id: conselho_consultivo_nacional, nome: Conselho Consultivo, nivel: nacional, instituicao: ueb,
     natureza: consultivo, aliases: [conselho consultivo nacional, conselho consultivo, ccn], taxonomia: conselho_consultivo,
     instituido_em: estatuto-2024#art20@p15}
  - {id: comissao_fiscal_nacional, nome: Comissão Fiscal Nacional, nivel: nacional, instituicao: ueb,
     natureza: fiscal, aliases: [comissao fiscal nacional], taxonomia: comissao_fiscal,
     instituido_em: estatuto-2024#art21@p15}
  - {id: comissao_de_etica_nacional, nome: Comissão de Ética e Disciplina Nacional, nivel: nacional,
