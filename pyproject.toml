[project]
name = "ai-scouting"
version = "0.2.0"
description = "Pack de domínio escoteiro da plataforma Agentic AI (specs 1xx em agentic-app)."
readme = "README.md"
# Piso dos contratos, não o do core: o pack depende só de ai-core-contracts (spec 101, research R3).
requires-python = ">=3.12"
dependencies = [
    "ai-core-contracts>=0.1,<0.2",
    # Índice e ingestão (spec 102, research R2): só os adapters os importam (import-linter abaixo).
    "qdrant-client>=1.19,<2",
    "onnxruntime>=1.24.2",
    "tokenizers>=0.20,<1",
    "numpy",
    "snowballstemmer>=3,<4",
    "pypdfium2>=5,<6",
    "pyyaml>=6,<7",
]

[project.entry-points."ai_core.packs"]
scouting = "ai_scouting.pack:ScoutingPack"

# CLI offline da ingestão (spec 102, research R17); o pack.py compõe.
[project.scripts]
ai-scouting-corpus = "ai_scouting.pack:corpus_cli"

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "import-linter", "fpdf2", "types-PyYAML"]
# Só a integração com a plataforma (research R9): o core exige Python 3.14 e nunca é dependência de runtime.
platform = ["ai-core ; python_version >= '3.14'"]

[tool.uv]
default-groups = ["dev"]

# Os contratos (e o core, para a integração) vêm da mesma tag do repositório da plataforma (ADR-021, research R2,
# R22): o core resolve os contratos da própria tag, e o uv não aceita duas fontes para a mesma distribuição. Na v0.2.0
# os contratos são os da contracts-v0.1.1 (0.1.1).
[tool.uv.sources]
ai-core-contracts = { git = "ssh://git@github.com/CaioFerreiraB/agentic-app.git", tag = "v0.2.0", subdirectory = "ai-core/packages/contracts" }
ai-core = { git = "ssh://git@github.com/CaioFerreiraB/agentic-app.git", tag = "v0.2.0", subdirectory = "ai-core/packages/core" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Travessão e sinal de menos são texto legítimo em português (cabeçalhos de norma, fórmulas nas docstrings).
allowed-confusables = ["–", "−"]

[tool.ruff.lint.isort]
known-first-party = ["ai_scouting"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# Sem tipos publicados; só os adapters os importam (import-linter).
[[tool.mypy.overrides]]
module = ["snowballstemmer", "onnxruntime", "onnxruntime.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# Fronteiras do pack (spec 101, research R13; contracts/packaging.md).
[tool.importlinter]
root_packages = ["ai_scouting", "ai_core_contracts"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "o pack não importa o core"
type = "forbidden"
source_modules = ["ai_scouting"]
forbidden_modules = ["ai_core", "ai_generic"]

[[tool.importlinter.contracts]]
name = "só o pack.py compõe"
type = "layers"
layers = ["ai_scouting.pack", "ai_scouting.context | ai_scouting.prompts | ai_scouting.validators | ai_scouting.rag"]

[[tool.importlinter.contracts]]
name = "derivação e validators não alcançam modelo nem MCP"
type = "forbidden"
source_modules = ["ai_scouting.context", "ai_scouting.validators"]
forbidden_modules = ["ai_core_contracts.llm", "ai_core_contracts.mcp"]
# O `__init__` dos contratos reexporta tudo: o que se proíbe é o uso direto da API de modelo e de MCP.
allow_indirect_imports = true

# Índice e ingestão (spec 102, research R18).
[[tool.importlinter.contracts]]
name = "camadas do índice"
type = "layers"
layers = [
    "ai_scouting.rag.index.adapters",
    "ai_scouting.rag.index.domain",
    "ai_scouting.rag.index.ports",
    "ai_scouting.rag.index.api",
]

[[tool.importlinter.contracts]]
name = "camadas da ingestão"
type = "layers"
layers = [
    "ai_scouting.rag.ingestion.adapters",
    "ai_scouting.rag.ingestion.service",
    "ai_scouting.rag.ingestion.ports | ai_scouting.rag.ingestion.domain",
]

[[tool.importlinter.contracts]]
name = "o api.py do índice não importa o resto do índice nem a ingestão"
type = "forbidden"
source_modules = ["ai_scouting.rag.index.api"]
forbidden_modules = [
    "ai_scouting.rag.index.domain",
    "ai_scouting.rag.index.ports",
    "ai_scouting.rag.index.adapters",
    "ai_scouting.rag.ingestion",
]

[[tool.importlinter.contracts]]
name = "infraestrutura só em adapters/"
type = "forbidden"
source_modules = [
    "ai_scouting.rag.index.api",
    "ai_scouting.rag.index.domain",
    "ai_scouting.rag.index.ports",
    "ai_scouting.rag.ingestion.domain",
    "ai_scouting.rag.ingestion.ports",
    "ai_scouting.rag.ingestion.service",
]
forbidden_modules = ["qdrant_client", "onnxruntime", "tokenizers", "numpy", "snowballstemmer", "pypdfium2", "yaml"]

[[tool.importlinter.contracts]]
name = "os outros módulos do pack veem só o seam do índice"
type = "forbidden"
source_modules = ["ai_scouting.context", "ai_scouting.prompts", "ai_scouting.validators"]
forbidden_modules = [
    "ai_scouting.rag.ingestion",
    "ai_scouting.rag.index.domain",
    "ai_scouting.rag.index.ports",
    "ai_scouting.rag.index.adapters",
]

# Retrieval (spec 103, research R9): só o api.py do índice, nenhuma infraestrutura.
[[tool.importlinter.contracts]]
name = "camadas do retrieval"
type = "layers"
layers = [
    "ai_scouting.rag.retrieval.retriever | ai_scouting.rag.retrieval.reranker",
    "ai_scouting.rag.retrieval.domain",
]

[[tool.importlinter.contracts]]
name = "o retrieval vê do índice só o api.py"
type = "forbidden"
source_modules = ["ai_scouting.rag.retrieval"]
forbidden_modules = [
    "ai_scouting.rag.index.domain",
    "ai_scouting.rag.index.ports",
    "ai_scouting.rag.index.adapters",
    "ai_scouting.rag.ingestion",
    "qdrant_client",
    "onnxruntime",
    "tokenizers",
    "numpy",
    "snowballstemmer",
    "pypdfium2",
    "yaml",
]
