[project]
name = "axon-scouting"
version = "0.6.0"
description = "Pack de domínio escoteiro da plataforma Axon (specs 1xx em axon)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Piso dos contratos, não o do core: o pack depende só de axon-ai-contracts (spec 101, research R3).
requires-python = ">=3.12"
dependencies = [
    # 0.2.1: o hook `prepare` e o `PackContext.data_dir` (ADR-041).
    "axon-ai-contracts>=0.2.1,<0.3",
    # Índice e ingestão (spec 102, research R2): só os adapters os importam (import-linter abaixo).
    "qdrant-client>=1.19,<2",
    "onnxruntime>=1.24.2",
    "tokenizers>=0.20,<1",
    "numpy",
    "snowballstemmer>=3,<4",
    "pypdfium2>=5,<6",
    "pyyaml>=6,<7",
]

[project.entry-points."axon.packs"]
scouting = "axon_scouting.pack:ScoutingPack"

# CLI offline da ingestão (spec 102, research R17); o pack.py compõe.
[project.scripts]
axon-scouting-corpus = "axon_scouting.pack:corpus_cli"

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "import-linter", "fpdf2", "types-PyYAML"]
# Só a integração com a plataforma (research R9): o core exige Python 3.14 e nunca é dependência de runtime.
platform = ["axon-ai ; python_version >= '3.14'"]

[tool.uv]
default-groups = ["dev"]

# Os contratos (e o core, para a integração) vêm da mesma tag do repositório da plataforma (ADR-021, research R2,
# R22): o core resolve os contratos da própria tag, e o uv não aceita duas fontes para a mesma distribuição. Na
# v0.7.0-rc4 os contratos são os 0.2.1, com o hook `prepare` (ADR-041).
[tool.uv.sources]
axon-ai-contracts = { git = "ssh://git@github.com/CaioFerreiraB/axon.git", tag = "v0.7.0-rc4", subdirectory = "axon-ai/packages/contracts" }
axon-ai = { git = "ssh://git@github.com/CaioFerreiraB/axon.git", tag = "v0.7.0-rc4", subdirectory = "axon-ai/packages/core" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Travessão e sinal de menos são texto legítimo em português (cabeçalhos de norma, fórmulas nas docstrings).
allowed-confusables = ["–", "−"]

[tool.ruff.lint.isort]
known-first-party = ["axon_scouting"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# Sem tipos publicados; só os adapters os importam (import-linter).
[[tool.mypy.overrides]]
module = ["snowballstemmer", "onnxruntime", "onnxruntime.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# Fronteiras do pack (spec 101, research R13; contracts/packaging.md).
[tool.importlinter]
root_packages = ["axon_scouting", "axon_ai_contracts"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "o pack não importa o core"
type = "forbidden"
source_modules = ["axon_scouting"]
forbidden_modules = ["axon_ai", "axon_generic"]

[[tool.importlinter.contracts]]
name = "só o pack.py compõe"
type = "layers"
# As métricas (spec 105, research R10) ficam entre o pack e o resto: leem a derivação de `context/`, e os módulos da camada
# de baixo são independentes entre si.
layers = [
    "axon_scouting.pack",
    "axon_scouting.eval",
    "axon_scouting.context | axon_scouting.prompts | axon_scouting.validators | axon_scouting.rag",
]

[[tool.importlinter.contracts]]
name = "derivação, validators e métricas não alcançam modelo nem MCP"
type = "forbidden"
source_modules = ["axon_scouting.context", "axon_scouting.validators", "axon_scouting.eval"]
forbidden_modules = ["axon_ai_contracts.llm", "axon_ai_contracts.mcp"]
# O `__init__` dos contratos reexporta tudo: o que se proíbe é o uso direto da API de modelo e de MCP.
allow_indirect_imports = true

# Índice e ingestão (spec 102, research R18).
[[tool.importlinter.contracts]]
name = "camadas do índice"
type = "layers"
layers = [
    "axon_scouting.rag.index.adapters",
    "axon_scouting.rag.index.domain",
    "axon_scouting.rag.index.ports",
    "axon_scouting.rag.index.api",
]

[[tool.importlinter.contracts]]
name = "camadas da ingestão"
type = "layers"
layers = [
    "axon_scouting.rag.ingestion.adapters",
    "axon_scouting.rag.ingestion.service",
    "axon_scouting.rag.ingestion.ports | axon_scouting.rag.ingestion.domain",
]

[[tool.importlinter.contracts]]
name = "o api.py do índice não importa o resto do índice nem a ingestão"
type = "forbidden"
source_modules = ["axon_scouting.rag.index.api"]
forbidden_modules = [
    "axon_scouting.rag.index.domain",
    "axon_scouting.rag.index.ports",
    "axon_scouting.rag.index.adapters",
    "axon_scouting.rag.ingestion",
]

[[tool.importlinter.contracts]]
name = "infraestrutura só em adapters/"
type = "forbidden"
source_modules = [
    "axon_scouting.rag.index.api",
    "axon_scouting.rag.index.domain",
    "axon_scouting.rag.index.ports",
    "axon_scouting.rag.ingestion.domain",
    "axon_scouting.rag.ingestion.ports",
    "axon_scouting.rag.ingestion.service",
    "axon_scouting.eval",
]
forbidden_modules = ["qdrant_client", "onnxruntime", "tokenizers", "numpy", "snowballstemmer", "pypdfium2", "yaml"]

[[tool.importlinter.contracts]]
name = "os outros módulos do pack veem só o seam do índice"
type = "forbidden"
source_modules = ["axon_scouting.context", "axon_scouting.prompts", "axon_scouting.validators", "axon_scouting.eval"]
forbidden_modules = [
    "axon_scouting.rag.ingestion",
    "axon_scouting.rag.index.domain",
    "axon_scouting.rag.index.ports",
    "axon_scouting.rag.index.adapters",
]

# Retrieval (spec 103, research R9): só o api.py do índice, nenhuma infraestrutura.
[[tool.importlinter.contracts]]
name = "camadas do retrieval"
type = "layers"
layers = [
    "axon_scouting.rag.retrieval.retriever | axon_scouting.rag.retrieval.reranker | axon_scouting.rag.retrieval.catalog",
    "axon_scouting.rag.retrieval.domain",
]

[[tool.importlinter.contracts]]
name = "o retrieval vê do índice só o api.py"
type = "forbidden"
source_modules = ["axon_scouting.rag.retrieval"]
forbidden_modules = [
    "axon_scouting.rag.index.domain",
    "axon_scouting.rag.index.ports",
    "axon_scouting.rag.index.adapters",
    "axon_scouting.rag.ingestion",
    "qdrant_client",
    "onnxruntime",
    "tokenizers",
    "numpy",
    "snowballstemmer",
    "pypdfium2",
    "yaml",
]
