# Conjunto de regressão da recuperação do scouting (spec 105 US6, FR-014 a FR-016; research R13, R15).
#
# Nasceu da revisão do RAG de 2026-10-27 (docs/revisao-rag-scouting-2026-10.md no axon): "Qual o marco simbólico dos 5
# ramos?" chegava à geração com uma das cinco formulações. Cada item declara em `extra.facts` os fatos que precisam
# chegar aos trechos entregues — texto do próprio corpus, casado palavra a palavra depois da normalização da 101; uma
# lista dentro da lista são redações alternativas. A métrica é `scouting:fact_recall` (determinística).
#
# Não é a semente da curadoria (golden.yaml) nem substitui as perguntas reais: cobre padrões, não uma pergunta — o mesmo
# conceito por ramo, paráfrases, agregados ("cada ramo"), comparação, conceitos vizinhos (lema × marco simbólico) e
# regras do POR cujo corpo se perdia na ingestão. `extra.group` agrupa os itens no relatório; `extra.context.branches`
# é a derivação esperada das facetas (ADR-045), medida pela `scouting:context_accuracy`. Nenhuma calibração se
# decide sobre ele (FR-001); ele diz se uma mudança estrutural melhorou ou piorou a recuperação.
