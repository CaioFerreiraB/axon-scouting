# Avaliação do scouting contra a linha de base (spec 105 FR-005, clarificação 2; research R7, R8).
# Roda quando muda o que pode mexer na recuperação ou no contexto — corpus, RAG, prompt, derivação, métricas, pack,
# conjunto de avaliação ou dependências: com o e5 em cache, carrega o artefato do índice do pacote em memória (ADR-043:
# sem Qdrant nem ingestão no CI) e roda o conjunto semente pelo harness da 009 no perfil `test` (gerador simulado, sem
# modelo pago nem juiz). Só métricas determinísticas
# barram: saída 1 (regressão além da tolerância) ou 2 (entrada inválida) falham o job. Rodadas com modelo real e juiz
# são manuais (quickstart da 105, passo 5).
name: eval

on:
  pull_request:
    paths:
      - "corpus/**"
      - "src/axon_scouting/rag/**"
      - "src/axon_scouting/prompts/**"
      - "src/axon_scouting/context/**"
      - "src/axon_scouting/eval/**"
      - "src/axon_scouting/pack.py"
      - "eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "src/axon_scouting/rag/**"
      - "src/axon_scouting/prompts/**"
      - "src/axon_scouting/context/**"
      - "src/axon_scouting/eval/**"
      - "src/axon_scouting/pack.py"
      - "eval/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do axon
        run: |
          git config --global submodule.axon-scouting.update none
          git config --global submodule.axon-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --group platform
      # O e5 fixado por revisão e sha256 em e5.py: a chave muda só quando o modelo muda.
      - uses: actions/cache@v4
        with:
          path: .cache/e5
          key: e5-${{ hashFiles('src/axon_scouting/rag/index/adapters/e5.py') }}
      - name: Modelo de embedding (só baixa o que falta ou difere)
        run: uv run axon-scouting-corpus model fetch .cache/e5
      # O artefato commitado precisa espelhar o corpus: reingerir num diretório temporário dá os mesmos trechos.
      - name: O artefato espelha o corpus
        env:
          AXON_SCOUTING_EMBEDDING_DIR: .cache/e5
        run: |
          uv run axon-scouting-corpus ingest corpus/corpus.yaml --dir "$RUNNER_TEMP/index"
          cmp src/axon_scouting/data/index/chunks.jsonl "$RUNNER_TEMP/index/chunks.jsonl"
          cmp src/axon_scouting/data/index/documents.jsonl "$RUNNER_TEMP/index/documents.jsonl"
      - name: Conjunto de avaliação contra a linha de base
        env:
          AXON_PROFILE: test
          AXON_PACKS_FILE: eval/packs.yaml
          AXON_ASSISTANTS_FILE: eval/assistants.yaml
        run: >-
          uv run --group platform axon eval run
          --golden eval/golden.yaml --baseline eval/baseline.json --report report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: report.json
          if-no-files-found: ignore
