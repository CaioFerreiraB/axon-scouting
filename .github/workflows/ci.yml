# CI do ai-scouting (spec 101: FR-001, SC-003, US1 cen. 3; research R14).
# Os contratos (e o core, na integração) vêm da tag do agentic-app, que é privado: a deploy key só de leitura do
# agentic-app fica no segredo AGENTIC_APP_DEPLOY_KEY deste repositório. A partir da v0.2.0 o agentic-app tem os
# submódulos ai-scouting e agentic-deploy, que o uv tentaria inicializar ao clonar a tag e que a deploy key não lê; o
# pacote não precisa deles, então cada job os marca com `update = none` antes de resolver as dependências.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do agentic-app
        run: |
          git config --global submodule.ai-scouting.update none
          git config --global submodule.agentic-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do agentic-app
        run: |
          git config --global submodule.ai-scouting.update none
          git config --global submodule.agentic-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Sem o grupo platform, a integração é pulada: é a suíte padrão, só com os contratos (SC-003).
      - run: uv run pytest

  # O pack instalado normalmente, num ambiente só com os contratos: é aqui que a etapa de distribuição da conformidade
  # confere a faixa declarada (na instalação editável ela não tem o que verificar).
  clean-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do agentic-app
        run: |
          git config --global submodule.ai-scouting.update none
          git config --global submodule.agentic-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar o pack só com os contratos (Python 3.12, o piso)
        run: |
          uv venv --python 3.12 /tmp/clean
          uv pip install --python /tmp/clean/bin/python . pytest fpdf2
      - run: /tmp/clean/bin/python -m pytest -q tests --ignore=tests/integration

  # US1 cen. 1–2 na plataforma real, pelo perfil test (research R9).
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do agentic-app
        run: |
          git config --global submodule.ai-scouting.update none
          git config --global submodule.agentic-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --group platform
      - run: uv run --group platform pytest tests/integration

  # Conformidade do índice contra o servidor Qdrant (spec 102, research R16); o modo local roda no job test.
  qdrant:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      AI_SCOUTING_TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENTIC_APP_DEPLOY_KEY }}
      - name: Pular os submódulos do agentic-app
        run: |
          git config --global submodule.ai-scouting.update none
          git config --global submodule.agentic-deploy.update none
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/rag/index
